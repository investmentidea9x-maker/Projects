function bindManage(B) {
  if (W.mode === 'sbv') { bindSbv(); return; }
  const p = B.pol;
  const K = W.market; const ref = { rLt6: K.lt6, rM6_12: K.m6_12, rGt12: K.gt12, lendShort: K.lend - 1.0, lendMLT: K.lend + 0.5 };
  const bind = (id, key, isInt) => { const el = document.getElementById(id); if (!el) return; el.oninput = () => { const v = +el.value; p[key] = isInt ? Math.round(v) : v; if (key in ref) p.spread[key] = v - ref[key]; document.getElementById(id + '_v').textContent = (isInt ? String(Math.round(v)) : v.toFixed(2).replace('.', ',')) + el.dataset.unit; }; };
  $('#anchor').onchange = e => { p.anchor = e.target.value === '1'; if (p.anchor) for (const k in ref) p.spread[k] = p[k] - ref[k]; };
  bind('rCasa', 'rCasa'); bind('rLt6', 'rLt6'); bind('rM6_12', 'rM6_12'); bind('rGt12', 'rGt12');
  bind('lendShort', 'lendShort'); bind('lendMLT', 'lendMLT'); bind('appetite', 'appetite', true); bind('growthTarget', 'growthTarget', true);
  bind('carTarget', 'carTarget'); bind('gbondTarget', 'gbondTarget'); bind('cashBuffer', 'cashBuffer'); bind('digital', 'digital', true); bind('network', 'network', true); bind('divRate', 'divRate', true);
  for (const s of SECTORS) { const el = document.getElementById('mix_' + s.id); el.oninput = () => { p.mix[s.id] = +el.value / 100; document.getElementById('mix_' + s.id + '_v').textContent = el.value + '%'; }; }
  const msg = (m, ok) => { const el = $('#actMsg'); el.innerHTML = `<span class="pill ${ok ? 'good' : 'bad'}">${m}</span>`; };
  $('#bondBtn').onclick = () => { const e = B.issueBonds(+$('#bondAmt').value, false, W); e ? msg(e, false) : (msg('Đã phát hành.', true), renderGame()); };
  $('#subBtn').onclick = () => { const e = B.issueBonds(+$('#bondAmt').value, true, W); e ? msg(e, false) : (msg('Đã phát hành trái phiếu thứ cấp.', true), renderGame()); };
  $('#capBtn').onclick = () => { const e = B.raiseCapital(+$('#capAmt').value, W); e ? msg(e, false) : (msg('Tăng vốn thành công.', true), renderGame()); };
  $('#vamcBtn').onclick = () => { const e = B.sellToVamc(W); e ? msg(e, false) : (msg('Đã bán nợ cho VAMC.', true), renderGame()); };
  if (tab === 'manage') { /* giữ tab */ }
}

function bindSbv() {
  const S = W.sbv;
  const bind = (id, fn) => { const el = document.getElementById(id); if (!el) return; el.oninput = () => { const v = +el.value; fn(v); const vv = document.getElementById(id + '_v'); if (vv) vv.textContent = v.toFixed(2).replace('.', ',') + el.dataset.unit; }; };
  bind('refi', v => S.refi = v); bind('disc', v => S.disc = v); bind('omo', v => S.omo = v); bind('depCap6m', v => S.depCap6m = v);
  bind('rrrShort', v => S.rrrShort = v); bind('rrrLong', v => S.rrrLong = v);
  bind('omoPct', v => S.omoNet = v / 100 * W.sysDeposits()); bind('fxPct', v => S.fxSell = v / 100 * W.sysDeposits());
  bind('carMin', v => S.carMin = v); bind('ldrMax', v => S.ldrMax = v); bind('mltMax', v => S.mltMax = v); bind('sysRoom', v => S.sysRoom = v);
  $('#roomOn').onchange = e => S.roomOn = e.target.value === '1';
  $('#forb').onchange = e => { S.forbearance = e.target.value === '1'; W.forbearanceLeft = 0; };
  const msg = (m, ok) => { $('#actMsg').innerHTML = `<span class="pill ${ok ? 'good' : 'bad'}">${m}</span>`; };
  $('#refiBtn').onclick = () => { const b = W.banks[+$('#weakBank').value]; const a = b.totalAssets() * 0.03; b.cash += a; b.refi += a; b.refiRate = 0; b.reputation = Math.min(0, b.reputation + 1); W.macro.cpi += 0.05; b.addLog(W.month, `NHNN tái cấp vốn đặc biệt ${fmt0(a)} tỷ.`, 'good'); W.addLog(`Tái cấp vốn đặc biệt ${fmt0(a)} tỷ cho ${b.name}.`, 'warn'); msg('Đã bơm vốn.', true); };
  $('#mergeBtn').onclick = () => { const b = W.banks[+$('#weakBank').value]; const big = W.banks.filter(x => x !== b && !x.dead && x.type === 'sob').sort((x, y) => y.car() - x.car())[0]; if (!big) { msg('Không còn ngân hàng lớn đủ khỏe.', false); return; } mergeBank(b, big); W.addLog(`${b.name} được chuyển giao bắt buộc cho ${big.name}.`, 'warn'); msg('Đã chuyển giao.', true); renderGame(); };
  $('#roomCutBtn').onclick = () => { const b = W.banks[+$('#weakBank').value]; b.room = 0; b.addLog(W.month, 'NHNN cắt room tín dụng về 0.', 'bad'); msg('Đã cắt room.', true); };
}
function mergeBank(src, dst) {
  for (const s of SECTORS) for (const k of ['perf', 'w', 'g3', 'g4', 'g5']) dst.book[s.id][k] += src.book[s.id][k];
  for (const k in dst.dep) dst.dep[k] += src.dep[k];
  dst.cash += src.cash; dst.reserve += src.reserve; dst.ibLend += src.ibLend; dst.gbonds += src.gbonds; dst.fixed += src.fixed; dst.vamc += src.vamc; dst.prov += src.prov;
  dst.bonds += src.bonds; dst.subBonds += src.subBonds; dst.ibBorrow += src.ibBorrow; dst.refi += src.refi; dst.concentrated += src.concentrated;
  dst.equity.retained += src.totalEquity(); dst.loansAtYearStart += src.loansAtYearStart;
  src.dead = true; src.deadReason = 'chuyển giao bắt buộc'; src.announced = true;
  for (const s of SECTORS) src.book[s.id] = { perf: 0, w: 0, g3: 0, g4: 0, g5: 0 };
  src.dep = { casa: 0, lt6: 0, m6_12: 0, gt12: 0 }; src.cash = 0; src.reserve = 0; src.ibLend = 0; src.gbonds = 0; src.fixed = 0; src.vamc = 0; src.prov = 0; src.bonds = 0; src.subBonds = 0; src.ibBorrow = 0; src.refi = 0; src.equity = { charter: 0, retained: 0 }; src.concentrated = 0;
}

/* ---------- Tuân thủ ---------- */
function gauge(label, val, lim, isMax, maxScale, exp, unit = '%') {
  const ok = isMax ? val <= lim : val >= lim; const warn = isMax ? val <= lim * 1.05 : val >= lim * 0.95 && !ok;
  const cls = ok ? (isMax ? (val > lim - lim * 0.06 ? 'warn' : '') : (val < lim * 1.12 ? 'warn' : '')) : 'bad';
  const w = clamp(val / maxScale * 100, 0, 100), l = clamp(lim / maxScale * 100, 0, 100);
  return `<div class="gauge"><div class="lbl"><span>${label}</span><span class="num">${pp(val)} <span class="muted">(${isMax ? '≤' : '≥'} ${pp(lim, 1)})</span> <span class="pill ${ok ? 'good' : 'bad'}">${ok ? 'Đạt' : 'Vi phạm'}</span></span></div>
    <div class="bar"><div class="fill ${cls}" style="width:${w}%"></div><div class="lim" style="left:${l}%"></div></div><div class="exp">${exp}</div></div>`;
}

  setTimeout(() => { const s = $('#pickBank2'); if (s) s.onchange = () => { selectedBank = +s.value; renderGame(); }; }, 0);
  return `${pick}<div class="grid g2">
    <div class="panel"><h2>Tỷ lệ an toàn (NHNN)</h2>
      ${gauge('CAR – hệ số an toàn vốn (TT41/2016)', B.car(), S.carMin, false, 20, `Vốn tự có ${fmt0(B.tier1() + B.tier2())} / tài sản có rủi ro ${fmt0(B.rwa())}. Cấp 1 = vốn điều lệ + LN giữ lại; cấp 2 = trái phiếu thứ cấp (≤50% cấp 1) + dự phòng chung (≤1,25% RWA).`)}

function guidePane() {

      <li><b>Dự trữ thanh khoản ≥ 10%</b> tổng nợ phải trả: tiền mặt, DTBB, TPCP, cho vay liên NH.</li>
      <li><b>Trần lãi suất huy động dưới 6 tháng</b> (hiện 4,75%). Vượt là bị phạt. Trần lãi cho vay ngắn hạn lĩnh vực ưu tiên 4%.</li>
      <li><b>Room tín dụng</b>: NHNN cấp hạn mức tăng trưởng mỗi năm theo xếp hạng (CAR cao, nợ xấu thấp được nhiều). Vượt room bị phạt và cắt room năm sau. Giữa năm có thể được nới.</li>

      <li><b>Giới hạn cấp tín dụng một khách hàng</b> (Luật TCTD 2024): 14% vốn tự có, giảm dần về 10%. Xuất hiện trong sự kiện tập đoàn BĐS xin vay.</li>

    <h3>Cơ chế thanh khoản</h3>

  </div>`;
}

/* ---------- Biểu đồ (canvas, tự vẽ) ---------- */
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function lineChart(id, series, opts = {}) {
  const c = document.getElementById(id); if (!c) return;
  const dpr = window.devicePixelRatio || 1; const Wd = c.clientWidth || 600, Ht = 220;
  c.width = Wd * dpr; c.height = Ht * dpr; const g = c.getContext('2d'); g.scale(dpr, dpr);
  const pad = { l: 42, r: 10, t: 10, b: 22 };
  const n = Math.max(...series.map(s => s.data.length)); if (n < 2) { g.fillStyle = cssVar('--muted'); g.font = '12px ' + cssVar('--font'); g.fillText('Cần ít nhất 2 tháng dữ liệu.', pad.l, 40); return; }
  let all = series.flatMap(s => s.data).concat(opts.lines || []); let lo = Math.min(0, ...all), hi = Math.max(...all); if (hi === lo) hi = lo + 1; hi += (hi - lo) * 0.08;
  const x = i => pad.l + (Wd - pad.l - pad.r) * i / (n - 1), y = v => pad.t + (Ht - pad.t - pad.b) * (1 - (v - lo) / (hi - lo));
  g.strokeStyle = cssVar('--line'); g.lineWidth = 1; g.fillStyle = cssVar('--muted'); g.font = '11px ' + cssVar('--mono'); g.textAlign = 'right';
  const ticks = 4; for (let i = 0; i <= ticks; i++) { const v = lo + (hi - lo) * i / ticks; g.beginPath(); g.moveTo(pad.l, y(v)); g.lineTo(Wd - pad.r, y(v)); g.stroke(); g.fillText(v.toFixed(hi - lo > 20 ? 0 : 1), pad.l - 6, y(v) + 4); }
  g.textAlign = 'center'; const m0 = opts.m0 || 0; const stepL = Math.max(1, Math.round(n / 8));
  for (let i = 0; i < n; i += stepL) g.fillText(W.dateStr(m0 + i), x(i), Ht - 6);
  (opts.lines || []).forEach(v => { g.setLineDash([4, 4]); g.strokeStyle = cssVar('--bad'); g.beginPath(); g.moveTo(pad.l, y(v)); g.lineTo(Wd - pad.r, y(v)); g.stroke(); g.setLineDash([]); });
  series.forEach(s => { g.strokeStyle = cssVar(s.color); g.lineWidth = 2; g.beginPath(); s.data.forEach((v, i) => i ? g.lineTo(x(i), y(v)) : g.moveTo(x(i), y(v))); g.stroke();
    const last = s.data[s.data.length - 1]; g.fillStyle = cssVar(s.color); g.beginPath(); g.arc(x(s.data.length - 1), y(last), 3.5, 0, Math.PI * 2); g.fill(); });
}
function stackChart(id, layers, m0) {
  const c = document.getElementById(id); if (!c) return;
  const dpr = window.devicePixelRatio || 1; const Wd = c.clientWidth || 600, Ht = 220;
  c.width = Wd * dpr; c.height = Ht * dpr; const g = c.getContext('2d'); g.scale(dpr, dpr);
  const pad = { l: 52, r: 10, t: 10, b: 22 }; const n = layers[0].data.length; if (n < 1) return;
  const tot = []; for (let i = 0; i < n; i++) tot.push(sum(layers.map(l => l.data[i])));
  const hi = Math.max(...tot) * 1.05 || 1;
  const bw = (Wd - pad.l - pad.r) / n; const y = v => pad.t + (Ht - pad.t - pad.b) * (1 - v / hi);
  g.fillStyle = cssVar('--muted'); g.font = '11px ' + cssVar('--mono'); g.textAlign = 'right'; g.strokeStyle = cssVar('--line');
  for (let i = 0; i <= 4; i++) { const v = hi * i / 4; g.beginPath(); g.moveTo(pad.l, y(v)); g.lineTo(Wd - pad.r, y(v)); g.stroke(); g.fillText(v >= 1e6 ? (v / 1e6).toFixed(1) + 'tr' : v >= 1000 ? Math.round(v / 1000) + 'k' : Math.round(v), pad.l - 6, y(v) + 4); }
  for (let i = 0; i < n; i++) { let acc = 0; layers.forEach(l => { const v = l.data[i]; g.fillStyle = cssVar(l.color); const y1 = y(acc + v), y0 = y(acc); g.fillRect(pad.l + i * bw + 1, y1, Math.max(1, bw - 2), Math.max(0, y0 - y1 - (v > 0 ? 1 : 0))); acc += v; }); }
  g.textAlign = 'center'; const stepL = Math.max(1, Math.round(n / 8)); for (let i = 0; i < n; i += stepL) g.fillText(W.dateStr(m0 + i), pad.l + i * bw + bw / 2, Ht - 6);
}
function drawCharts(B) {
  if (tab !== 'overview') return;
  if (W.mode === 'bank') {
    const h = B.hist.slice(-36); if (!h.length) return; const m0 = h[0].m;
    lineChart('c1', [{ color: '--s1', data: h.map(x => x.car) }, { color: '--s2', data: h.map(x => x.npl) }, { color: '--s3', data: h.map(x => x.mlt) }, { color: '--s4', data: h.map(x => x.ldr / 10) }], { m0, lines: [W.sbv.carMin] });
    lineChart('c2', [{ color: '--s1', data: h.map(x => x.roe) }, { color: '--s2', data: h.map(x => x.nim) }, { color: '--s3', data: h.map(x => x.cof) }], { m0 });
    stackChart('c3', [{ color: '--s1', data: h.map(x => x.dep.casa) }, { color: '--s2', data: h.map(x => x.dep.lt6 + x.dep.m6_12) }, { color: '--s3', data: h.map(x => x.dep.gt12) }, { color: '--s4', data: h.map(x => x.bonds) }, { color: '--s5', data: h.map(x => x.ib) }, { color: '--s6', data: h.map(x => x.eq) }], m0);
  } else {
    const h = W.hist.slice(-36); if (!h.length) return; const m0 = h[0].m;
    lineChart('c1', [{ color: '--s1', data: h.map(x => x.cpi) }, { color: '--s2', data: h.map(x => x.gdp) }, { color: '--s3', data: h.map(x => x.fx) }, { color: '--s4', data: h.map(x => x.refi) }], { m0 });
    lineChart('c2', [{ color: '--s1', data: h.map(x => x.cg) }, { color: '--s2', data: h.map(x => x.npl) }, { color: '--s3', data: h.map(x => x.ibON) }], { m0, lines: [3] });
    stackChart('c3', [{ color: '--s1', data: h.map(x => x.loans / 1000) }], m0);
  }
}

}
function showEvent() {
  const ev = W.pendingEvent; if (!ev) return;
  const text = typeof ev.text === 'function' ? ev.text(W) : ev.text;
  if (ev.choice) showModal('Sự kiện: ' + ev.title, text, ev.choices.map(c => ({ label: c.label, apply: () => { c.apply(W); W.addLog(`Sự kiện: ${ev.title} → ${c.label}`, 'warn'); W.pendingEvent = null; renderGame(); } })));
  else showModal('Sự kiện: ' + ev.title, text, [{ label: 'Đã hiểu', apply: () => { W.pendingEvent = null; renderGame(); } }]);
}
function toast(m) { const el = document.createElement('div'); el.className = 'pill info'; el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:8px 14px;font-size:13px;z-index:30;background:var(--panel);border:1px solid var(--line);color:var(--fg)'; el.textContent = m; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }
function saveGame() { try { const data = JSON.stringify(W, (k, v) => (k === 'pendingEvent' ? null : v)); localStorage.setItem('banksim-vn', data); return true; } catch (e) { return false; } }
function loadGame() {
  try {
    const raw = localStorage.getItem('banksim-vn'); if (!raw) return false;
    const d = JSON.parse(raw); const w = new World(d.mode, d.playerId);
    Object.assign(w, d); w.banks = d.banks.map(bd => { const b = new Bank(BANKS.find(x => x.id === bd.id), bd.isPlayer); Object.assign(b, bd); return b; });
    w.player = d.mode === 'bank' ? w.banks.find(b => b.isPlayer) : null; w.pendingEvent = null; W = w; return true;
  } catch (e) { return false; }
}

renderStart();
window.addEventListener('resize', () => { if (W) drawCharts(W.mode === 'bank' ? W.player : W.banks[selectedBank]); });
</script>
