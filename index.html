<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BankSim Việt Nam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky KPI strip on top, tab bar, one content column; data-dense dashboard feel of a treasury desk. */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --fg:#14201c; --muted:#5c6b64; --line:#d9ded9;
  --accent:#0f6b4f; --accent-soft:#dcefe6;
  --good:#1f7a3a; --warn:#b26a00; --bad:#b8322b; --info:#1f5fa8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#4a3aa7;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141917; --panel:#1d2422; --fg:#e8ece9; --muted:#9aa8a1; --line:#33403b;
  --accent:#4fbf95; --accent-soft:#1c3a30;
  --good:#5ccf7c; --warn:#f0b04a; --bad:#f07a72; --info:#6aa8f0;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1d2422; --fg:#e8ece9; --muted:#9aa8a1; --line:#33403b;
  --accent:#4fbf95; --accent-soft:#1c3a30;
  --good:#5ccf7c; --warn:#f0b04a; --bad:#f07a72; --info:#6aa8f0;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);padding-inline:16px;padding-block:0 24px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
button{font:inherit;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 6px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.withlogo{display:flex;align-items:center;gap:8px}.withlogo .logo{flex:none}.logo{vertical-align:middle;border-radius:2px}
.brand h1{font-size:18px;font-weight:700;color:var(--accent)}
.brand .sub{color:var(--muted);font-size:12px}
.date{font-family:var(--mono);font-size:15px;font-weight:500}
.ctrl{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:4px 8px;font-size:12px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px;margin-top:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-family:var(--mono);font-size:16px;font-weight:500;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;color:var(--muted);padding:8px 12px;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.pane{padding-block:14px}

/* panels */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.panel h2{margin-bottom:8px}
.panel p{margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:4px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;border-top:2px solid var(--line)}
tr.sub td{color:var(--muted);padding-left:16px}
.tw{overflow-x:auto}
.muted{color:var(--muted)}
.small{font-size:12px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;letter-spacing:.02em}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}

/* nút hành động */
.arow{display:grid;grid-template-columns:minmax(150px,1fr) auto auto;gap:6px 10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.arow:last-child{border-bottom:0}
.arow .al{display:flex;flex-direction:column;min-width:0}.arow .lbl{font-weight:500}.arow .hint{font-size:11px;color:var(--muted)}
.arow .val{font-family:var(--mono);min-width:60px;text-align:right;white-space:nowrap}
.abtns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.abtns.wrap{justify-content:flex-start;margin-bottom:6px}
.seg{display:flex;gap:4px;flex-wrap:wrap;grid-column:2/-1;justify-content:flex-end}
.badtxt{color:var(--bad)}
@media (max-width:520px){.arow{grid-template-columns:1fr auto}.arow .abtns,.seg{grid-column:1/-1;justify-content:flex-start}}
/* controls */
.field{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.field:last-child{border-bottom:0}
.field label{font-weight:500}
.field .hint{grid-column:1/-1;font-size:12px;color:var(--muted)}
.field input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.field input[type=number],.field select{width:110px;font:inherit;font-family:var(--mono);padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.field .val{font-family:var(--mono);min-width:64px;text-align:right}
.mixrow{display:grid;grid-template-columns:150px 1fr 56px;gap:8px;align-items:center;padding:3px 0}
.mixrow input{width:100%;accent-color:var(--accent)}
.mixrow .val{font-family:var(--mono);text-align:right}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions input[type=number]{width:120px;font-family:var(--mono);padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}

/* compliance */
.gauge{margin:8px 0}
.gauge .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.gauge .bar{position:relative;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--good)}
.gauge .fill.warn{background:var(--warn)} .gauge .fill.bad{background:var(--bad)}
.gauge .lim{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg)}
.gauge .exp{font-size:12px;color:var(--muted);margin-top:3px}

/* log */
.log{max-height:420px;overflow:auto;font-size:13px}
.log div{padding:4px 0;border-bottom:1px solid var(--line)}
.log .t{font-family:var(--mono);color:var(--muted);margin-right:8px}
.log .bad{color:var(--bad)} .log .good{color:var(--good)} .log .warn{color:var(--warn)}

/* charts */
canvas.chart{width:100%;height:220px;display:block;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* sidebar shell */
body.game{padding:0}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.side-brand{display:flex;gap:10px;align-items:center}.side-brand b{font-size:15px;color:var(--accent);display:block;line-height:1.2}.side-brand .sub{font-size:11px;color:var(--muted);display:block}
.side-logo{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:6px;background:#a0182b;color:#fff;font-size:9px;font-weight:700;flex:none}
.side-clock .date{display:block;margin-bottom:4px;font-size:14px}
.side .ctrl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.side .ctrl select{grid-column:1/-1}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav .tab{text-align:left;border:0;border-left:3px solid transparent;border-radius:0 6px 6px 0;padding:7px 10px;color:var(--muted);background:none;font-weight:500;font-size:13px}
.side-nav .tab.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft)}
.side-kpis{display:grid;grid-template-columns:1fr 1fr;gap:5px}.side-kpis .kpi{padding:5px 7px}.side-kpis .kpi .v{font-size:13px}.side-kpis .kpi .l{font-size:10px}
.side-foot{margin-top:auto;display:flex;gap:6px}
.main{padding:0 16px 24px;min-width:0}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.side-nav{flex-direction:row;overflow-x:auto}.side-nav .tab{border-left:0;border-radius:0;border-bottom:2px solid transparent;white-space:nowrap}.side-nav .tab.active{border-bottom-color:var(--accent);background:none}.side-kpis{grid-template-columns:repeat(auto-fit,minmax(105px,1fr))}.side-foot{margin-top:0}}
/* real-time shell */
.clock{display:flex;flex-direction:column;gap:4px;min-width:150px}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent)}
.scene-wrap{margin-inline:-16px;background:#0b1020;border-bottom:1px solid var(--line)}
.scene-box{position:relative;max-width:1280px;margin:0 auto}
canvas#scene{display:block;width:100%;max-width:100%;aspect-ratio:480/140;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
canvas#hud{position:absolute;left:0;top:0;width:100%;aspect-ratio:480/140;height:auto;pointer-events:none}
.scene-wrap{position:relative}
.evcard{position:absolute;right:12px;bottom:12px;max-width:min(360px,60%);background:rgba(13,17,23,.92);color:#e6edf3;border:1px solid #e3b341;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.4;z-index:3}
.evcard h4{margin:0 0 4px;font-size:13px;color:#ffd84a}
.evcard .btn{margin-top:6px;background:#161b22;color:#e6edf3;border-color:#30363d}
@media (max-width:700px){.evcard{position:static;max-width:none;border-radius:0;border-left:0;border-right:0}}
.mktbar{background:#0d1117;color:#c9d1d9;font-family:var(--mono);font-size:12px;padding:5px 12px;border-top:1px solid #30363d;max-width:1280px;margin:0 auto;white-space:nowrap;overflow-x:auto}.mktbar b{color:#fff;font-weight:500}
.ticker-wrap{overflow:hidden;background:#0b1020;color:#ffd84a;font-family:var(--mono);font-size:12px;height:20px;line-height:20px;white-space:nowrap;position:relative}
.ticker{display:inline-block;white-space:nowrap;will-change:transform;padding-inline:8px}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:12px;align-items:start;margin-top:4px}
.split .left{min-width:0}
.term{background:#0d1117;color:#c9d1d9;font-family:var(--mono);font-size:12px;border:1px solid #30363d;border-radius:8px;padding:8px 10px;height:min(72vh,720px);min-height:260px;overflow:auto;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px)}
.term-head{color:#8b949e;text-transform:uppercase;letter-spacing:.06em;font-size:11px;border-bottom:1px solid #30363d;padding-bottom:4px;margin-bottom:4px}
.term .ln{white-space:pre-wrap;word-break:break-word;padding:1px 0;line-height:1.4}
.term .t{color:#8b949e;margin-right:6px}.term .src{color:#79c0ff;margin-right:2px}
.term .bad .msg{color:#ff7b72}.term .good .msg{color:#7ee787}.term .warn .msg{color:#e3b341}.term .info .msg{color:#79c0ff}.term .dim{color:#8b949e;border-top:1px dashed #30363d;margin-top:3px;padding-top:3px}
@media (max-width:900px){.split{grid-template-columns:1fr}.term{position:static;height:280px}}
/* start screen & modal */
.start{max-width:960px;margin:24px auto}
.start h1{font-size:30px;color:var(--accent);margin-bottom:4px}
.start .lead{max-width:65ch;color:var(--muted)}
.diffs{display:flex;flex-direction:column;gap:6px}.diff{display:block;padding:4px 0;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;text-align:left;color:var(--fg)}
.card:hover{border-color:var(--accent)}
.card h3{font-size:15px;margin-bottom:6px}
.card .meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:720px;width:100%;padding:18px;max-height:90vh;overflow:auto}
.modal h3{font-size:18px;margin-bottom:8px}
.modal .choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.modal .choices .btn{text-align:left}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{border-left:3px solid var(--warn);padding:6px 10px;background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:0 6px 6px 0;font-size:13px}
.alert.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.alert.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.replist{padding-left:18px;margin:4px 0}.replist li{margin:3px 0}
.rep{border-bottom:1px solid var(--line);padding:6px 0}.rep summary{cursor:pointer}.rep ul{padding-left:18px;margin:6px 0}.rep li{margin:3px 0}
.guide{max-width:72ch}
.guide h3{font-size:15px;margin:14px 0 4px}
.guide ul{padding-left:18px;margin:4px 0}
.guide li{margin:3px 0}
.guide code{font-family:var(--mono);font-size:12px;background:var(--bg);padding:1px 4px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){ .mixrow{grid-template-columns:110px 1fr 50px} .field input[type=number]{width:90px} }
</style>
</head>

<div id="app"></div>

<script>
'use strict';
/* =====================================================================
   BankSim Việt Nam – engine
   Đơn vị tiền: tỷ VND. Bước mô phỏng: 1 tháng. Lãi suất: %/năm.
   ===================================================================== */

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sum = arr => arr.reduce((a, b) => a + b, 0);
const rnd = (a, b) => a + Math.random() * (b - a);
const fmt0 = n => Math.round(n).toLocaleString('vi-VN');
const fmt1 = n => n.toLocaleString('vi-VN', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const pct = (x, d = 2) => (x * 100).toFixed(d).replace('.', ',') + '%';
const pp = (x, d = 2) => x.toFixed(d).replace('.', ',') + '%';
const MONTHS = ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'];

/* ---------- Khung pháp lý mặc định (theo mô hình Việt Nam) ---------- */
const REG = {
  carMin: 8.0,          // Thông tư 41/2016: CAR ≥ 8% (Basel II)
  ldrMax: 85,           // Thông tư 22/2019: dư nợ/tiền gửi ≤ 85%
  mltMax: 30,           // TT08/2020 sửa TT22: vốn ngắn hạn cho vay trung dài hạn ≤ 30% (từ 10/2023)
  liqReserveMin: 10,    // TT22: tỷ lệ dự trữ thanh khoản ≥ 10%
  rrrShort: 3.0,        // Dự trữ bắt buộc VND: không kỳ hạn & <12 tháng 3%
  rrrLong: 1.0,         // ≥12 tháng 1%
  depCap6m: 4.75,       // Trần lãi suất huy động VND < 6 tháng
  priorityCap: 4.0,     // Trần lãi suất cho vay ngắn hạn 5 lĩnh vực ưu tiên
  nplTarget: 3.0,       // Ngưỡng nợ xấu NHNN theo dõi
  genProv: 0.75,        // Dự phòng chung 0,75% dư nợ nhóm 1–4 (TT11/2021)
  provRates: { w: 0.05, g3: 0.20, g4: 0.50, g5: 1.00 }, // dự phòng cụ thể nhóm 2–5
  bigCustomerCap: 14,   // Luật TCTD 2024: giới hạn cấp tín dụng 1 khách hàng (% vốn tự có), giảm dần về 10%
};

/* ---------- Dữ liệu lịch sử vĩ mô Việt Nam 1/2022 – 9/2025 (xấp xỉ, tổng hợp từ NHNN, GSO, công bố ngân hàng; đủ để khởi đầu trò chơi) ----------
   cpi: CPI YoY %; gdp: GDP quý YoY %; refi: lãi suất tái cấp vốn; ibON: liên ngân hàng qua đêm; usd: VND/USD liên ngân hàng cuối tháng;
   dep12: lãi huy động 12 tháng bình quân; lend: lãi cho vay bình quân; cg: tín dụng YoY %; res: dự trữ ngoại hối tỷ USD; fed: Fed funds (trần);
   m2: cung tiền YoY %; re: chỉ số nhiệt bất động sản (1 = bình thường); npl: nợ xấu nội bảng NH niêm yết %; credit: dư nợ toàn hệ thống (triệu tỷ) */
const START = { y: 2025, mo: 9 }; // trò chơi bắt đầu tháng 10/2025, ngay sau điểm dữ liệu cuối
const HIST = {
  cpi:   [1.94,1.42,2.41,2.64,2.86,3.37,3.14,2.89,3.94,4.30,4.37,4.55, 4.89,4.31,3.35,2.81,2.43,2.00,2.06,2.96,3.66,3.59,3.45,3.58, 3.37,3.98,3.97,4.40,4.44,4.34,4.36,3.45,2.63,2.89,2.77,2.94, 3.63,2.91,3.13,3.12,3.24,3.57,3.19,3.24,3.38],

/* =====================================================================

class Bank {
  constructor(spec, isPlayer) {
    const T = TYPES[spec.type];
    this.id = spec.id; this.type = spec.type; this.name = spec.name; this.isPlayer = isPlayer;
    this.spec = spec; this.code = spec.code;
    this.brand = spec.brand ?? T.brand; this.opexRate = spec.opex ?? T.opex; // chi phí hoạt động, % tổng tài sản/năm
    this.concentrated = 0; // dư nợ tập trung vào 1 khách hàng BĐS (sự kiện)
    this.vamc = 0;         // trái phiếu đặc biệt VAMC
    const TA = spec.assets;
    const loans = TA * spec.loanRatio;
    // Sổ cho vay: mỗi phân khúc có 5 nhóm nợ (nhóm 1 = perf, nhóm 2 = w, nhóm 3–5)
    this.book = {};
    for (const s of SECTORS) {
      const tot = loans * spec.mix[s.id];
      const bad = tot * spec.npl * (s.id === 're' || s.id === 'cons' ? 1.4 : 0.8);
      this.book[s.id] = { perf: tot - bad - tot * 0.012, w: tot * 0.012, g3: bad * 0.4, g4: bad * 0.3, g5: bad * 0.3 };
    }
    this.gbonds = TA * spec.gbond;
    this.fixed = TA * 0.015;
    this.equity = { charter: TA * spec.eqRatio * 0.75, retained: TA * spec.eqRatio * 0.25 };
    const dep = TA * spec.depRatio;
    this.dep = { casa: dep * spec.casa, lt6: dep * (1 - spec.casa) * 0.45, m6_12: dep * (1 - spec.casa) * 0.30, gt12: dep * (1 - spec.casa) * 0.25 };
    this.bonds = TA * spec.bonds;                               // giấy tờ có giá ≥12 tháng
    this.subBonds = TA * (spec.type === 'jsb' ? 0.02 : 0.01);   // trái phiếu thứ cấp (vốn cấp 2)
    this.other = TA * 0.03;                                     // phải trả khác, không chịu lãi
    this.otherA = TA * 0.05;                                    // tài sản khác (phải thu, góp vốn, TPDN), không sinh lãi, RW 100%
    const structural = Math.max(0, TA - dep - this.bonds - this.subBonds - this.other - this.totalEquity());
    this.wholesale = structural * 0.7;                          // vay nước ngoài, vay dài hạn TCTD khác (ổn định, tính vào LDR và nguồn TDH)
    this.ibBorrow = structural * 0.3;                           // vay liên ngân hàng ngắn hạn
    this.refi = 0;
    this.prov = this.requiredProvision();
    this.reserve = this.requiredReserve(REG.rrrShort, REG.rrrLong);
    // Tiền mặt + cho vay liên ngân hàng là phần còn lại của tài sản
    this.cash = 0; this.ibLend = 0;
    const rest = this.totalLiab() + this.totalEquity() - this.totalAssets();
    this.cash = Math.max(TA * 0.015, Math.min(rest, TA * 0.03)); this.ibLend = Math.max(0, rest - this.cash);
    if (rest < this.cash) { this.gbonds -= (this.cash - rest); } // thiếu thì bớt TPCP
    // Hiệu chỉnh tài sản có rủi ro để CAR khởi đầu khớp CAR công bố
    this.rwaAdj = 1; if (spec.car) this.rwaAdj = clamp((this.tier1() + this.tier2()) / (spec.car / 100) / this.rwa(), 0.6, 1.6);
    // Chính sách điều hành
    this.pol = {
      rCasa: 0.3, rLt6: 4.5 + (spec.depAdj ?? T.depAdj) * 0.5, rM6_12: 5.2 + (spec.depAdj ?? T.depAdj), rGt12: 5.8 + (spec.depAdj ?? T.depAdj),
      lendShort: 9.0 + (spec.lendAdj ?? T.lendAdj), lendMLT: 10.5 + (spec.lendAdj ?? T.lendAdj),
      growthTarget: 14, mix: { ...spec.mix }, appetite: spec.id === 'vpb' ? 4 : T.appetite,
      digital: spec.digital ?? T.digital, network: spec.network ?? 1, gbondTarget: spec.gbond * 100, cashBuffer: 3.0,
      carTarget: Math.max(REG.carMin + 0.5, Math.min(T.carTarget, (spec.car || 10) - 0.6)), divRate: T.divRate,
      anchor: true, spread: { rLt6: 0, rM6_12: 0, rGt12: 0, lendShort: 0, lendMLT: 0 }, // neo theo thị trường, giữ chênh lệch
    };
    this.mech = null; // bản ghi cơ chế cho vay & dự trữ của tháng gần nhất
    // trạng thái
    this.loansAtYearStart = this.grossLoans();
    this.room = 14; this.roomBreachMonths = 0;
    this.carBreach = 0; this.liqFail = 0; this.dead = false; this.deadReason = '';
    this.capitalRaisedThisYear = false;
    this.reputation = 0; // <0 = bị nghi ngờ (rút tiền)
    this.hist = []; this.log = [];
    this.pnlYTD = this.emptyPnl(); this.lastPnl = this.emptyPnl();
    this.fine = 0; this.score = 0;
    this.latent = {}; for (const s of SECTORS) this.latent[s.id] = 0; // nợ xấu tiềm ẩn từ cho vay dễ dãi, bộc lộ sau 6–18 tháng
    this.unhappy = 0; this.roeLast = null; this.opexInfl = 1;
  }
  applyAnchor(mkt, sbv) { // lãi suất = thị trường + chênh lệch người chơi đặt
    const p = this.pol, sp = p.spread;
    p.rLt6 = Math.min(sbv.depCap6m, Math.max(0.5, mkt.lt6 + sp.rLt6)); p.rM6_12 = Math.max(0.5, mkt.m6_12 + sp.rM6_12); p.rGt12 = Math.max(0.5, mkt.gt12 + sp.rGt12);
    p.lendShort = Math.max(1, mkt.lend - 1.0 + sp.lendShort); p.lendMLT = Math.max(1, mkt.lend + 0.5 + sp.lendMLT);
  }
  emptyPnl() { return { ii: 0, ie: 0, fee: 0, opex: 0, prov: 0, tax: 0, net: 0, other: 0 }; }
  /* --- tổng hợp --- */
  sectorTotal(id) { const b = this.book[id]; return b.perf + b.w + b.g3 + b.g4 + b.g5; }
  grossLoans() { return SECTORS.reduce((a, s) => a + this.sectorTotal(s.id), 0) + this.concentrated; }
  perfLoans() { return SECTORS.reduce((a, s) => a + this.book[s.id].perf + this.book[s.id].w, 0) + this.concentrated; }
  nplAmount() { return SECTORS.reduce((a, s) => a + this.book[s.id].g3 + this.book[s.id].g4 + this.book[s.id].g5, 0); }
  nplRatio() { const g = this.grossLoans(); return g > 0 ? this.nplAmount() / g : 0; }
  mltLoans() { return SECTORS.reduce((a, s) => a + this.sectorTotal(s.id) * s.mlt, 0) + this.concentrated * 0.7; }
  deposits() { return this.dep.casa + this.dep.lt6 + this.dep.m6_12 + this.dep.gt12; }
  totalAssets() { return this.cash + this.reserve + this.ibLend + this.gbonds + this.grossLoans() - this.prov + this.fixed + this.vamc + (this.otherA || 0); }
  totalLiab() { return this.deposits() + this.bonds + this.subBonds + this.ibBorrow + this.refi + (this.other || 0) + (this.wholesale || 0); }
  totalEquity() { return this.equity.charter + this.equity.retained; }
  requiredReserve(rS, rL) { return (this.dep.casa + this.dep.lt6 + this.dep.m6_12) * rS / 100 + this.dep.gt12 * rL / 100; }
  requiredProvision() {
    let spec = 0, gen = 0;
    for (const s of SECTORS) {
      const b = this.book[s.id]; const c = 1 - s.coll; // phần không được khấu trừ tài sản bảo đảm
      spec += (b.w * REG.provRates.w + b.g3 * REG.provRates.g3 + b.g4 * REG.provRates.g4 + b.g5 * REG.provRates.g5) * c;
      gen += (b.perf + b.w + b.g3 + b.g4) * REG.genProv / 100;
    }
    gen += this.concentrated * REG.genProv / 100;
    return spec + gen;
  }
  genProvision() { return (this.perfLoans() + SECTORS.reduce((a, s) => a + this.book[s.id].g3 + this.book[s.id].g4, 0)) * REG.genProv / 100; }
  rwa() {
    let credit = 0;
    for (const s of SECTORS) credit += this.sectorTotal(s.id) * s.rw;
    credit += this.concentrated * 2.0 + this.ibLend * 0.2 + this.fixed * 1.0 + this.vamc * 0.2 + (this.otherA || 0) * 1.0;
    return credit * 1.10 * (this.rwaAdj || 1); // + rủi ro hoạt động & thị trường (xấp xỉ 10%), hiệu chỉnh theo CAR công bố
  }
  tier1() { return this.equity.charter + this.equity.retained; }
  tier2() { return Math.min(this.subBonds, this.tier1() * 0.5) + Math.min(this.genProvision(), this.rwa() * 0.0125); }
  car() { const r = this.rwa(); return r > 0 ? (this.tier1() + this.tier2()) / r * 100 : 0; }
  ldr() { const d = this.deposits() + this.bonds + this.subBonds + (this.wholesale || 0); return d > 0 ? this.grossLoans() / d * 100 : 0; } // TT22: tiền gửi KH + GTCG + vốn vay dài hạn
  mltRatio() {
    const mltSrc = this.dep.gt12 + this.bonds + this.subBonds + (this.wholesale || 0) + this.totalEquity() - this.fixed;
    const stSrc = this.dep.casa + this.dep.lt6 + this.dep.m6_12 + this.ibBorrow + this.refi;
    return stSrc > 0 ? Math.max(0, this.mltLoans() - mltSrc) / stSrc * 100 : 0;
  }
  liqReserve() { const L = this.totalLiab(); return L > 0 ? (this.cash + this.reserve + this.gbonds + this.ibLend) / L * 100 : 0; }
  creditGrowthYTD() { return this.loansAtYearStart > 0 ? (this.grossLoans() / this.loansAtYearStart - 1) * 100 : 0; }
  costOfFunds() {
    const p = this.pol; const d = this.dep;
    const tot = this.deposits() + this.bonds + this.subBonds + this.ibBorrow + this.refi + (this.wholesale || 0);
    return tot > 0 ? (d.casa * p.rCasa + d.lt6 * p.rLt6 + d.m6_12 * p.rM6_12 + d.gt12 * p.rGt12 + this.bonds * this.bondRate + this.subBonds * (this.bondRate + 1.5) + this.ibBorrow * this.ibRate + this.refi * this.refiRate + (this.wholesale || 0) * (this.wsRate || 0)) / tot : 0;
  }
  sectorRate(s, mkt) {
    const p = this.pol; const ap = APPETITE[p.appetite - 1];
    let r = (p.lendShort * (1 - s.mlt) + p.lendMLT * s.mlt) + s.spread + ap.spread;
    if (s.capped) r = Math.min(p.lendShort, mkt.priorityCap) * 0.25 + (p.lendShort + s.spread + ap.spread) * (1 - s.mlt - 0.25) + (p.lendMLT + s.spread + ap.spread) * s.mlt; // trần LS ưu tiên chỉ áp cho 25% sổ (vay ngắn hạn đúng đối tượng)
    return r;
  }
  healthSpread() { // phụ trội lãi suất liên ngân hàng khi ngân hàng yếu
    let sp = 0; const car = this.car(), npl = this.nplRatio() * 100;
    if (car < 9) sp += 1.0; if (car < 8) sp += 2.0;
    if (npl > 3) sp += 0.7; if (npl > 5) sp += 2.0;
    if (this.liqReserve() < 10) sp += 1.0;
    if (this.reputation < 0) sp += -this.reputation * 1.5;
    return sp;
  }
  addLog(m, msg, cls) { this.log.unshift({ m, msg, cls }); if (this.log.length > 400) this.log.pop(); }

  /* ---------------- bước 1 tháng ---------------- */
  step(W) {
    if (this.dead) return;
    const M = W.macro, mkt = W.market, sbv = W.sbv, p = this.pol, ap = APPETITE[p.appetite - 1];
    const pnl = this.emptyPnl();
    const binds = [];
    this.bondRate = this.bondRate ?? (mkt.gt12 + 1.0);
    this.ibRate = mkt.ibON + this.healthSpread();
    this.refiRate = sbv.refi;
    this.wsRate = M.fedRate + 1.2 + Math.max(0, M.fx) * 0.5 + this.healthSpread() * 0.3; // vay USD: Fed + phụ trội, cộng chi phí phòng ngừa tỷ giá
    const monthIdx = W.month;
    if (this.isPlayer && p.anchor) this.applyAnchor(mkt, sbv);

    /* 1. Thu nhập lãi & chi phí lãi */
    let ii = 0;
    for (const s of SECTORS) {
      const b = this.book[s.id]; const r = this.sectorRate(s, mkt) / 1200;
      ii += (b.perf + b.w) * r; // nhóm 3–5 không dự thu lãi
    }
    ii += this.concentrated * 12 / 1200;
    ii += this.gbonds * mkt.gbondYield / 1200 + this.ibLend * mkt.ibON / 1200 + this.reserve * 0.5 / 1200;
    const ie = (this.dep.casa * p.rCasa + this.dep.lt6 * p.rLt6 + this.dep.m6_12 * p.rM6_12 + this.dep.gt12 * p.rGt12) / 1200
      + this.bonds * this.bondRate / 1200 + this.subBonds * (this.bondRate + 1.5) / 1200 + this.ibBorrow * this.ibRate / 1200 + this.refi * this.refiRate / 1200
      + (this.wholesale || 0) * this.wsRate / 1200; // vay nước ngoài: lãi theo USD + phụ trội tỷ giá
    const TA = this.totalAssets();
    const fee = TA * (0.45 + 0.18 * p.digital + 0.05 * this.brand) / 1200;
    this.opexInfl *= 1 + (0.03 + Math.max(0, M.cpi - 3) * 0.012) / 12; // lương và chi phí tăng theo lạm phát
    const opex = TA * (this.opexRate * this.opexInfl + 0.12 * p.digital + 0.10 * p.network) / 1200 + this.fixed * 0.02 / 12;
    pnl.ii = ii; pnl.ie = ie; pnl.fee = fee; pnl.opex = opex;
    this.cash += ii - ie + fee - opex;

    /* 2. Sổ cho vay: thu nợ, chuyển nhóm, xử lý nợ xấu */
    let runoffTotal = 0;
    const stress = W.stressFor(this); // hệ số vĩ mô (BĐS, tỷ giá, lãi suất)
    let writeoff = 0, recovery = 0;
    for (const s of SECTORS) {
      const b = this.book[s.id];
      const runoff = b.perf * ((1 - s.mlt) / 9 + s.mlt / 60);
      b.perf -= runoff; runoffTotal += runoff;
      // chuyển nhóm
      let pdm = s.pd * ap.pd * stress.pd * (1 + s.reSens * stress.re + s.fxSens * stress.fx);
      pdm *= 1 + 0.06 * Math.max(0, this.sectorRate(s, mkt) - 9); // lãi cao → khách trả kém
      if (s.id === 'agri') pdm *= 1 + stress.agri; if (s.id === 'corp') pdm *= 1 + stress.sme * 0.5;
      if (sbv.forbearance) pdm *= 0.55; // Thông tư 02: cơ cấu nợ, giữ nguyên nhóm nợ
      const lat = Math.min(b.perf * 0.5, this.latent[s.id] * 0.07); this.latent[s.id] -= lat; // nợ tiềm ẩn bộc lộ
      const toW = b.perf * pdm + lat;
      const wToG3 = b.w * 0.25 * (sbv.forbearance ? 0.5 : 1), wCure = b.w * 0.20;
      const g3To4 = b.g3 * 0.30, g3Cure = b.g3 * 0.10;
      const g4To5 = b.g4 * 0.30, g4Rec = b.g4 * 0.05;
      const g5Wo = b.g5 * 0.15;
      b.perf += -toW + wCure + g3Cure; b.w += toW - wToG3 - wCure;
      b.g3 += wToG3 - g3To4 - g3Cure; b.g4 += g3To4 - g4To5 - g4Rec; b.g5 += g4To5 - g5Wo;
      const rec = g5Wo * s.coll * 0.8; // thu hồi từ tài sản bảo đảm sau khi xóa nợ (thu nhập khác)
      recovery += rec; writeoff += g5Wo;
      this.cash += rec + g4Rec; // g4Rec là khách trả nợ gốc, không phải thu nhập
    }
    this.cash += runoffTotal;
    // VAMC: thu hồi dần 5%/tháng, trích lập 20%/năm theo quy định
    if (this.vamc > 0) { const rec = this.vamc * 0.05; this.vamc -= rec; this.cash += rec; const vprov = this.vamc * 0.20 / 12; pnl.prov += vprov; this.vamc -= vprov; } // trích lập VAMC: vào chi phí dự phòng, trừ vốn ở bước 9
    // dự phòng: xóa nợ dùng dự phòng, rồi trích thêm cho đủ
    this.prov -= writeoff; // xóa nợ nhóm 5 (phần thu hồi đã ghi nhận vào tiền)
    // phần thu hồi vượt dự phòng đã dùng ghi nhận vào thu nhập khác
    pnl.other = recovery;
    const reqProv = this.requiredProvision();
    const provExp = Math.max(reqProv - this.prov, -this.prov * 0.1); // hoàn nhập tối đa 10%/tháng
    this.prov += provExp; pnl.prov += provExp;

    /* 3. Huy động */
    const D = W.diff;
    const depStress = (Math.max(0, this.nplRatio() * 100 - 4) * 1.5 + (this.car() < 8 ? 6 : 0) + Math.max(0, -this.reputation) * 6 + stress.dep) * D.dep;
    // cạnh tranh: ngân hàng khác trả lãi cao hơn thì hút mất khách của bạn
    const comp = W.compRates(this); const cpen = k => D.comp * 3 * Math.max(0, comp[k] - p[k]);
    const baseG = mkt.depGrowth + 1.5 * p.network + 1.5 * this.brand;
    const gCasa = (5 + 5 * p.digital + 2 * this.brand - 1.5 * (mkt.m6_12 - 5.0) + 0.3 * mkt.depGrowth - depStress * 1.5) / 1200;
    const gLt6 = (baseG + 5 * (Math.min(p.rLt6, sbv.depCap6m) - mkt.lt6) - depStress - cpen('rLt6')) / 1200;
    const gM = (baseG + 5 * (p.rM6_12 - mkt.m6_12) - depStress - cpen('rM6_12')) / 1200;
    const gG = (baseG + 5 * (p.rGt12 - mkt.gt12) - depStress - cpen('rGt12')) / 1200;
    const d0 = this.deposits();
    this.dep.casa *= 1 + clamp(gCasa, -0.25, 0.04);
    this.dep.lt6 *= 1 + clamp(gLt6, -0.25, 0.025);
    this.dep.m6_12 *= 1 + clamp(gM, -0.25, 0.025);
    this.dep.gt12 *= 1 + clamp(gG, -0.25, 0.025);
    this.cash += this.deposits() - d0;
    if (p.rLt6 > sbv.depCap6m + 1e-9) { const f = TA * 0.0002; this.cash -= f; this.equity.retained -= f; pnl.other -= f; this.addLog(monthIdx, `Vượt trần lãi suất huy động <6 tháng (${pp(sbv.depCap6m)}): NHNN xử phạt ${fmt0(f)} tỷ.`, 'bad'); }

    /* 4. Giấy tờ có giá đáo hạn */
    const bMat = this.bonds / 36; this.bonds -= bMat; this.cash -= bMat;
    const sMat = this.subBonds / 60; this.subBonds -= sMat; this.cash -= sMat;
    if (this.wholesale > 0) { const wMat = this.wholesale / 48; const roll = this.healthSpread() < 2 && !(W.shock('fx') > 0.8) ? wMat : 0; this.wholesale -= wMat - roll; this.cash -= wMat - roll; } // vay nước ngoài: đảo hạn được nếu khỏe và không có sốc tỷ giá
    // cập nhật lãi suất phát hành (trung bình dần về thị trường)
    this.bondRate = this.bondRate * 0.97 + (mkt.gt12 + 1.0 + this.healthSpread() * 0.5) * 0.03;

    /* 5. Giải ngân mới */
    const perfTot = this.perfLoans();
    const demand = {}; let demTot = 0;
    for (const s of SECTORS) {
      const b = this.book[s.id];
      const rate = this.sectorRate(s, mkt); const mktRate = mkt.lend + s.spread + APPETITE[2].spread + 1.5 * s.mlt - 1.0 * (1 - s.mlt); // tham chiếu = thị trường + khẩu vị cân bằng + phụ trội kỳ hạn
      const runoff = (b.perf) * ((1 - s.mlt) / 9 + s.mlt / 60);
      // Cầu vay = thay thế nợ đến hạn + nhu cầu tăng thêm; lãi cao hơn thị trường 1 điểm % → cầu giảm ~17%
      const E = Math.exp(-(s.elas ?? 0.18) * (rate - mktRate) - 0.06 * D.comp * Math.max(0, this.pol.lendShort - comp.lendShort)) * stress.demand; // khách tiêu dùng ít nhạy lãi, doanh nghiệp nhạy nhất
      let d = runoff * E + this.sectorTotal(s.id) * mkt.creditDemand * (14 + (s.id === 're' ? 6 * stress.reHeat : 0)) / 1200 * E * ap.dem;
      demand[s.id] = Math.max(0, d); demTot += demand[s.id];
    }
    const mixSum = sum(Object.values(p.mix)) || 1;
    const target = perfTot * Math.max(0, p.growthTarget) / 1200 + runoffTotal;
    // Phân bổ 2 vòng: vòng 1 theo tỷ trọng mục tiêu, vòng 2 dồn phần chưa dùng sang ngành còn cầu
    let disb = {}; let disbTot = 0; let unused = 0;
    for (const s of SECTORS) { const slot = target * (p.mix[s.id] / mixSum); disb[s.id] = Math.min(demand[s.id], slot); unused += slot - disb[s.id]; disbTot += disb[s.id]; }
    if (unused > 0) { let rem = SECTORS.reduce((a, s) => a + Math.max(0, demand[s.id] - disb[s.id]), 0); if (rem > 0) { const f0 = Math.min(1, unused / rem); for (const s of SECTORS) { const add = Math.max(0, demand[s.id] - disb[s.id]) * f0; disb[s.id] += add; disbTot += add; } } }
    if (disbTot < target * 0.98) binds.push('cầu tín dụng');
    // Ràng buộc
    const gross = this.grossLoans();
    const caps = [];
    if (sbv.roomOn) { const roomLeft = this.loansAtYearStart * (1 + this.room / 100) - gross; caps.push({ n: 'room tín dụng', v: Math.max(0, roomLeft) + 0 }); }
    const rwaHead = (this.tier1() + this.tier2()) / (Math.max(p.carTarget, sbv.carMin) / 100) - this.rwa();
    const avgRw = SECTORS.reduce((a, s) => a + s.rw * (p.mix[s.id] / mixSum), 0) * 1.10;
    caps.push({ n: 'CAR mục tiêu', v: Math.max(0, rwaHead / avgRw) });
    caps.push({ n: 'LDR ' + sbv.ldrMax + '%', v: Math.max(0, sbv.ldrMax / 100 * (this.deposits() + this.bonds + this.subBonds + (this.wholesale || 0)) - gross) });
    const reqRes = this.requiredReserve(sbv.rrrShort, sbv.rrrLong);
    const ibLimit = this.deposits() * Math.max(0.03, 0.30 - this.healthSpread() * 0.045); // ngân hàng yếu bị thị trường 2 đóng cửa dần
    const liquidityAvail = this.cash + this.ibLend + Math.max(0, ibLimit - this.ibBorrow) + Math.max(0, this.gbonds * 0.9 - this.refi) - (reqRes - this.reserve) - this.deposits() * p.cashBuffer / 100;
    caps.push({ n: 'thanh khoản', v: Math.max(0, liquidityAvail) });
    let cap = Infinity, capName = '';
    for (const c of caps) if (c.v < cap) { cap = c.v; capName = c.n; }
    let f = 1;
    if (disbTot > cap) { f = cap / disbTot; binds.push(capName); }
    // trần vốn ngắn hạn cho vay TDH
    const mltSrc = this.dep.gt12 + this.bonds + this.subBonds + (this.wholesale || 0) + this.totalEquity() - this.fixed;
    const stSrc = this.dep.casa + this.dep.lt6 + this.dep.m6_12 + this.ibBorrow + this.refi;
    const mltNewCap = Math.max(0, mltSrc + stSrc * sbv.mltMax / 100 - this.mltLoans());
    let mltNew = SECTORS.reduce((a, s) => a + disb[s.id] * f * s.mlt, 0);
    let fm = 1; if (mltNew > mltNewCap) { fm = mltNewCap / mltNew; binds.push('vốn NH cho vay TDH ' + sbv.mltMax + '%'); }
    let newLoans = 0;
    for (const s of SECTORS) { const x = disb[s.id] * f * (s.mlt > 0.5 ? fm : 1); this.book[s.id].perf += x; newLoans += x; this.latent[s.id] += x * Math.max(0, ap.pd - 1) * 0.35 * D.pd; }
    this.cash -= newLoans;
    this.lastDisb = newLoans; this.lastDemand = demTot; this.lastTarget = target; this.binds = binds;
    // Bản ghi cơ chế cho vay & dự trữ (hiển thị ở tab Tổng quan)
    this.mech = { depStart: d0, depEnd: this.deposits(), reqRes, resHeld: this.reserve, cashBefore: this.cash + newLoans, buffer: this.deposits() * p.cashBuffer / 100,
      runoff: runoffTotal, demand: demTot, target, caps: caps.map(c => ({ n: c.n, v: c.v })), cap, capName, disb: newLoans, mltCap: mltNewCap, mltNew, writeoff, recovery, provExp, ibLimit };

    /* 6. Trái phiếu Chính phủ theo tỷ trọng mục tiêu */
    const gbTarget = this.totalAssets() * p.gbondTarget / 100;
    let dG = clamp(gbTarget - this.gbonds, -this.gbonds * 0.2, this.cash * 0.5);
    if (dG > 0 && this.cash - dG < reqRes - this.reserve + this.deposits() * p.cashBuffer / 100) dG = 0;
    this.gbonds += dG; this.cash -= dG;

    /* 7. Dự trữ bắt buộc */
    const dR = reqRes - this.reserve; this.reserve = reqRes; this.cash -= dR;

    /* 8. Liên ngân hàng & tái cấp vốn: đóng vị thế cũ, mở vị thế mới */
    this.cash += this.ibLend - this.ibBorrow - this.refi; this.ibLend = 0; this.ibBorrow = 0; this.refi = 0;
    const buffer = this.deposits() * p.cashBuffer / 100;
    if (this.cash < buffer) {
      let need = buffer - this.cash;
      const ib = Math.min(need, Math.max(0, ibLimit) * (W.ibFrozen ? 0.3 : 1)); this.ibBorrow = ib; this.cash += ib; need -= ib;
      if (need > 0) { const rf = Math.min(need, this.gbonds * 0.9); this.refi = rf; this.cash += rf; need -= rf; }
      if (need > 0 && this.cash < 0) { // bán TPCP lỗ, sau đó là mất thanh khoản
        const sell = Math.min(this.gbonds - this.refi / 0.9, -this.cash * 1.03);
        if (sell > 0) { this.gbonds -= sell; this.cash += sell * 0.97; const loss = sell * 0.03; this.equity.retained -= loss; pnl.other -= loss; this.addLog(monthIdx, `Bán ${fmt0(sell)} tỷ TPCP với giá thấp để bù thanh khoản (lỗ ${fmt0(loss)} tỷ).`, 'warn'); }
      }
      if (this.cash < 0) { this.liqFail++; this.reputation -= 1; this.addLog(monthIdx, `MẤT THANH KHOẢN: thiếu ${fmt0(-this.cash)} tỷ, không vay được liên ngân hàng. Khách hàng bắt đầu rút tiền.`, 'bad'); this.ibBorrow += -this.cash; this.cash = 0; }
      else this.liqFail = 0;
    } else { this.ibLend = this.cash - buffer; this.cash = buffer; this.liqFail = 0; }
    if (this.mech) Object.assign(this.mech, { ibBorrow: this.ibBorrow, refi: this.refi, ibLend: this.ibLend, cashEnd: this.cash, ibRate: this.ibRate });

    /* 9. Thuế, lợi nhuận */
    const pbt = pnl.ii - pnl.ie + pnl.fee - pnl.opex - pnl.prov + pnl.other;
    pnl.tax = Math.max(0, pbt * 0.20); pnl.net = pbt - pnl.tax;
    this.cash -= pnl.tax; this.equity.retained += pnl.ii - pnl.ie + pnl.fee - pnl.opex - pnl.prov + recovery - pnl.tax;
    // pnl.other đã gồm phạt/lỗ đã trừ trực tiếp vào retained ở trên → tránh trừ 2 lần
    this.lastPnl = pnl;
    for (const k in pnl) this.pnlYTD[k] += pnl[k];

    /* 10. Uy tín hồi phục dần */
    this.reputation = Math.min(0, this.reputation + 0.25);
    if (this.nplRatio() < 0.03 && this.car() > 9) this.reputation = Math.min(0, this.reputation + 0.25);

    /* 11. Kiểm tra tuân thủ */
    const car = this.car();
    if (car < sbv.carMin) { this.carBreach++; if (this.carBreach === 1) this.addLog(monthIdx, `CAR ${pp(car)} thấp hơn mức tối thiểu ${pp(sbv.carMin)}. NHNN yêu cầu phương án tăng vốn.`, 'bad'); }
    else this.carBreach = 0;
    if (this.ldr() > sbv.ldrMax + 0.01) this.addLog(monthIdx, `LDR ${pp(this.ldr())} vượt trần ${sbv.ldrMax}%: phải huy động thêm hoặc hãm cho vay.`, 'warn');
    if (this.mltRatio() > sbv.mltMax + 0.01) this.addLog(monthIdx, `Vốn ngắn hạn cho vay trung dài hạn ${pp(this.mltRatio())} vượt ${sbv.mltMax}%.`, 'warn');
    if (sbv.roomOn && this.creditGrowthYTD() > this.room + 0.05) { this.roomBreachMonths++; if (this.roomBreachMonths === 1) this.addLog(monthIdx, `Tăng trưởng tín dụng ${pp(this.creditGrowthYTD())} vượt room ${this.room}%.`, 'bad'); }
    if (this.liqFail >= 2 || car < 4 || this.carBreach >= 12) {
      this.dead = true; this.deadReason = this.liqFail >= 2 ? 'mất khả năng thanh toán kéo dài' : car < 4 ? 'âm vốn (CAR < 4%)' : 'CAR dưới mức tối thiểu 12 tháng liên tục';
      this.addLog(monthIdx, `NHNN đặt ngân hàng vào diện KIỂM SOÁT ĐẶC BIỆT do ${this.deadReason}.`, 'bad');
    }
    /* 12. lịch sử */
    this.hist.push({ m: monthIdx, TA: this.totalAssets(), car, ldr: this.ldr(), mlt: this.mltRatio(), npl: this.nplRatio() * 100, liq: this.liqReserve(),
      nim: (pnl.ii - pnl.ie) * 12 / Math.max(1, this.totalAssets()) * 100, roe: pnl.net * 12 / Math.max(1, this.totalEquity()) * 100,
      dep: { ...this.dep }, bonds: this.bonds + this.subBonds, ib: this.ibBorrow + this.refi, eq: this.totalEquity(), loans: this.grossLoans(), net: pnl.net, cof: this.costOfFunds(), growth: this.creditGrowthYTD(),
      nii: pnl.ii - pnl.ie, provExp: pnl.prov, room: this.room, lendAvg: SECTORS.reduce((a, s) => a + this.sectorRate(s, mkt) * this.sectorTotal(s.id), 0) / Math.max(1, this.grossLoans()), ibON: mkt.ibON, refi: sbv.refi, cpi: M.cpi, gdp: M.gdp, fx: M.fx, usd: M.usd, depSys: mkt.depSys, lendSys: mkt.lendSys, sysCof: mkt.cof });
    if (this.hist.length > 240) this.hist.shift();
  }

  yearEnd(W) {
    const yearNet = this.pnlYTD.net;
    let divRate = this.pol.divRate;
    if (this.type === 'sob' && divRate < 30 && this.isPlayer) { divRate = 30; this.addLog(W.month, 'Bộ Tài chính yêu cầu nộp cổ tức tiền mặt tối thiểu 30% lợi nhuận về ngân sách.', 'warn'); }
    if (yearNet > 0 && divRate > 0) {
      if (this.car() < 9 || this.nplRatio() > 0.03) this.addLog(W.month, 'NHNN không chấp thuận chia cổ tức tiền mặt (CAR < 9% hoặc nợ xấu > 3%).', 'warn');
      else { const d = yearNet * divRate / 100; this.cash -= d; this.equity.retained -= d; this.addLog(W.month, `Chia cổ tức tiền mặt ${fmt0(d)} tỷ (${divRate}% lợi nhuận).`, 'good'); }
    }
    const roe = yearNet / Math.max(1, this.totalEquity()) * 100; this.roeLast = roe;
    const roeTarget = W.diff.roe - (this.type === 'sob' ? 3 : 0);
    this.score += Math.round(roe - roeTarget / 2);
    if (this.isPlayer) {
      if (roe < roeTarget - 5 && W.month > 12) { this.unhappy++; this.addLog(W.month, `ROE năm ${pp(roe, 1)} thấp hơn kỳ vọng ${roeTarget}% của ${this.type === 'sob' ? 'Nhà nước' : 'cổ đông'}. Cảnh báo ${this.unhappy}/3: ba năm là bị thay Tổng giám đốc.`, 'bad'); }
      else if (roe >= roeTarget) { this.unhappy = Math.max(0, this.unhappy - 1); this.addLog(W.month, `ROE năm ${pp(roe, 1)} đạt kỳ vọng ${roeTarget}%. Điểm CEO +${Math.round(roe - roeTarget / 2)}.`, 'good'); }
      if (this.unhappy >= 3) { this.dead = true; this.deadReason = 'bị thay Tổng giám đốc vì hiệu quả kém 3 năm liền'; }
    }
    this.pnlYTD = this.emptyPnl();
    this.loansAtYearStart = this.grossLoans();
    this.capitalRaisedThisYear = false;
    if (this.roomBreachMonths > 0) { this.addLog(W.month, `Bị NHNN cắt room năm sau vì vượt room tín dụng.`, 'bad'); this.roomPenalty = true; }
    this.roomBreachMonths = 0;
  }

  /* ---- hành động chủ động ---- */
  issueBonds(amount, sub, W) {
    if (amount <= 0) return 'Số tiền không hợp lệ.';
    if (this.car() < 8 && !sub) return 'Nhà đầu tư từ chối mua vì CAR dưới 8%.';
    const max = this.totalAssets() * 0.05;
    if (amount > max) return `Thị trường chỉ hấp thụ tối đa ${fmt0(max)} tỷ/tháng (5% tổng tài sản).`;
    if (sub) { if (this.subBonds + amount > this.tier1() * 0.5) return 'Vốn cấp 2 chỉ được tính tối đa 50% vốn cấp 1.'; this.subBonds += amount; }
    else this.bonds += amount;
    const fee = amount * 0.005; this.cash += amount - fee; this.equity.retained -= fee; this.pnlYTD.other -= fee;
    this.bondRate = (this.bondRate ?? (W.market.gt12 + 1)) * 0.8 + (W.market.gt12 + (sub ? 2.0 : 1.0) + this.healthSpread() * 0.5) * 0.2;
    this.addLog(W.month, `Phát hành ${fmt0(amount)} tỷ ${sub ? 'trái phiếu thứ cấp (vốn cấp 2)' : 'giấy tờ có giá kỳ hạn 3 năm'}, lãi ~${pp(this.bondRate + (sub ? 1.5 : 0))}.`, 'good');
    return null;
  }
  raiseCapital(amount, W) {
    if (amount <= 0) return 'Số tiền không hợp lệ.';
    if (this.capitalRaisedThisYear) return 'Mỗi năm chỉ được tăng vốn một lần (cần ĐHĐCĐ và NHNN chấp thuận).';
    if (amount > this.equity.charter * 0.4) return 'Cổ đông chỉ chấp thuận tối đa 40% vốn điều lệ hiện tại.';
    const ok = Math.random() < (this.type === 'sob' ? 0.55 : 0.85) - (this.nplRatio() > 0.04 ? 0.25 : 0);
    this.capitalRaisedThisYear = true;
    if (!ok) { this.addLog(W.month, `Phương án tăng vốn ${fmt0(amount)} tỷ không được chấp thuận năm nay.`, 'bad'); return 'Không được chấp thuận. Thử lại năm sau.'; }
    const fee = amount * 0.02; this.equity.charter += amount; this.cash += amount - fee; this.equity.retained -= fee; this.pnlYTD.other -= fee;
    this.addLog(W.month, `Tăng vốn điều lệ thêm ${fmt0(amount)} tỷ (phí phát hành ${fmt0(fee)} tỷ).`, 'good');
    return null;
  }
  sellToVamc(W) {
    const npl = this.nplAmount(); if (npl < 1) return 'Không có nợ xấu để bán.';
    // Bán nợ nhóm 5 và 4 cho VAMC lấy trái phiếu đặc biệt, giá = dư nợ − dự phòng cụ thể đã trích
    let sold = 0, provUsed = 0;
    for (const s of SECTORS) { const b = this.book[s.id]; const c = 1 - s.coll; sold += b.g4 + b.g5; provUsed += (b.g4 * 0.5 + b.g5 * 1.0) * c; b.g4 = 0; b.g5 = 0; }
    this.prov -= provUsed; this.vamc += sold - provUsed;
    this.addLog(W.month, `Bán ${fmt0(sold)} tỷ nợ nhóm 4–5 cho VAMC, nhận trái phiếu đặc biệt ${fmt0(sold - provUsed)} tỷ (phải trích lập 20%/năm).`, 'warn');
    return null;
  }
}

/* =====================================================================
   Thế giới: vĩ mô, NHNN, thị trường, các ngân hàng
   ===================================================================== */
class World {
  constructor(mode, playerId, diff = 'real') {
    this.mode = mode; // 'bank' | 'sbv'
    this.diffKey = diff; this.diff = DIFF[diff] || DIFF.real;
    this.month = 0; this.year = START.y; this.monthOfYear = START.mo + 1;
    const L = HIST_N - 1; const yoyFx = (HIST.usd[L] / HIST.usd[L - 12] - 1) * 100;
    this.macro = { gdp: HIST.gdp[L], cpi: HIST.cpi[L], fedRate: HIST.fed[L], fx: +Math.min(4, yoyFx * 0.6).toFixed(2), usd: HIST.usd[L], re: HIST.re[L], rePrev: HIST.re[L - 1], reserves: HIST.res[L], m2: HIST.m2[L], oil: 0,
      u: HIST.u[L], pie: HIST.cpi.slice(L - 5, L + 1).reduce((a, b) => a + b, 0) / 6, gap: 0 };
    for (let i = L - 23; i <= L; i++) this.macro.gap = MAC.gapDecay * this.macro.gap + (HIST.gdp[i] - MAC.gStar) / 12; // khoảng cách sản lượng tích lũy từ lịch sử
    this.us = { t: 38, period: 84 }; // chu kỳ Mỹ đang đi xuống: Fed vừa bắt đầu hạ lãi suất
    this.lastEv = {};
    this.sbv = { refi: 4.5, disc: 3.0, omo: 4.0, depCap6m: 4.75, rrrShort: 3.0, rrrLong: 1.0, ldrMax: 85, mltMax: 30, carMin: 8, roomOn: true, sysRoom: 16, forbearance: false, omoNet: 0, fxSell: 0, fxSpot: 0, ops: [], bill: 3.5 };
    this.sbv.refi = HIST.refi[HIST_N - 1]; this.sbv.omo = this.sbv.refi - 0.5; this.sbv.disc = this.sbv.refi - 1.5; this.sbv.bill = this.sbv.refi - 1.0;
    this.market = {};
    this.shocks = []; this.log = []; this.eventQueue = [];
    this.forbearanceLeft = 0; this.lastPolicyMove = -12;
    // Hệ thống cố định: 4 SOB + 5 JSB. Ở chế độ ngân hàng, người chơi điều hành một trong 9.
    this.banks = BANKS.map(spec => new Bank(spec, mode === 'bank' && spec.id === playerId));
    this.player = mode === 'bank' ? this.banks.find(b => b.isPlayer) : null;
    this.playerId = playerId;
    this.assignRoom();
    this.updateMarket();
    for (const b of this.banks) { b.bondRate = this.market.gt12 + 1; this.initPolicy(b); }
    // Lịch sử thật 1/2022–9/2025 nạp vào biểu đồ; dư nợ thật quy đổi theo quy mô 9 ngân hàng trong game
    const scale = this.sysLoans() / (HIST.credit[HIST_N - 1] * 1e6);
    this.hist = [];
    for (let i = 0; i < HIST_N; i++) {
      const cofH = HIST.dep12[i] - 1.2; const t = i - (HIST_N - 1);
      this.hist.push({ m: t, hist: true, cpi: HIST.cpi[i], gdp: HIST.gdp[i], u: HIST.u[i], real: HIST.refi[i] - HIST.cpi[i], taylor: MAC.rStar + HIST.cpi[i] + 0.5 * (HIST.cpi[i] - MAC.piStar) + 0.4 * (HIST.gdp[i] - MAC.gStar) * 0.5, fx: i >= 12 ? (HIST.usd[i] / HIST.usd[i - 12] - 1) * 100 : 1.0, usd: HIST.usd[i], re: HIST.re[i], ibON: HIST.ibON[i], refi: HIST.refi[i],
        depSys: HIST.dep12[i] - 1.3, lendSys: HIST.lend[i] + 1.6 /* quy về bình quân danh mục, gồm bán lẻ và tiêu dùng */, cof: cofH, fed: HIST.fed[i], loans: HIST.credit[i] * 1e6 * scale, npl: HIST.npl[i], cg: HIST.cg[i], reserves: HIST.res[i], m2: HIST.m2[i], minCar: 9, maxNpl: HIST.npl[i] * 2, phase: HIST.refi[i] >= 6 ? 'tight' : HIST.re[i] < 0.7 ? 'bust' : HIST.cpi[i] > 4.3 ? 'hot' : 'expand' });
    }
    // Tín dụng đầu năm 2025 theo tăng trưởng YTD thật đến tháng 9 (~13%)
    const ytd = 0.13; this.sysLoansYearStart = this.sysLoans() / (1 + ytd); for (const b of this.banks) b.loansAtYearStart = b.grossLoans() / (1 + ytd);
    this.sysCreditGrowthAnn = HIST.cg[HIST_N - 1];
    this.ibFrozen = false;
    this.pendingEvent = null;
  }
  sysLoans() { return sum(this.banks.filter(b => !b.dead).map(b => b.grossLoans())); }
  sysDeposits() { return sum(this.banks.filter(b => !b.dead).map(b => b.deposits())); }
  sysNpl() { const g = this.sysLoans(); return g ? sum(this.banks.filter(b => !b.dead).map(b => b.nplAmount())) / g : 0; }
  sysCreditGrowth() { return (this.sysLoans() / this.sysLoansYearStart - 1) * 100; }
  shock(k) { return this.shocks.reduce((a, s) => a + (s[k] || 0), 0); }
  shockMul(k) { return this.shocks.reduce((a, s) => a * (s[k] ?? 1), 1); }
  addShock(s) { this.shocks.push(s); }
  addLog(msg, cls) { this.log.unshift({ m: this.month, msg, cls }); if (this.log.length > 300) this.log.pop(); }
  dateStr(m = this.month) { const idx = START.mo + m; const y = START.y + Math.floor(idx / 12); return `${MONTHS[((idx % 12) + 12) % 12]}/${y}`; }

  compRates(b) { // lãi suất tốt nhất mà đối thủ đang chào
    const o = this.banks.filter(x => x !== b && !x.dead); if (!o.length) return { rLt6: 0, rM6_12: 0, rGt12: 0, lendShort: 99 };
    const top = k => o.map(x => x.pol[k]).sort((a, c) => c - a).slice(0, 3).reduce((a, c) => a + c, 0) / Math.min(3, o.length);
    const ls = o.map(x => x.pol.lendShort).sort((a, c) => a - c); return { rLt6: top('rLt6'), rM6_12: top('rM6_12'), rGt12: top('rGt12'), lendShort: ls[Math.floor(ls.length / 2)] }; // tham chiếu = trung vị, không phải người rẻ nhất
  }
  assignRoom() {
    for (const b of this.banks) {
      let r = this.sbv.sysRoom;
      if (b.car() > 11) r += 1.5; if (b.car() < 9) r -= 3;
      if (b.nplRatio() > 0.03) r -= 2.5; if (b.nplRatio() < 0.015) r += 1;
      if (b.roomPenalty) { r -= 4; b.roomPenalty = false; }
      b.room = Math.max(0, Math.round(r * 2) / 2);
    }
  }
  updateMarket() {
    const M = this.macro, S = this.sbv;
    // độ căng thanh khoản hệ thống: LDR hệ thống, hút/bơm của NHNN, cú sốc
    const alive = this.banks.filter(b => !b.dead);
    const sysDep = this.sysDeposits(), sysLoan = this.sysLoans();
    const ldrSys = sysDep > 0 ? sysLoan / (sysDep + sum(alive.map(b => b.bonds + b.subBonds + (b.wholesale || 0)))) : 0.8;
    const netBorrow = sum(alive.map(b => b.ibBorrow + b.refi - Math.max(0, b.ibLend - 0.06 * b.totalAssets()))); // chỉ phần gửi liên NH vượt mức đệm 6% TS mới là tiền thừa
    let tight = (ldrSys - 0.82) * 15 + netBorrow / Math.max(1, sysDep) * 20 + this.shock('ib') - S.omoNet / Math.max(1, sysDep) * 100 + S.fxSell / Math.max(1, sysDep) * 60;
    tight = clamp(tight, -0.8, 4);
    this.tightness = tight;
    let ibON = Math.max(0.3, S.omo + 0.4 * tight + rnd(-0.2, 0.2));
    if (this.mode === 'sbv') { // lãi suất đợt bơm là trần mềm, lãi suất tín phiếu là sàn mềm của liên ngân hàng
      const inj = S.ops.filter(o => o.kind === 'inject'), abs = S.ops.filter(o => o.kind === 'absorb');
      const wavg = a => a.length ? sum(a.map(o => o.amt * (o.rate ?? S.omo))) / Math.max(1, sum(a.map(o => o.amt))) : null;
      const ri = wavg(inj), ra = wavg(abs);
      if (ri != null && sum(inj.map(o => o.amt)) > 20000) ibON = Math.min(ibON, ri + 0.25);
      if (ra != null && sum(abs.map(o => o.amt)) > 20000) ibON = Math.max(ibON, ra - 0.25);
    }
    this.ibFrozen = tight > 3;
    // Lãi suất huy động thị trường = neo chính sách + phụ trội thanh khoản + kỳ vọng lạm phát + cạnh tranh (tỷ lệ ngân hàng thiếu nguồn)
    const needy = alive.length ? alive.filter(b => b.ldr() > 83 || b.liqReserve() < 12).length / alive.length : 0;
    const infl = 0.15 * Math.max(0, M.cpi - 3.5);
    const lt6 = Math.max(1.5, Math.min(S.depCap6m, S.refi - 0.3 + 0.3 * tight + 0.5 * infl + 0.3 * needy));
    const m6_12 = Math.max(2.5, S.refi + 0.6 + 0.35 * tight + infl + 0.5 * needy);
    const gt12 = Math.max(3.0, S.refi + 1.2 + 0.3 * tight + infl + 0.4 * needy);
    // Chi phí vốn thực tế của hệ thống (bình quân gia quyền các ngân hàng) → lãi cho vay = chi phí vốn + chi phí hoạt động + rủi ro + thanh khoản + biên
    const cof = this.sysCostOfFunds(gt12, ibON);
    const riskPrem = 0.35 * Math.max(0, this.sysNpl() * 100 - 1.5);
    const lend = cof + 1.3 + riskPrem + 0.25 * Math.max(0, tight) + 2.6 + this.diff.nim; // chi phí vốn + chi phí hoạt động + rủi ro + thanh khoản + biên
    // Lãi suất thực tế đang áp dụng (quan sát) của hệ thống
    const sysDepR = alive.length ? sum(alive.map(b => b.deposits() * (b.dep.casa * b.pol.rCasa + b.dep.lt6 * b.pol.rLt6 + b.dep.m6_12 * b.pol.rM6_12 + b.dep.gt12 * b.pol.rGt12) / Math.max(1, b.deposits()))) / Math.max(1, sysDep) : m6_12;
    const sysLendR = alive.length ? sum(alive.map(b => SECTORS.reduce((a, sec) => a + b.sectorTotal(sec.id) * b.sectorRate(sec, { lend, priorityCap: REG.priorityCap }), 0))) / Math.max(1, sysLoan) : lend;
    this.market = { ibON, lt6, m6_12, gt12, lend, cof, depSys: sysDepR, lendSys: sysLendR, gbondYield: Math.max(1.5, S.refi - 1.2 + 0.2 * tight), depGrowth: 0.9 * (M.gdp + M.cpi) + 1.5, // tiền gửi tăng theo GDP danh nghĩa
      creditDemand: clamp(1 + 0.08 * (M.gdp - 6.5) - 0.12 * (lend - 9.5), 0.5, 1.6) * this.shockMul('demand'), priorityCap: REG.priorityCap };
  }
  sysCostOfFunds(gt12, ibON) { // chi phí vốn bình quân toàn hệ thống, an toàn khi chưa có lãi suất đã gán
    const alive = this.banks.filter(b => !b.dead); let cost = 0, fund = 0;
    for (const b of alive) { const p = b.pol, d = b.dep;
      cost += d.casa * p.rCasa + d.lt6 * p.rLt6 + d.m6_12 * p.rM6_12 + d.gt12 * p.rGt12 + b.bonds * (b.bondRate ?? gt12 + 1) + b.subBonds * ((b.bondRate ?? gt12 + 1) + 1.5) + b.ibBorrow * (b.ibRate ?? ibON) + b.refi * this.sbv.refi + (b.wholesale || 0) * (b.wsRate ?? this.macro.fedRate + 1.7);
      fund += b.deposits() + b.bonds + b.subBonds + b.ibBorrow + b.refi + (b.wholesale || 0); }
    return fund > 0 ? cost / fund : this.sbv.refi;
  }
  cyclePhase() { // pha chu kỳ suy ra từ trạng thái, không phải ngẫu nhiên
    const M = this.macro, S = this.sbv; const cg = this.sysCreditGrowthAnn ?? 12; const npl = this.sysNpl() * 100;
    const stress = npl > 3.5 || this.tightness > 2.5 || this.banks.some(b => !b.dead && (b.liqFail > 0 || b.reputation < -1));
    if (stress || (M.re < 0.75 && M.re < M.rePrev)) return { key: 'bust', name: 'Suy giảm & xử lý nợ xấu', cls: 'bad' };
    if (M.cpi > 4.5 || (M.re > 1.35 && cg > 14)) return { key: 'hot', name: 'Quá nóng', cls: 'warn' };
    if (S.refi - (this.hist.length >= 6 ? this.hist[this.hist.length - 6].refi : S.refi) >= 0.5) return { key: 'tight', name: 'Thắt chặt', cls: 'warn' };
    if ((M.gdp < 6 || (M.u ?? 0) > 2.8) && M.cpi < 3.5) return { key: 'recover', name: 'Phục hồi', cls: 'info' };
    return { key: 'expand', name: 'Mở rộng', cls: 'good' };
  }
  stressFor(b) {
    const M = this.macro;
    const reCycle = M.re < 0.7 ? (0.7 - M.re) * 3 : 0; // BĐS đóng băng → nợ xấu BĐS
    return {
      pd: (1 + 0.1 * Math.max(0, (M.real ?? 1.5) - 1.5) + 0.08 * Math.max(0, MAC.gStar - M.gdp) + 0.2 * Math.max(0, (M.u ?? MAC.uStar) - MAC.uStar) + (b.type === 'jsb' ? 0.05 : 0) + this.shock('pdAll')) * this.diff.pd, // lãi suất thực cao, tăng trưởng thấp, thất nghiệp tăng → nợ xấu
      re: reCycle + this.shock('re'), reHeat: this.shock('reHeat') + (M.re > 1.2 ? 1 : 0),
      fx: Math.max(0, M.fx - 3) * 0.2 + this.shock('fx'), demand: 1,
      dep: this.shock('dep') * (b.type === 'jsb' ? 1.2 : -0.5) + (b.type === 'sob' ? this.shock('depBig') : 0),
      agri: this.shock('agri'), sme: this.shock('sme'),
    };
  }
  initPolicy(b) { // neo lãi suất khởi đầu theo thị trường, kể cả cho người chơi
    const mkt = this.market, S = this.sbv, p = b.pol, T = { depAdj: b.spec.depAdj ?? TYPES[b.type].depAdj, lendAdj: b.spec.lendAdj ?? TYPES[b.type].lendAdj };
    p.rLt6 = Math.min(S.depCap6m, mkt.lt6 + T.depAdj * 0.5); p.rM6_12 = mkt.m6_12 + T.depAdj; p.rGt12 = mkt.gt12 + T.depAdj + 0.2;
    p.lendShort = mkt.lend - 1.0 + T.lendAdj; p.lendMLT = mkt.lend + 0.5 + T.lendAdj;
    p.spread = { rLt6: T.depAdj * 0.5, rM6_12: T.depAdj, rGt12: T.depAdj + 0.2, lendShort: T.lendAdj, lendMLT: T.lendAdj };
    p.growthTarget = b.room;
  }
  aiPolicy(b) {
    const mkt = this.market, S = this.sbv, p = b.pol;
    const need = (b.ldr() > 80 ? 0.4 : 0) + (b.liqReserve() < 12 ? 0.4 : 0) + (b.spec.depAdj ?? TYPES[b.type].depAdj);
    p.rLt6 = Math.min(S.depCap6m, mkt.lt6 + need); p.rM6_12 = mkt.m6_12 + need; p.rGt12 = mkt.gt12 + need + 0.2;
    p.rCasa = 0.3;

Scene.updateFx = function (dt) {
  const fx = this.fx; if (!fx) return; fx.t += dt; if (fx.t > fx.dur) { this.fx = null; return; }
  for (const p of fx.parts) { if (fx.t < p.delay) continue; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  if (fx.cfg.burst && fx.spawned < fx.cfg.burst && Math.random() < 6 * dt) { this.spawn('wd'); fx.spawned++; }
  if (fx.cfg.storm && Math.random() < 0.6 * dt) fx.flash = 0.12;
  if (fx.cfg.vehicle === 'missiles' && Math.random() < 1.5 * dt) fx.flash = 0.05;

};
Scene.drawFx = function (g, night) {
  const fx = this.fx; if (!fx) return; const cfg = fx.cfg; const Wd = this.W, H = this.H; const t = fx.t, pr = t / fx.dur;
  if (cfg.clouds) { g.fillStyle = 'rgba(40,44,52,0.85)'; for (let i = 0; i < 6; i++) { const x = ((i * 95 + t * 12) % (Wd + 60)) - 30; g.fillRect(x, 8 + (i % 2) * 6, 50, 7); g.fillRect(x + 8, 4 + (i % 2) * 6, 28, 5); } }
  const road = H - 8; const bl = this.buildings(); const main = bl.find(b => b.main) || bl[Math.floor(bl.length / 2)]; const door = main ? main.x + main.w / 2 : Wd / 2;
  const v = cfg.vehicle;
  if (v === 'car' || v === 'limo' || v === 'limo-leave') {
    const len = v === 'car' ? 14 : 22; let x;
    if (v === 'limo-leave') x = door - len / 2 + pr * (Wd + 40);
    else x = pr < 0.33 ? -len + (door - len / 2 + len) * (pr / 0.33) : pr < 0.66 ? door - len / 2 : door - len / 2 + ((pr - 0.66) / 0.34) * (Wd + 40);
    g.fillStyle = v === 'car' ? '#1b1b1b' : '#111'; g.fillRect(x, road - 6, len, 4); g.fillRect(x + 3, road - 9, len - 6, 3);
    g.fillStyle = '#8fd3ff'; g.fillRect(x + 4, road - 8, 3, 2); g.fillRect(x + len - 7, road - 8, 3, 2);
    if (v !== 'car') { g.fillStyle = '#ffd84a'; g.fillRect(x, road - 5, len, 1); }
    g.fillStyle = '#000'; g.fillRect(x + 2, road - 2, 3, 2); g.fillRect(x + len - 5, road - 2, 3, 2);
    if (v === 'car' && pr > 0.33 && pr < 0.66) this.label(x + len / 2, road - 12, 'THANH TRA', { size: 10, align: 'center', bold: true });
  }
  if (v === 'ship') { const x = Wd + 30 - pr * (Wd + 90); const y = 72; g.fillStyle = '#1f3552'; g.fillRect(x, y, 44, 6); g.fillRect(x + 32, y - 5, 8, 5); const cc = ['#e34948', '#2a78d6', '#eda100', '#1baf7a']; for (let i = 0; i < 6; i++) { g.fillStyle = cc[i % 4]; g.fillRect(x + 2 + i * 5, y - 4 + (i % 2) * -3, 4, 3); } this.label(x + 22, y - 10, 'THUẾ %', { size: 10, align: 'center', bold: true }); }
  if (v === 'plane') { const x = Wd * 0.3 + pr * Wd * 0.85, y = 60 - pr * 70; g.fillStyle = '#e8ecf5'; g.fillRect(x, y, 14, 3); g.fillRect(x + 4, y - 3, 4, 3); g.fillRect(x + 1, y + 3, 5, 2); this.label(x - 4, y + 3, '$$$', { size: 10, color: '#ffd84a', align: 'right', bold: true }); }
  if (v === 'missiles') { for (let i = 0; i < 3; i++) { const q = clamp((t - i * 0.9) / 3, 0, 1); if (q <= 0 || q >= 1) continue; const x = -10 + q * (Wd + 20), y = 8 + i * 9 + q * 22; g.fillStyle = '#ddd'; g.fillRect(x, y, 6, 2); g.fillStyle = '#ff7a2a'; g.fillRect(x - 4, y, 4, 2); g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(x - 14, y + 1, 10, 1); }
    for (let i = 0; i < 3; i++) { const q = (t - 3 - i * 0.9); if (q > 0 && q < 0.8) { const r = 3 + q * 14; g.fillStyle = q < 0.3 ? '#fff4c2' : '#ff8a3a'; const cx = Wd * 0.86 + i * 15, cy = 40 + i * 9; g.fillRect(cx - r, cy - r / 2, r * 2, r); g.fillRect(cx - r / 2, cy - r, r, r * 2); } } }
  if (v === 'crane-build' || v === 'crane-fall') { const bx = Wd - 60, base = H - 13; g.fillStyle = '#5b6770'; g.fillRect(bx + 28, base - 80, 2, 80); g.fillRect(bx - 6, base - 80, 40, 2);
    const floors = 6; for (let f = 0; f < floors; f++) { let y = base - 8 - f * 8; if (v === 'crane-build' && f === floors - 1) y = Math.max(y, base - 8 - (floors - 1) * 8 * pr * 1.4 - 30 * (1 - pr)); if (v === 'crane-fall' && f >= 2) { y += Math.min(60, Math.max(0, (t - 1 - (floors - f) * 0.4)) * 40); if (y > base - 8) continue; } g.fillStyle = f % 2 ? '#d9a441' : '#e6b85c'; g.fillRect(bx, y, 24, 7); }
    if (v === 'crane-fall') { g.fillStyle = 'rgba(200,190,170,0.5)'; for (let i = 0; i < 6; i++) g.fillRect(bx - 6 + i * 6 + Math.sin(t * 3 + i) * 3, base - 4 - (t * 6 + i * 5) % 20, 3, 2); this.label(bx + 12, base - 60, 'ĐÌNH TRỆ', { size: 10, align: 'center', bold: true }); }

  for (const p of fx.parts) { if (t < p.delay || p.life <= 0) continue; this.label(p.x, p.y, p.glyph, { size: 12, color: cfg.color === '#4a5560' ? '#c9d1d9' : '#ffd84a', align: 'center', bold: true }); }
  if (cfg.flash && t < 1.2 && Math.floor(t * 8) % 2 === 0) { g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(8, H - 70, 58, 57); }
  if (fx.flash > 0) { g.fillStyle = `rgba(255,255,255,${Math.min(0.7, fx.flash * 5)})`; g.fillRect(0, 0, Wd, H); }
  if (cfg.glitch && Math.random() < 0.5) { const c = this.c; for (let i = 0; i < 4; i++) { const y = Math.random() * H, h = 2 + Math.random() * 6, dx = (Math.random() - 0.5) * 20; g.drawImage(c, 0, y, Wd, h, dx, y, Wd, h); } if (Math.floor(t * 4) % 2 === 0) this.label(Wd / 2, 50, 'HỆ THỐNG GIÁN ĐOẠN', { size: 16, color: '#ff5d5d', align: 'center', bold: true }); }

};

function setPlayBtn() { const b = $('#playBtn'); if (b) { b.textContent = Clock.playing ? '⏸ Tạm dừng' : '▶ Chạy'; b.classList.toggle('primary', !Clock.playing); } }

function loop(ts) {
  if (!W) { Clock.raf = false; return; }
  const dt = Math.min(0.1, (ts - (Clock.last || ts)) / 1000); Clock.last = ts;
  if (Clock.playing && !(W.pendingEvent && W.pendingEvent.choice) && !(W.player && W.player.dead)) {
    Clock.acc += dt * 1000;
    if (Clock.acc >= Clock.speed) { Clock.acc -= Clock.speed; stepMonth(); }
  }

}

function updateTop() {

    kpis = kpiCell('Tổng tài sản', fmt0(B.totalAssets()) + ' tỷ')

      + kpiCell('Taylor gợi ý', pp(M.taylor ?? 0), statusOf(Math.abs((M.taylor ?? S.refi) - S.refi) < 0.5, Math.abs((M.taylor ?? S.refi) - S.refi) < 1.5))
      + kpiCell('GDP', pp(M.gdp, 1), statusOf(M.gdp >= 6.5, M.gdp >= 5.5))

      + kpiCell('Chu kỳ', W.cyclePhase().name)

      + kpiCell('Tín dụng (YoY)', pp(W.sysCreditGrowthAnn ?? 14, 1), statusOf((W.sysCreditGrowthAnn ?? 14) <= 16 && (W.sysCreditGrowthAnn ?? 14) >= 10, true))

function alertsFor(B) {
  const S = W.sbv, a = [];
  if (B.dead) a.push(['bad', `Ngân hàng đang bị kiểm soát đặc biệt (${B.deadReason}).`]);
  if (B.car() < S.carMin) a.push(['bad', `CAR ${pp(B.car())} dưới mức tối thiểu ${pp(S.carMin)}. Tăng vốn, phát hành trái phiếu thứ cấp, giảm tài sản rủi ro cao (BĐS, tiêu dùng) hoặc mua thêm TPCP (hệ số rủi ro 0%).`]);
  else if (B.car() < S.carMin + 1) a.push(['warn', `CAR ${pp(B.car())} sát ngưỡng. Giải ngân sẽ bị chặn bởi CAR mục tiêu.`]);
  if (B.ldr() > S.ldrMax) a.push(['bad', `LDR ${pp(B.ldr(), 1)} vượt trần ${S.ldrMax}%. Tăng lãi suất huy động, phát hành giấy tờ có giá hoặc hãm tăng trưởng tín dụng.`]);
  if (B.mltRatio() > S.mltMax) a.push(['bad', `Vốn ngắn hạn cho vay trung dài hạn ${pp(B.mltRatio(), 1)} vượt ${S.mltMax}%. Cần thêm tiền gửi ≥12 tháng, trái phiếu dài hạn hoặc giảm cho vay mua nhà/BĐS.`]);
  if (B.liqReserve() < 10) a.push(['bad', `Dự trữ thanh khoản ${pp(B.liqReserve(), 1)} dưới 10%. Giữ thêm tiền mặt/TPCP.`]);
  if (B.nplRatio() > 0.03) a.push(['warn', `Nợ xấu ${pp(B.nplRatio() * 100)} trên 3%: bị hạn chế chia cổ tức và nới room. Cân nhắc bán nợ cho VAMC hoặc giảm khẩu vị rủi ro.`]);
  if (S.roomOn && B.creditGrowthYTD() > B.room - 1) a.push(['warn', `Đã dùng gần hết room tín dụng ${B.room}% (${pp(B.creditGrowthYTD(), 1)}). Giải ngân mới bị chặn.`]);
  if (B.ibBorrow + B.refi > B.deposits() * 0.22) a.push(['warn', `Phụ thuộc liên ngân hàng/tái cấp vốn: ${fmt0(B.ibBorrow + B.refi)} tỷ (${pp((B.ibBorrow + B.refi) / B.deposits() * 100, 1)} tiền gửi). Rủi ro khi thị trường 2 đóng băng.`]);
  if (B.binds && B.binds.length) a.push(['info', `Tháng qua giải ngân ${fmt0(B.lastDisb || 0)} tỷ, bị giới hạn bởi: ${B.binds.join(', ')}.`]);

  return `<div class="alerts">${a.map(x => `<div class="alert ${x[0]}">${x[1]}</div>`).join('')}</div>`;

function macroRulesPanel() {
  const M = W.macro, S = W.sbv, cg = W.sysCreditGrowthAnn ?? 12; const f = (v, d = 2) => (v ?? 0).toFixed(d).replace('.', ',');

  const dPi = MAC.kappa * (M.gap ?? 0) + MAC.aM * (cg - MAC.cgStar) + MAC.aX * Math.max(0, M.fx - 2) + MAC.aE * (MAC.piStar - M.cpi);
  const uT = MAC.uStar - MAC.beta * (M.gdp - MAC.gStar);
  return `<div class="panel"><h2>Ràng buộc vĩ mô (số hiện tại)</h2><table>
    <tr><td><b>Khoảng cách sản lượng</b> gap = 0,92·gap + (g − 6,5)/12</td><td class="r">${f(M.gap)}</td></tr>
    <tr><td><b>IS</b> g → 6,5 − 0,6·(r − 1,0) + 0,06·(tín dụng − 12) − 0,1·max(0, Fed − 4); r = TCV − kỳ vọng lạm phát = ${f(S.refi)} − ${f(M.pie)} = <b>${f(M.real)}</b></td><td class="r">g → ${f(isG, 1)}% (hiện ${f(M.gdp, 1)}%)</td></tr>
    <tr><td><b>Phillips</b> Δπ/tháng = 0,04·gap + 0,006·(tín dụng − 12) + 0,02·max(0, tỷ giá − 2) + 0,05·(3,5 − π)</td><td class="r">${dPi >= 0 ? '+' : ''}${f(dPi, 3)} điểm/tháng (π ${f(M.cpi, 1)}%)</td></tr>
    <tr><td><b>Okun</b> u → 2,3 − 0,35·(g − 6,5)</td><td class="r">u → ${f(uT)}% (hiện ${f(M.u)}%)</td></tr>
    <tr><td><b>Taylor</b> i = 1,0 + π + 0,5·(π − 3,5) + 0,4·gap + 0,3·max(0, tỷ giá − 3)</td><td class="r">gợi ý ${f(M.taylor)}% (TCV ${f(S.refi)}%)</td></tr>
    <tr><td><b>Nợ xấu</b> hệ số hình thành ×(1 + 0,1·max(0, r − 1,0) + 0,08·max(0, 6,5 − g) + 0,2·max(0, u − 2,3))</td><td class="r">×${f(1 + 0.1 * Math.max(0, (M.real ?? 1.5) - 1.5) + 0.08 * Math.max(0, MAC.gStar - M.gdp) + 0.2 * Math.max(0, (M.u ?? MAC.uStar) - MAC.uStar))}</td></tr>
  </table><p class="small muted">Đánh đổi: thắt chặt (r cao) hạ lạm phát qua khoảng cách sản lượng nhưng làm tăng trưởng chậm, thất nghiệp và nợ xấu tăng sau 6–12 tháng; nới lỏng làm ngược lại và gây áp lực tỷ giá nếu thấp hơn lãi USD.</p></div>`;
}
function overviewSbv() {
  const alive = W.banks.filter(b => !b.dead);
  const weak = alive.filter(b => b.car() < W.sbv.carMin + 0.5 || b.nplRatio() > 0.04 || b.liqReserve() < 11);
  const a = [];
  const M = W.macro;
  if (M.cpi > 4.5) a.push(['bad', `CPI ${pp(M.cpi, 1)} vượt mục tiêu 4,5%. Cân nhắc tăng lãi suất điều hành, hút tiền qua tín phiếu, hạ room tín dụng.`]);
  if (M.cpi < 2) a.push(['warn', `CPI ${pp(M.cpi, 1)} quá thấp, kinh tế có dấu hiệu yếu.`]);
  if (M.gdp < 6) a.push(['warn', `GDP ${pp(M.gdp, 1)} dưới 6%. Có thể hạ lãi suất, nới room, bơm OMO nếu lạm phát cho phép.`]);
  if (M.fx > 3) a.push(['bad', `VND mất giá ${pp(M.fx, 1)}/năm. Bán USD từ dự trữ (tốn dự trữ) hoặc nâng lãi suất VND để thu hẹp chênh lệch với USD (${pp(M.fedRate)}).`]);
  if (M.reserves < 60) a.push(['bad', `Dự trữ ngoại hối chỉ còn ${fmt1(M.reserves)} tỷ USD (dưới 3 tháng nhập khẩu).`]);
  if (W.tightness > 2) a.push(['bad', `Thanh khoản hệ thống rất căng (LS liên NH ${pp(W.market.ibON)}). Bơm OMO hoặc hạ dự trữ bắt buộc.`]);
  if (weak.length) a.push(['warn', `Ngân hàng yếu: ${weak.map(b => b.name).join(', ')}. Theo dõi CAR, nợ xấu, thanh khoản.`]);
  if (!a.length) a.push(['good', 'Hệ thống ổn định. Duy trì chính sách và theo dõi tỷ giá.']);
  return `<div class="grid g2">

  const secRows = SECTORS.map(s => { const b = bk[s.id]; const t = B.sectorTotal(s.id); return `<tr><td>${s.name}</td><td class="r">${fmt0(t)}</td><td class="r">${pp(B.sectorRate(s, W.market))}</td><td class="r">${pp((b.g3 + b.g4 + b.g5) / Math.max(1, t) * 100)}</td><td class="r">${pp(b.w / Math.max(1, t) * 100)}</td><td class="r">${s.rw * 100}%</td></tr>`; }).join('');
  const y = B.pnlYTD;
  const pick = W.mode === 'sbv' ? `<p>Ngân hàng: <select id="pickBank">${W.banks.map((b, i) => `<option value="${i}" ${i === selectedBank ? 'selected' : ''}>${b.name}${b.dead ? ' (KSĐB)' : ''}</option>`).join('')}</select></p>` : '';
  setTimeout(() => { const s = $('#pickBank'); if (s) s.onchange = () => { selectedBank = +s.value; renderGame(); }; }, 0);
  return `${pick}<div class="grid g2">
    <div class="panel"><h2>Tài sản – ${fmt0(B.totalAssets())} tỷ</h2><div class="tw"><table><tr><th>Khoản mục</th><th class="r">Tỷ VND</th><th class="r">%TS</th></tr>
      ${row('Tiền mặt & tiền gửi thanh toán', B.cash)}${row('Dự trữ bắt buộc tại NHNN', B.reserve)}${row('Cho vay liên ngân hàng', B.ibLend)}${row('Trái phiếu Chính phủ (RW 0%)', B.gbonds)}
      ${row('Cho vay khách hàng (gộp)', B.grossLoans())}${B.concentrated ? row('trong đó: khoản vay tập trung BĐS', B.concentrated, 'sub') : ''}${row('Dự phòng rủi ro tín dụng', -B.prov, 'sub')}${B.vamc ? row('Trái phiếu đặc biệt VAMC', B.vamc) : ''}${row('Tài sản cố định', B.fixed)}${row('Tài sản khác (phải thu, góp vốn, TPDN)', B.otherA || 0)}</table></div></div>
    <div class="panel"><h2>Nguồn vốn</h2><div class="tw"><table><tr><th>Khoản mục</th><th class="r">Tỷ VND</th><th class="r">%TS</th></tr>
      ${row('Tiền gửi không kỳ hạn (CASA)', B.dep.casa)}${row('Tiền gửi < 6 tháng', B.dep.lt6)}${row('Tiền gửi 6–12 tháng', B.dep.m6_12)}${row('Tiền gửi ≥ 12 tháng', B.dep.gt12)}
      ${row('Giấy tờ có giá (3 năm)', B.bonds)}${row('Trái phiếu thứ cấp (vốn cấp 2)', B.subBonds)}${row('Vay liên ngân hàng', B.ibBorrow)}${row('Vay tái cấp vốn / OMO tại NHNN', B.refi)}${row('Vay nước ngoài & vay dài hạn TCTD (lãi ' + pp(B.wsRate || 0) + ')', B.wholesale || 0)}${row('Phải trả khác', B.other || 0)}
      ${row('Vốn điều lệ', B.equity.charter, 'tot')}${row('Lợi nhuận giữ lại & quỹ', B.equity.retained)}

/* ---------- Hành động của ngân hàng (nút bấm) ---------- */
const ACT = {
  rate(B, k, d) { const p = B.pol; p[k] = +clamp(p[k] + d, 0, 30).toFixed(2); if (p.spread && k in p.spread) p.spread[k] = +(p.spread[k] + d).toFixed(2); B.addLog(W.month, `${RATE_NAMES[k]}: ${pp(p[k])} (${d > 0 ? '+' : ''}${d.toFixed(2).replace('.', ',')}).`, ''); },
  num(B, k, d, lo, hi, name, unit = '') { const p = B.pol; p[k] = +clamp(p[k] + d, lo, hi).toFixed(2); B.addLog(W.month, `${name}: ${String(p[k]).replace('.', ',')}${unit}.`, ''); },
  mix(B, id, d) { const p = B.pol; p.mix[id] = clamp(p.mix[id] + d, 0, 0.8); const s = sum(Object.values(p.mix)); for (const k in p.mix) p.mix[k] /= s; B.addLog(W.month, `Cơ cấu giải ngân: ${SECTORS.map(x => x.name.split(' ')[0] + ' ' + Math.round(p.mix[x.id] * 100) + '%').join(', ')}.`, ''); },
  preset(B, name) { const P = { corp: { corp: 0.6, re: 0.2, cons: 0.05, agri: 0.15 }, re: { corp: 0.3, re: 0.55, cons: 0.1, agri: 0.05 }, retail: { corp: 0.3, re: 0.35, cons: 0.3, agri: 0.05 }, agri: { corp: 0.3, re: 0.15, cons: 0.05, agri: 0.5 }, safe: { corp: 0.5, re: 0.15, cons: 0.05, agri: 0.3 } }[name]; B.pol.mix = { ...P }; B.addLog(W.month, `Đổi cơ cấu giải ngân sang mẫu "${PRESET_NAMES[name]}".`, ''); },
  issue(B, pct, sub) { const e = B.issueBonds(B.totalAssets() * pct / 100, sub, W); if (e) toast(e); },
  raise(B, pct) { const e = B.raiseCapital(B.equity.charter * pct / 100, W); if (e) toast(e); },
  vamc(B) { const e = B.sellToVamc(W); if (e) toast(e); },
  anchor(B) { B.pol.anchor = !B.pol.anchor; if (B.pol.anchor) { const K = W.market; const ref = { rLt6: K.lt6, rM6_12: K.m6_12, rGt12: K.gt12, lendShort: K.lend - 1.0, lendMLT: K.lend + 0.5 }; for (const k in ref) B.pol.spread[k] = B.pol[k] - ref[k]; } B.addLog(W.month, `Neo lãi suất theo thị trường: ${B.pol.anchor ? 'bật' : 'tắt'}.`, ''); },
};
const RATE_NAMES = { rCasa: 'Lãi CASA', rLt6: 'Lãi huy động <6 tháng', rM6_12: 'Lãi huy động 6–12 tháng', rGt12: 'Lãi huy động ≥12 tháng', lendShort: 'Lãi cho vay ngắn hạn', lendMLT: 'Lãi cho vay trung dài hạn' };
const PRESET_NAMES = { corp: 'Doanh nghiệp', re: 'BĐS & mua nhà', retail: 'Bán lẻ tiêu dùng', agri: 'Nông nghiệp', safe: 'Phòng thủ' };
function arow(label, value, btns, hint, cls = '') {
  return `<div class="arow ${cls}"><div class="al"><span class="lbl">${label}</span>${hint ? `<span class="hint">${hint}</span>` : ''}</div><span class="val num">${value}</span><div class="abtns">${btns.map(b => `<button class="btn small ${b.cls || ''}" data-act="${b.act}" data-arg='${JSON.stringify(b.arg ?? null)}' ${b.disabled ? 'disabled' : ''}>${b.lbl}</button>`).join('')}</div></div>`;
}
function managePane(B) {

  const rate = (k, hint) => arow(RATE_NAMES[k], pp(p[k]), [{ lbl: '−0,25', act: 'rate', arg: [k, -0.25] }, { lbl: '+0,25', act: 'rate', arg: [k, 0.25] }], hint);
  const num = (k, name, d, lo, hi, unit, hint) => arow(name, String(p[k]).replace('.', ',') + unit, [{ lbl: '−' + String(d).replace('.', ','), act: 'num', arg: [k, -d, lo, hi, name, unit] }, { lbl: '+' + String(d).replace('.', ','), act: 'num', arg: [k, d, lo, hi, name, unit] }], hint);
  const mixRows = SECTORS.map(s => arow(s.name, Math.round(p.mix[s.id] * 100) + '%', [{ lbl: '−5', act: 'mix', arg: [s.id, -0.05] }, { lbl: '+5', act: 'mix', arg: [s.id, 0.05] }], `RR ${s.rw * 100}% · TDH ${Math.round(s.mlt * 100)}%`)).join('');
