<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BankSim Việt Nam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky KPI strip on top, tab bar, one content column; data-dense dashboard feel of a treasury desk. */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --fg:#14201c; --muted:#5c6b64; --line:#d9ded9;
  --accent:#0f6b4f; --accent-soft:#dcefe6;
  --good:#1f7a3a; --warn:#b26a00; --bad:#b8322b; --info:#1f5fa8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#4a3aa7;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141917; --panel:#1d2422; --fg:#e8ece9; --muted:#9aa8a1; --line:#33403b;
  --accent:#4fbf95; --accent-soft:#1c3a30;
  --good:#5ccf7c; --warn:#f0b04a; --bad:#f07a72; --info:#6aa8f0;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1d2422; --fg:#e8ece9; --muted:#9aa8a1; --line:#33403b;
  --accent:#4fbf95; --accent-soft:#1c3a30;
  --good:#5ccf7c; --warn:#f0b04a; --bad:#f07a72; --info:#6aa8f0;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);padding-inline:16px;padding-block:0 24px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
button{font:inherit;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 6px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.withlogo{display:flex;align-items:center;gap:8px}.withlogo .logo{flex:none}.logo{vertical-align:middle;border-radius:2px}
.brand h1{font-size:18px;font-weight:700;color:var(--accent)}
.brand .sub{color:var(--muted);font-size:12px}
.date{font-family:var(--mono);font-size:15px;font-weight:500}
.ctrl{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:4px 8px;font-size:12px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px;margin-top:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-family:var(--mono);font-size:16px;font-weight:500;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;color:var(--muted);padding:8px 12px;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.pane{padding-block:14px}

/* panels */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1150px){.g4{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.g4{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.panel h2{margin-bottom:8px}
.panel p{margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:4px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;border-top:2px solid var(--line)}
tr.sub td{color:var(--muted);padding-left:16px}
.tw{overflow-x:auto}
.muted{color:var(--muted)}
.small{font-size:12px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;letter-spacing:.02em}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}

/* nút hành động */
.arow{display:grid;grid-template-columns:minmax(150px,1fr) auto auto;gap:6px 10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.arow:last-child{border-bottom:0}
.arow .al{display:flex;flex-direction:column;min-width:0}.arow .lbl{font-weight:500}.arow .hint{font-size:11px;color:var(--muted)}
.arow .val{font-family:var(--mono);min-width:60px;text-align:right;white-space:nowrap}
.abtns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.abtns.wrap{justify-content:flex-start;margin-bottom:6px}
.seg{display:flex;gap:4px;flex-wrap:wrap;grid-column:2/-1;justify-content:flex-end}
.badtxt{color:var(--bad)}
@media (max-width:520px){.arow{grid-template-columns:1fr auto}.arow .abtns,.seg{grid-column:1/-1;justify-content:flex-start}}
/* controls */
.field{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.field:last-child{border-bottom:0}
.field label{font-weight:500}
.field .hint{grid-column:1/-1;font-size:12px;color:var(--muted)}
.field input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.field input[type=number],.field select{width:110px;font:inherit;font-family:var(--mono);padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.field .val{font-family:var(--mono);min-width:64px;text-align:right}
.mixrow{display:grid;grid-template-columns:150px 1fr 56px;gap:8px;align-items:center;padding:3px 0}
.mixrow input{width:100%;accent-color:var(--accent)}
.mixrow .val{font-family:var(--mono);text-align:right}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions input[type=number]{width:120px;font-family:var(--mono);padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}

/* compliance */
.gauge{margin:8px 0}
.gauge .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.gauge .bar{position:relative;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--good)}
.gauge .fill.warn{background:var(--warn)} .gauge .fill.bad{background:var(--bad)}
.gauge .lim{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg)}
.gauge .exp{font-size:12px;color:var(--muted);margin-top:3px}

/* log */
.log{max-height:420px;overflow:auto;font-size:13px}
.log div{padding:4px 0;border-bottom:1px solid var(--line)}
.log .t{font-family:var(--mono);color:var(--muted);margin-right:8px}
.log .bad{color:var(--bad)} .log .good{color:var(--good)} .log .warn{color:var(--warn)}

/* charts */
canvas.chart{width:100%;height:220px;display:block;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* sidebar shell */
body.game{padding:0}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.side-brand{display:flex;gap:10px;align-items:center}.side-brand b{font-size:15px;color:var(--accent);display:block;line-height:1.2}.side-brand .sub{font-size:11px;color:var(--muted);display:block}
.side-logo{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:6px;background:#a0182b;color:#fff;font-size:9px;font-weight:700;flex:none}
.side-clock .date{display:block;margin-bottom:4px;font-size:14px}
.side .ctrl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.side .ctrl select,.side .ctrl #autoBtn{grid-column:1/-1}#autoBtn.on{background:#b26a00;color:#fff;border-color:#b26a00}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav .tab{text-align:left;border:0;border-left:3px solid transparent;border-radius:0 6px 6px 0;padding:7px 10px;color:var(--muted);background:none;font-weight:500;font-size:13px}
.side-nav .tab.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft)}
.side-kpis{display:grid;grid-template-columns:1fr 1fr;gap:5px}.side-kpis .kpi{padding:5px 7px}.side-kpis .kpi .v{font-size:13px}.side-kpis .kpi .l{font-size:10px}
.side-foot{margin-top:auto;display:flex;gap:6px}
.main{padding:0 16px 24px;min-width:0}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.side-nav{flex-direction:row;overflow-x:auto}.side-nav .tab{border-left:0;border-radius:0;border-bottom:2px solid transparent;white-space:nowrap}.side-nav .tab.active{border-bottom-color:var(--accent);background:none}.side-kpis{grid-template-columns:repeat(auto-fit,minmax(105px,1fr))}.side-foot{margin-top:0}}
/* real-time shell */
.clock{display:flex;flex-direction:column;gap:4px;min-width:150px}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent)}
.scene-wrap{background:#0b1020;border:1px solid #30363d;border-radius:8px;overflow:hidden;min-width:0}
.scene-box{position:relative;max-width:1280px;margin:0 auto}
canvas#scene{display:block;width:100%;max-width:100%;aspect-ratio:480/140;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
canvas#hud{position:absolute;left:0;top:0;width:100%;aspect-ratio:480/140;height:auto;pointer-events:none}
.scene-wrap{position:relative}
.evcard{position:absolute;right:10px;bottom:10px;max-width:min(320px,46%);background:rgba(13,17,23,.92);color:#e6edf3;border:1px solid #e3b341;border-radius:8px;padding:6px 9px;font-size:11px;line-height:1.35;z-index:3}
.evcard h4{margin:0 0 4px;font-size:13px;color:#ffd84a}
.evcard .btn{margin-top:6px;background:#161b22;color:#e6edf3;border-color:#30363d}
@media (max-width:700px){.evcard{position:static;max-width:none;border-radius:0;border-left:0;border-right:0}}
.mktbar{background:#0d1117;color:#c9d1d9;font-family:var(--mono);font-size:12px;padding:5px 12px;border-top:1px solid #30363d;max-width:1280px;margin:0 auto;white-space:nowrap;overflow-x:auto}.mktbar b{color:#fff;font-weight:500}
.ticker-wrap{overflow:hidden;background:#0b1020;color:#ffd84a;font-family:var(--mono);font-size:12px;height:20px;line-height:20px;white-space:nowrap;position:relative}
.ticker{display:inline-block;white-space:nowrap;will-change:transform;padding-inline:8px}
/* Sân khấu: dashboard vẽ ngay trên cùng màn hình với cảnh pixel; terminal bên phải; các tab chức năng ở dưới */
.split{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(340px,1fr);gap:10px;align-items:stretch;padding-top:6px}
.right{display:grid;grid-template-rows:minmax(0,1.55fr) minmax(0,1fr);gap:8px;height:calc(100vh - 12px);box-sizing:border-box;min-width:0}
.tools{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:0;box-sizing:border-box}
.tools-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 2px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}.tools-head b{font-size:13px}
.tools .grid{grid-template-columns:1fr;gap:8px}.tools .panel{padding:6px 8px}.tools .panel h2{font-size:11.5px;margin-bottom:4px}.tools .panel p{margin:3px 0;font-size:11.5px}
.tools .arow{grid-template-columns:minmax(80px,1fr) auto auto;gap:4px 6px;padding:4px 0}.tools .arow .lbl{font-size:12px}.tools .arow .hint{font-size:10.5px}.tools .arow .val{font-size:12px}.tools .btn.small{padding:2px 6px;font-size:11px}.tools .abtns{gap:3px}
.tools table{font-size:11.5px}
.tl-month{padding:6px 0;border-bottom:1px dashed var(--line)}.tl-month b{display:block;margin-bottom:2px}.legend span.off{opacity:.4;text-decoration:line-through}
.stage{display:flex;flex-direction:column;background:#0b1020;border:1px solid #30363d;border-radius:8px;overflow:hidden;height:calc(100vh - 12px);min-width:0;box-sizing:border-box}
.dash-area{position:relative;flex:1 1 auto;min-height:0}
#dashcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.btn.tog{display:inline-flex;align-items:center;gap:4px;font-size:11px;cursor:pointer}.btn.tog input{margin:0}
.dash-ctl{position:absolute;top:4px;left:8px;right:8px;display:flex;gap:3px;align-items:center;flex-wrap:wrap;z-index:2}.dash-ctl .sp{flex:1 1 auto}.dash-ctl button.grp{border-color:#3d444d}.dash-ctl button.grp.on{background:#238636;border-color:#238636}
.dash-ctl button{background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;font:10.5px var(--mono);padding:2px 5px;cursor:pointer;white-space:nowrap}.dash-ctl button.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
.stage .scene-wrap{flex:0 0 auto;border:0;border-radius:0;border-top:1px solid #30363d}
.term-wrap{position:relative;min-width:0}
.term{background:#0d1117;color:#c9d1d9;font-family:var(--mono);font-size:12px;border:1px solid #30363d;border-radius:8px;padding:8px 10px;overflow:auto;position:absolute;inset:0;box-sizing:border-box}
.term-head{color:#8b949e;text-transform:uppercase;letter-spacing:.06em;font-size:11px;border-bottom:1px solid #30363d;padding-bottom:4px;margin-bottom:4px}
.term .ln{white-space:pre-wrap;word-break:break-word;padding:1px 0;line-height:1.4}
.term .t{color:#8b949e;margin-right:6px}.term .src{color:#79c0ff;margin-right:2px}
.term .bad .msg{color:#ff7b72}.term .good .msg{color:#7ee787}.term .warn .msg{color:#e3b341}.term .info .msg{color:#79c0ff}.term .dim{color:#8b949e;border-bottom:1px dashed #30363d;margin-bottom:3px;padding-bottom:3px}
@media (max-width:900px){.split{grid-template-columns:1fr}.stage{height:auto}.dash-area{height:560px}.right{height:auto;grid-template-rows:auto 260px}.tools{max-height:60vh}}
/* start screen & modal */
.start{max-width:960px;margin:24px auto}
.start h1{font-size:30px;color:var(--accent);margin-bottom:4px}
.start .lead{max-width:65ch;color:var(--muted)}
.diffs{display:flex;flex-direction:column;gap:6px}.diff{display:block;padding:4px 0;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;text-align:left;color:var(--fg)}
.card:hover{border-color:var(--accent)}
.card h3{font-size:15px;margin-bottom:6px}
.card .meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:720px;width:100%;padding:18px;max-height:90vh;overflow:auto}
.modal h3{font-size:18px;margin-bottom:8px}
.modal .choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.modal .choices .btn{text-align:left}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{border-left:3px solid var(--warn);padding:6px 10px;background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:0 6px 6px 0;font-size:13px}
.alert.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.alert.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.replist{padding-left:18px;margin:4px 0}.replist li{margin:3px 0}
.rep{border-bottom:1px solid var(--line);padding:6px 0}.rep summary{cursor:pointer}.rep ul{padding-left:18px;margin:6px 0}.rep li{margin:3px 0}
.guide{max-width:72ch}
.guide h3{font-size:15px;margin:14px 0 4px}
.guide ul{padding-left:18px;margin:4px 0}
.guide li{margin:3px 0}
.guide code{font-family:var(--mono);font-size:12px;background:var(--bg);padding:1px 4px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){ .mixrow{grid-template-columns:110px 1fr 50px} .field input[type=number]{width:90px} }
</style>
</head>
<body>

<div id="app"></div>

<script>
'use strict';
/* =====================================================================
   BankSim Việt Nam – engine
   Đơn vị tiền: tỷ VND. Bước mô phỏng: 1 tháng. Lãi suất: %/năm.
   ===================================================================== */

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sum = arr => arr.reduce((a, b) => a + b, 0);
const rnd = (a, b) => a + Math.random() * (b - a);
const fmt0 = n => Math.round(n).toLocaleString('vi-VN');
const fmt1 = n => n.toLocaleString('vi-VN', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const pct = (x, d = 2) => (x * 100).toFixed(d).replace('.', ',') + '%';
const pp = (x, d = 2) => x.toFixed(d).replace('.', ',') + '%';
const MONTHS = ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'];

/* ---------- Khung pháp lý mặc định (theo mô hình Việt Nam) ---------- */
const REG = {
  carMin: 8.0,          // Thông tư 41/2016: CAR ≥ 8% (Basel II)
  ldrMax: 85,           // Thông tư 22/2019: dư nợ/tiền gửi ≤ 85%
  mltMax: 30,           // TT08/2020 sửa TT22: vốn ngắn hạn cho vay trung dài hạn ≤ 30% (từ 10/2023)
  liqReserveMin: 10,    // TT22: tỷ lệ dự trữ thanh khoản ≥ 10%
  rrrShort: 3.0,        // Dự trữ bắt buộc VND: không kỳ hạn & <12 tháng 3%
  rrrLong: 1.0,         // ≥12 tháng 1%
  depCap6m: 4.75,       // Trần lãi suất huy động VND < 6 tháng
  priorityCap: 4.0,     // Trần lãi suất cho vay ngắn hạn 5 lĩnh vực ưu tiên
  nplTarget: 3.0,       // Ngưỡng nợ xấu NHNN theo dõi

function logoSvg(spec, px = 24) {

function drawLogo(g, spec, x, y, sc = 2) {

}

/* =====================================================================
   Lớp Bank
   ===================================================================== */
class Bank {
  constructor(spec, isPlayer) {
    const T = TYPES[spec.type];
    this.id = spec.id; this.type = spec.type; this.name = spec.name; this.isPlayer = isPlayer;
    this.spec = spec; this.code = spec.code;
    this.brand = spec.brand ?? T.brand; this.opexRate = spec.opex ?? T.opex; // chi phí hoạt động, % tổng tài sản/năm
    this.concentrated = 0; // dư nợ tập trung vào 1 khách hàng BĐS (sự kiện)
    this.vamc = 0;         // trái phiếu đặc biệt VAMC (giá trị ghi sổ sau trích lập)
    this.vamcFace = 0;     // dư nợ gốc đã bán VAMC còn phải thu hồi (tính vào nợ xấu gộp)
    this.vamcStart = -999; this.vamcLast = -999;
    this.rsTr = []; this.rsEpM = -999; this.roll = { re: { amt: 0, prem: 0, cap: 0 }, corp: { amt: 0, prem: 0, cap: 0 } }; // đảo nợ ngầm: dư nợ sắp chuyển nhóm được cho vay mới trả cũ, ở lại nhóm 1 với phụ trội lãi (prem, điểm %), lãi nhập gốc (cap) thay vì thu tiền // dư nợ cơ cấu (BĐS, kỳ hạn +3 năm): các đợt { amt, accr (lãi dự thu), m0, x }; tháng hình thành đợt gần nhất
    const TA = spec.assets;
    const loans = TA * spec.loanRatio;
    // Sổ cho vay: mỗi phân khúc có 5 nhóm nợ (nhóm 1 = perf, nhóm 2 = w, nhóm 3–5)
    this.book = {};
    for (const s of SECTORS) {
      const tot = loans * spec.mix[s.id];
      const bad = tot * spec.npl * (s.id === 're' || s.id === 'cons' ? 1.4 : 0.8);
      this.book[s.id] = { perf: tot - bad - tot * 0.012, w: tot * 0.012, g3: bad * 0.4, g4: bad * 0.3, g5: bad * 0.3 };
    }
    this.gbonds = TA * spec.gbond;
    this.fixed = TA * 0.015;
    this.equity = { charter: TA * spec.eqRatio * 0.75, retained: TA * spec.eqRatio * 0.25 };
    const dep = TA * spec.depRatio;
    this.dep = { casa: dep * spec.casa, lt6: dep * (1 - spec.casa) * 0.52, m6_12: dep * (1 - spec.casa) * 0.34, gt12: dep * (1 - spec.casa) * 0.14 };
    this.bonds = TA * spec.bonds;                               // giấy tờ có giá ≥12 tháng
    this.subBonds = TA * (spec.type === 'jsb' ? 0.02 : 0.01);   // trái phiếu thứ cấp (vốn cấp 2)
    this.other = TA * 0.03;                                     // phải trả khác, không chịu lãi
    this.otherA = TA * 0.05;                                    // tài sản khác (phải thu, góp vốn, TPDN), không sinh lãi, RW 100%

    { const rc = this.equity.charter + this.equity.retained; if (rc < this.equity.charter * 0.8) { this.lowCapM = (this.lowCapM || 0) + 1; if (this.lowCapM === 1 || this.lowCapM % 6 === 0) W.act('NHNN', `${this.name}: giá trị thực của vốn điều lệ ${fmt0(rc)} tỷ chỉ còn ${pp(rc / this.equity.charter * 100, 0)} vốn điều lệ${rc < this.equity.charter * 0.5 ? ' (dưới 50%: có thể bị cơ cấu lại hoặc thu hồi giấy phép)' : ' (dưới 80%: NHNN có thể áp dụng biện pháp theo Luật NHNN)'}.`, 'bad', 'TT50/2026 Điều 6–7: theo dõi giá trị thực vốn điều lệ; dưới vốn pháp định phải có phương án xử lý trong 30 ngày'); } else this.lowCapM = 0; }

    { const carReq = sbv.carMin + Math.max(0, sbv.carBuf || 0); const gap = Math.max(0, carReq / 100 * this.rwa() - (this.tier1() + this.tier2()));

  snapshot(W, pnl, k) { // một dòng lịch sử; k quy đổi dòng lãi lỗ của kỳ về nhịp tháng (tuần: k = 4)

  yearEnd(W) {
    const yearNet = this.pnlYTD.net;
    let divRate = this.pol.divRate;

    if (yearNet > 0 && divRate > 0) {
      const carMin6 = Math.min(this.car(), ...this.hist.slice(-6).map(h => h.car)); const carReq = W.sbv.carMin + Math.max(1, W.sbv.carBuf || 0); if (carMin6 < carReq || this.nplGross() > 0.03 || this.vamcFace > 0 || this.lolr > 0 || this.sp0 > 0) this.addLog(W.month, `NHNN không chấp thuận chia cổ tức tiền mặt (CAR 6 tháng qua dưới ${pp(W.sbv.carMin + Math.max(1, W.sbv.carBuf || 0), 2)} = tối thiểu + bộ đệm, nợ xấu gộp > 3%, còn trái phiếu VAMC hoặc đang vay NHNN đặc biệt).`, 'warn');
      else { const d = yearNet * divRate / 100; this.cash -= d; this.equity.retained -= d; W.divPool = (W.divPool || 0) + d; this.addLog(W.month, `Chia cổ tức tiền mặt ${fmt0(d)} tỷ (${divRate}% lợi nhuận).`, 'good'); }
    }

    const roeTarget = W.diff.roe - (this.type === 'sob' ? 3 : 0);
    this.score += Math.round(roe - roeTarget / 2);
    if (this.isPlayer) {
      if (roe < roeTarget - 5 && W.month > 12) { this.unhappy++; this.addLog(W.month, `ROE năm ${pp(roe, 1)} thấp hơn kỳ vọng ${roeTarget}% của ${this.type === 'sob' ? 'Nhà nước' : 'cổ đông'}. Cảnh báo ${this.unhappy}/3: ba năm là bị thay Tổng giám đốc.`, 'bad'); }
      else if (roe >= roeTarget) { this.unhappy = Math.max(0, this.unhappy - 1); this.addLog(W.month, `ROE năm ${pp(roe, 1)} đạt kỳ vọng ${roeTarget}%. Điểm CEO +${Math.round(roe - roeTarget / 2)}.`, 'good'); }

  /* ---- hành động chủ động ---- */
  issueBonds(amount, sub, W) {
    if (amount <= 0) return 'Số tiền không hợp lệ.';
    if (this.car() < 8 && !sub) return 'Nhà đầu tư từ chối mua vì CAR dưới 8%.';
    if (this.healthSpread() >= 4) return 'Thị trường từ chối mua giấy tờ có giá của ngân hàng đang yếu (nợ xấu, thanh khoản, uy tín).'; // không có chuyện phát hành bằng mọi giá ở lãi 20%+
    const max = this.totalAssets() * 0.05;
    if (amount > max) return `Thị trường chỉ hấp thụ tối đa ${fmt0(max)} tỷ/tháng (5% tổng tài sản).`;
    if (sub) { if (this.subBonds + amount > this.tier1() * 0.5) return 'Vốn cấp 2 chỉ được tính tối đa 50% vốn cấp 1.'; this.subBonds += amount; }
    else this.bonds += amount;
    const fee = amount * 0.005; this.cash += amount - fee; this.equity.retained -= fee; this.pnlYTD.other -= fee; W.absorbPool = (W.absorbPool || 0) + amount * 0.7; W.ibTransfer = (W.ibTransfer || 0) + amount * 0.3; W.divPool = (W.divPool || 0) + fee; // 70% người mua là tổ chức phi ngân hàng (trả bằng tiền gửi), 30% ngân hàng khác (trả bằng tiền tại NHNN); phí trả cho tổ chức tư vấn
    const newRate = W.market.gt12 + 0.8 + this.healthSpread() * 0.5; const stock = sub ? this.subBonds - amount : this.bonds - amount; // giấy mới = lãi tiền gửi ≥12T + 0,8 (+ phụ trội sức khỏe); giấy cũ giữ lãi cũ tới hết hạn
    if (!sub) this.bondRate = ((this.bondRate ?? newRate) * Math.max(0, stock) + newRate * amount) / Math.max(1, Math.max(0, stock) + amount);
    this.addLog(W.month, `Phát hành ${fmt0(amount)} tỷ ${sub ? 'trái phiếu thứ cấp (vốn cấp 2)' : 'giấy tờ có giá kỳ hạn 3 năm'}, lãi ${pp(newRate + (sub ? 1.5 : 0))} (bình quân giấy đang lưu hành ${pp(this.bondRate + (sub ? 1.5 : 0))}).`, 'good');
    W.trace('ai', `${this.code} phát hành ${fmt0(amount)} ${sub ? 'trái phiếu thứ cấp (vốn cấp 2)' : 'GTCG 3 năm (tính vào mẫu số LDR và nguồn TDH)'} lãi ${pp(newRate + (sub ? 1.5 : 0))}; GTCG lưu hành ${fmt0(this.bonds)} (${pp(this.bonds / Math.max(1, this.totalAssets()) * 100, 1)} tổng tài sản); LDR sau phát hành ${pp(this.ldr(), 1)}`);

  }
  raiseCapital(amount, W) {
    if (amount <= 0) return 'Số tiền không hợp lệ.';
    if (this.capitalRaisedThisYear) return 'Mỗi năm chỉ được tăng vốn một lần (cần ĐHĐCĐ và NHNN chấp thuận).';
    if ((this.lolr || 0) > this.deposits() * 0.05 || this.healthSpread() >= 4) return 'Nhà đầu tư từ chối góp vốn vào ngân hàng đang phải vay NHNN đặc biệt hoặc đang yếu.';
    if (amount > this.equity.charter * 0.4) return 'Cổ đông chỉ chấp thuận tối đa 40% vốn điều lệ hiện tại.';
    const ok = Math.random() < (this.type === 'sob' ? 0.55 : 0.85) - (this.nplRatio() > 0.04 ? 0.25 : 0);
    this.capitalRaisedThisYear = true;
    if (!ok) { this.addLog(W.month, `Phương án tăng vốn ${fmt0(amount)} tỷ không được chấp thuận năm nay.`, 'bad'); return 'Không được chấp thuận. Thử lại năm sau.'; }
    const fee = amount * 0.02; this.equity.charter += amount; this.cash += amount - fee; this.equity.retained -= fee; this.pnlYTD.other -= fee; W.absorbPool = (W.absorbPool || 0) + amount; W.divPool = (W.divPool || 0) + fee;

    return null;
  }
  vamcEligible() { // VAMC chỉ mua nợ có tài sản bảo đảm, hồ sơ pháp lý đủ; tối đa 2% dư nợ mỗi đợt
    const EL = { re: 1.0, corp: 0.7, agri: 0.6, cons: 0 }; let face = 0, prov = 0;
    for (const s of SECTORS) { const b = this.book[s.id]; const e = EL[s.id] ?? 0; const c = 1 - this.collOf(s); face += (b.g4 + b.g5) * e; prov += (b.g4 * 0.5 + b.g5 * 1.0) * c * e; }

  }
  sellToVamc(W) {
    if (this.nplRatio() < 0.02) return 'VAMC chỉ nhận nợ khi tỷ lệ nợ xấu từ 2% trở lên.';
    if (W.month - this.vamcLast < 6) return 'Mỗi 6 tháng chỉ được bán một đợt cho VAMC.';
    const el = this.vamcEligible(); if (el.face < 1) return 'Không có nợ đủ điều kiện (cần tài sản bảo đảm; nợ tiêu dùng tín chấp không bán được).';
    const EL = { re: 1.0, corp: 0.7, agri: 0.6, cons: 0 };
    for (const s of SECTORS) { const b = this.book[s.id]; const e = (EL[s.id] ?? 0) * el.k; b.g4 -= b.g4 * e; b.g5 -= b.g5 * e; }
    const haircut = el.face * 0.05; // chiết khấu hồ sơ, chi phí định giá: lỗ ngay
    this.prov -= el.prov; const bond = el.face - el.prov - haircut; this.vamc += bond; this.vamcFace += el.face; this.vamcRoll = (this.vamcRoll || 0) + el.face; // dư nợ rời sổ sang VAMC được bù ở kỳ giải ngân sau (dư nợ không co)
    this.equity.retained -= haircut; this.pnlYTD.other -= haircut; this.vamcLast = W.month; if (this.vamcStart < 0 || this.vamcFace <= el.face + 1) this.vamcStart = W.month;
    this.addLog(W.month, `Bán ${fmt0(el.face)} tỷ nợ nhóm 4–5 có tài sản bảo đảm cho VAMC: nhận trái phiếu đặc biệt ${fmt0(bond)} tỷ (lãi 0%), lỗ chiết khấu ${fmt0(haircut)} tỷ, phải trích 20%/năm, tự thu hồi nợ, nợ xấu gộp vẫn ${pp(this.nplGross() * 100)}; sau 5 năm mua lại phần chưa xử lý.`, 'warn');
    return null;
  }
  sellNplMarket(W) { // bán nợ theo giá thị trường (DATC, công ty mua bán nợ): tiền mặt ngay, lỗ ngay
    let face = 0, spec = 0, price = 0;
    for (const s of SECTORS) { const b = this.book[s.id]; const c = 1 - this.collOf(s); const p = s.id === 'cons' ? 0.25 : 0.55; face += b.g4 + b.g5; spec += (b.g4 * 0.5 + b.g5 * 1.0) * c; price += (b.g4 + b.g5) * p * (s.id === 'cons' ? 1 : (0.5 + s.coll)); b.g4 = 0; b.g5 = 0; }
    if (face < 1) return 'Không có nợ nhóm 4–5 để bán.';
    const loss = face - spec - price; this.prov -= spec; this.cash += price; W.absorbPool = (W.absorbPool || 0) + price; this.equity.retained -= loss; this.pnlYTD.other -= loss; // công ty mua nợ trả bằng tiền gửi // lỗ (hoặc lãi) so với giá trị đã trích lập
    this.addLog(W.month, `Bán ${fmt0(face)} tỷ nợ nhóm 4–5 theo giá thị trường: thu ${fmt0(price)} tỷ tiền mặt (${pp(price / face * 100, 0)} mệnh giá), ${loss >= 0 ? 'lỗ thêm ' + fmt0(loss) : 'hoàn nhập ' + fmt0(-loss)} tỷ so với dự phòng đã trích.`, 'warn');
    return null;
  }
}

  }

  depFlow(vnd) { // ngân hàng mua (+) / bán (−) USD với khách bằng vị thế ngoại tệ của mình: tiền gửi và tài sản ngoại tệ cùng đổi, tiền cơ sở không đổi

    alive.forEach((b, i) => { let x = vnd * w[i] / ws; if (x < 0) x = -Math.min(-x, b.dep.casa * 0.5, b.usdA || 0); b.dep.casa += x; b.usdA = (b.usdA || 0) + x; });
  }
  usdToSbv(vnd) { // ngân hàng bán USD cho NHNN (vnd > 0): tài sản ngoại tệ giảm, tiền tại NHNN tăng; NHNN bán cho ngân hàng (vnd < 0) rồi ngân hàng bán lại cho khách: xem fxFlow
    const alive = this.banks.filter(b => !b.dead); const w = alive.map(b => Math.max(1, b.usdA || 0)); const ws = sum(w);
    alive.forEach((b, i) => { const x = vnd * w[i] / ws; b.usdA -= x; b.cash += x; }); this.ledgerAdd('fx', vnd);
  }
  settle(dt) { // cân vị thế tiền tại NHNN cuối kỳ: dự trữ bắt buộc → thừa cho vay, thiếu đi vay liên ngân hàng (hai phía bằng nhau) → phần thiếu còn lại NHNN bơm theo lượng NHNN chọn → bán TPCP → tái cấp vốn đặc biệt; lãi liên ngân hàng từ thiếu hụt
    const S = this.sbv, alive = this.banks.filter(b => !b.dead && b._f); if (!alive.length) return; const sysDep = Math.max(1, this.sysDeposits());
    for (const b of alive) { const dR = b._f.reqRes - b.reserve; b.reserve = b._f.reqRes; b.cash -= dR; // dự trữ bắt buộc theo tiền gửi
      b.cash += b.ibLend - b.ibBorrow - b.refi; if (b.refi) this.ledgerAdd('omo', -b.refi); b.ibLend = 0; b.ibBorrow = 0; b.refi = 0; b.short = false; } // tất toán vị thế kỳ trước
    const buf = b => b.deposits() * b.pol.cashBuffer / 100;
    for (const b of alive) { if (b.lolr > 0 && b.cash > buf(b)) { const rp = Math.min(b.lolr, b.cash - buf(b)); b.lolr -= rp; b.cash -= rp; this.ledgerAdd('lolr', -rp); if (b.lolr < 1) { b.lolr = 0; b.addLog(this.month, 'Đã trả hết tái cấp vốn đặc biệt cho NHNN; ra khỏi diện giám sát tăng cường.', 'good'); } } }
    for (const b of alive) { if (b.cash < buf(b) && b.bills > 0) { const rb = Math.min(buf(b) - b.cash, b.bills); b.bills -= rb; b.cash += rb; this.ledgerAdd('bills', rb); } } // thiếu thì bán lại tín phiếu trước
    const pos = alive.map(b => b.cash - buf(b)); alive.forEach((b, i) => { b.selfPosAcc = (b.selfPosAcc || 0) + pos[i]; b.selfPosN = (b.selfPosN || 0) + 1; }); /* tiền tự có (thừa > 0, thiếu < 0) trước khi vay nhau/OMO, ghi lịch sử */ const Ssur = sum(pos.map(x => Math.max(0, x))); const defi = alive.map((b, i) => Math.max(0, -pos[i]));
    const lim = alive.map((b, i) => Math.min(defi[i], Math.max(0, b._f.ibLimit) * (this.ibFrozen ? 0.3 : 1))); const Dacc = sum(lim); const D = sum(defi);
    const lent = Math.min(Ssur, Dacc); // thị trường liên ngân hàng khớp hai phía: tổng cho vay = tổng đi vay
    alive.forEach((b, i) => { if (pos[i] > 0 && Ssur > 0) { const l = pos[i] * lent / Ssur; b.ibLend = l; b.cash -= l; } else if (defi[i] > 0 && Dacc > 0) { const g = lim[i] * lent / Dacc; b.ibBorrow = g; b.cash += g; } });
    // NHNN bơm OMO: lượng NHNN chọn (chế độ NHNN: đợt bơm đang mở; chế độ ngân hàng: tỷ lệ bù thiếu hụt omoFill), giới hạn bởi TPCP cầm cố
    const rem = alive.map((b, i) => Math.max(0, buf(b) - b.cash)); const shortage = sum(rem);
    const offer = this.mode === 'sbv' && !this.autoSbv ? Math.max(0, S.omoNet || 0) : Math.min(shortage * Math.min(1, (S.omoFill ?? 1) + 0.08), shortage * (S.omoFill ?? 1) + Math.max(0, S.suaInj || 0)); // định hướng giảm lãi bơm thêm nhưng không bù quá omoFill + 8%
    let omoTaken = 0; if (shortage > 0 && offer > 0) alive.forEach((b, i) => { if (rem[i] <= 0) return; const take = Math.min(rem[i], Math.max(0, b.gbonds * 0.9), offer * rem[i] / shortage, b.omoCap != null ? Math.max(0, b.omoCap - b.refi) : Infinity); /* ngân hàng bị giám sát LCR: OMO không vượt mức lúc bị giám sát */ if (take > 0) { b.refi += take; b.cash += take; omoTaken += take; } });
    if (omoTaken) this.ledgerAdd('omo', omoTaken); // (cho vay qua đêm ghi sổ bên dưới)
    let odTot = 0, lolrNew = 0; for (const b of alive) { b.refiPen = 0; let need = buf(b) - b.cash; if (need <= 0) continue; b.short = need > buf(b); // thiếu hụt lớn hơn cả đệm sau OMO (phải vay qua đêm lãi phạt hoặc tái cấp vốn): dùng OMO thường xuyên là bình thường
      const od = Math.min(need, Math.max(0, b.gbonds * 0.9 - b.refi)); if (od > 0) { b.refi += od; b.refiPen = od; b.cash += od; odTot += od; need -= od; } // cho vay qua đêm của NHNN trong thanh toán: lãi phạt = tái cấp vốn + odPen, cần TPCP cầm cố
      if (need > 0) { const x = need; lolrNew += x; b.lolr = (b.lolr || 0) + x; b.cash += x; this.ledgerAdd('lolr', x); this.trace('lolr', `${b.code}: thiếu ${fmt0(x)} sau liên NH và OMO (hết TPCP cầm cố) → tái cấp vốn đặc biệt, tổng ${fmt0(b.lolr)}`); // người cho vay cuối cùng
        if (!b.liqFailWk) { b.liqFailWk = true; b.reputation -= 1; b.rescued = (b.rescued || 0) + 1; b.addLog(this.month, `MẤT THANH KHOẢN: thiếu ${fmt0(x)} tỷ, không vay được liên ngân hàng, hết TPCP cầm cố. NHNN tái cấp vốn đặc biệt (lãi ${pp(S.refi + 2)}); giám sát tăng cường, phải bán tài sản trả nợ. Khách hàng bắt đầu rút tiền.`, 'bad'); this.act('NHNN', `NHNN tái cấp vốn đặc biệt cho ${b.name}: ${fmt0(x)} tỷ, lãi ${pp(S.refi + 2)}, buộc bán tài sản để trả.`, 'warn', 'Người cho vay cuối cùng: không để ngân hàng mất khả năng chi trả; tiền bơm ra sẽ được hút lại và lãi suất phải tăng để xử lý tài sản'); } } }
    if (odTot) this.ledgerAdd('omo', odTot);
    // Lãi liên ngân hàng: hàm của (tiền tại NHNN − nhu cầu) / tiền gửi, phần nghìn. Thừa → về sàn (lãi tín phiếu nếu NHNN đang hút, không thì 0,5%); thiếu mà NHNN không bơm đủ → vượt lãi OMO, trần mềm = tái cấp vốn + 4
    const x = (Ssur - D) / sysDep * 1000; const cover = shortage > 0 ? omoTaken / shortage : 1; const floorR = (S.billsOut || 0) > sysDep * 0.001 ? Math.max(0.3, S.bill) : 0.5; const capR = S.refi + (S.odPen ?? 0.5); // trần cứng cho phần có tài sản bảo đảm = lãi cho vay qua đêm trong thanh toán điện tử liên ngân hàng (TCV + 0,5, hiện 5%)
    const unc = shortage > 0 ? Math.max(0, shortage - omoTaken) / shortage : 0; // phần thiếu hụt NHNN không bù qua OMO: phải vay qua đêm lãi phạt hoặc tái cấp vốn
    const uncPm = Math.max(0, shortage - omoTaken) / sysDep * 1000, noCollPm = lolrNew / sysDep * 1000; // phần thiếu NHNN không bù (‰ tiền gửi): có TPCP cầm cố thì vay qua đêm ở trần cứng; hết TPCP mới phải vay đặc biệt
    let ibON = x >= 0 ? floorR + (S.omo - floorR) * Math.exp(-x / 4) : S.omo + (capR - S.omo) * Math.min(1, uncPm / 5) + Math.min(2.5, noCollPm * 0.5); // thiếu không bù theo độ lớn: 1‰ tiền gửi → đi 1/5 quãng tới trần cứng, 5‰ → chạm trần TCV + 0,5; chỉ phần hết tài sản bảo đảm (vay đặc biệt) mới đẩy LNH vượt trần, tối đa +2,5
    ibON += 0.5 * this.shock('ib'); ibON += rnd(-0.1, 0.1); ibON = clamp(ibON, 0.2, capR + 3); // sốc rút tiền hàng loạt: thị trường 2 đóng băng, phụ trội theo tham số ib
    if (this.mode === 'sbv') { const inj = S.ops.filter(o => o.kind === 'inject'), abs = S.ops.filter(o => o.kind === 'absorb'); const wavg = a => a.length ? sum(a.map(o => o.amt * (o.rate ?? S.omo))) / Math.max(1, sum(a.map(o => o.amt))) : null; const ri = wavg(inj), ra = wavg(abs); if (ri != null && cover >= 0.99 && sum(inj.map(o => o.amt)) > 20000) ibON = Math.min(ibON, ri + 0.25); if (ra != null && sum(abs.map(o => o.amt)) > 20000) ibON = Math.max(ibON, ra - 0.25); }
    this.ibPrem = lent > 0 ? sum(alive.map(b => b.ibBorrow * b.healthSpread())) / lent : 0; // phụ trội sức khỏe ngân hàng yếu trả, chia cho bên cho vay theo lượng cho vay
    this.liq = { x, surplus: Ssur, deficit: D, lent, shortage, omoTaken, od: odTot, cover, offer }; this.tightness = clamp(-x / 4, -0.8, 4); this.ibFrozen = this.tightness > 3;
    this.trace('settle', `settle: tiền tự có thừa ${fmt0(Ssur)} thiếu ${fmt0(D)} → x ${x.toFixed(2)}‰; vay nhau ${fmt0(lent)}; còn thiếu ${fmt0(shortage)}, NHNN chào OMO ${fmt0(offer)} (omoFill ${(S.omoFill ?? 1).toFixed(2)}) lấy ${fmt0(omoTaken)} (cầm cố TPCP), vay qua đêm lãi phạt (khối lượng) ${fmt0(odTot)}, không bù ${Math.round(unc * 100)}% = ${uncPm.toFixed(2)}‰ tiền gửi, hết TPCP cầm cố ${noCollPm.toFixed(2)}‰; LNH ${ibON.toFixed(2)} (sàn ${floorR.toFixed(2)} OMO ${S.omo} trần cứng có tài sản bảo đảm ${capR.toFixed(2)}, cover ${cover.toFixed(2)}); độ căng ${this.tightness.toFixed(2)}`);
    this.market.ibON = ibON; this.ibAvg = this.ibAvg == null ? ibON : 0.85 * this.ibAvg + 0.15 * ibON; this.omoStand = 0.9 * (this.omoStand || 0) + 0.1 * (omoTaken + odTot) / sysDep; // OMO thường trực (bình quân ~10 tuần, phần tiền gửi): thiếu VND cấu trúc khi > 1% for (const b of alive) b.ibRate = ibON + b.healthSpread(); // ibAvg: bình quân ~8 tuần, lãi huy động chỉ đi theo LNH kéo dài
    for (const b of alive) if (b.mech) Object.assign(b.mech, { ibBorrow: b.ibBorrow, refi: b.refi, ibLend: b.ibLend, cashEnd: b.cash, ibRate: b.ibRate });
  }
  weekNarrative() { // diễn giải nhân quả tuần này: điều gì dẫn tới điều gì (lãi liên ngân hàng, huy động, cho vay, tỷ giá, dự trữ)
    const a = this.snapPrev, b = this.snapNow; if (!a || !b) return ''; const S = this.sbv, M = this.macro; const d = k => b[k] - a[k]; const f2 = v => pp(v, 2); const out = [];
    const dBills = d('bills'), fxWk = S.fxNetWk || 0, dTre = d('treasury'), dDep = d('dep'), dLoan = d('loans');
    // 1. Liên ngân hàng: hàm nghịch của thanh khoản
    const c1 = [];
    if (dBills > 1000) c1.push(`NHNN hút ${fmt0(dBills)} tỷ qua tín phiếu (sàn lãi liên ngân hàng = lãi tín phiếu ${pp(S.bill)})`); else if (dBills < -1000) c1.push(`${fmt0(-dBills)} tỷ tín phiếu đáo hạn, tiền quay lại ngân hàng`);
    if (b.omoNet > a.omoNet + 1000) c1.push(`NHNN bơm ${fmt0(b.omoNet - a.omoNet)} tỷ qua OMO`);
    if (fxWk < -1000) c1.push(`NHNN bán ${fmt1(-fxWk / M.usd)} tỷ USD, nhà nhập khẩu rút ${fmt0(-fxWk)} tỷ tiền gửi mua USD`); else if (fxWk > 1000) c1.push(`NHNN mua ${fmt1(fxWk / M.usd)} tỷ USD, ${fmt0(fxWk)} tỷ VND chảy vào tiền gửi và dự trữ ngân hàng`);
    if (dTre > 3000) c1.push(`Kho bạc thu ròng, gửi thêm ${fmt0(dTre)} tỷ tại ngân hàng quốc doanh`); else if (dTre < -3000) c1.push(`Kho bạc giải ngân ${fmt0(-dTre)} tỷ, tiền chảy sang tiền gửi doanh nghiệp`);
    if (dLoan - dDep > b.dep * 0.002) c1.push(`cho vay (+${fmt0(dLoan)}) tăng nhanh hơn tiền gửi (${dDep >= 0 ? '+' : ''}${fmt0(dDep)}), tiền tại NHNN mỏng đi`); else if (dDep - dLoan > b.dep * 0.002) c1.push(`tiền gửi (+${fmt0(dDep)}) tăng nhanh hơn cho vay (${dLoan >= 0 ? '+' : ''}${fmt0(dLoan)}), ngân hàng thừa tiền`);
    if (b.lolr > a.lolr + 1000) c1.push(`NHNN tái cấp vốn đặc biệt ${fmt0(b.lolr - a.lolr)} tỷ (tiền cơ sở mới)`);
    if (b.refi !== a.refi) c1.push(`lãi điều hành ${b.refi > a.refi ? 'tăng' : 'giảm'} lên ${pp(b.refi)} đổi hành lang (trần OMO ${pp(S.omo)}, sàn tín phiếu ${pp(S.bill)})`);
    const dIb = d('ibON');
    if (Math.abs(dIb) >= 0.12) out.push(`LNH ${f2(a.ibON)} → ${f2(b.ibON)}${c1.length ? ' vì ' + c1.join('; ') : b.tight > a.tight + 0.1 ? ' vì thanh khoản hệ thống căng hơn (thiếu hụt tiền tại NHNN)' : b.tight < a.tight - 0.1 ? ' vì thanh khoản dồi dào hơn' : ' (dao động trong hành lang)'}.`);
    else if (c1.length) out.push(`Thanh khoản: ${c1.join('; ')}; LNH giữ ${f2(b.ibON)} trong hành lang ${pp(Math.max(0.5, (b.bills > 0 ? S.bill : 0.5)))}–${pp(S.omo)}.`);
    // 2. Huy động: theo liên ngân hàng có trễ, trần, định hướng, thiếu nguồn, lạm phát
    const dG = d('gt12'); const c2 = [];
    if (Math.abs(a.ibON - b.gt12 + 0.8 + 0.35 * b.sua) > 0.2 && Math.sign(dG) === Math.sign(a.ibON + 1.1 - b.gt12)) c2.push(`đi theo liên ngân hàng (${f2(a.ibON)} tuần trước) với độ trễ 1–2 tháng`);
    if (b.sua > a.sua + 0.05) c2.push(`NHNN kêu gọi giảm lãi (mức ${Math.round(b.sua * 100)}%)`); else if (b.sua < a.sua - 0.05) c2.push('NHNN rút định hướng giảm lãi');
    if (b.cap !== a.cap) c2.push(`trần lãi ngắn hạn ${pp(b.cap)}`);
    if (b.needy >= 0.5 && dG > 0) c2.push(`${Math.round(b.needy * 100)}% ngân hàng sát trần LDR hoặc mỏng thanh khoản phải trả cao hơn`);
    if (b.fundGap > 1 && dG > 0) c2.push(`tín dụng tăng nhanh hơn tiền gửi ${pp(b.fundGap, 1)}/năm`);
    if (b.cpi > MAC.piCap - 0.5 && dG > 0 && b.cpi > a.cpi + 0.03) c2.push(`kỳ vọng lạm phát ${pp(b.cpi, 1)} ${b.cpi >= MAC.piCap ? 'vượt' : 'sát'} mục tiêu 4%`);
    if (Math.abs(dG) >= 0.05) out.push(`Huy động 12T ${f2(a.gt12)} → ${f2(b.gt12)}${c2.length ? ' vì ' + c2.join(', ') : ''}.`);
    // 3. Cho vay: chi phí vốn (bình quân số dư, đổi chậm) + rủi ro + biên
    const dL = d('lend'), dC = d('cof');
    if (Math.abs(dL) >= 0.05) out.push(`Lãi vay mới ${f2(a.lend)} → ${f2(b.lend)}: chi phí vốn ${f2(a.cof)} → ${f2(b.cof)} (chỉ phần tiền gửi đáo hạn được tính lại)${b.sua > 0.3 ? ', ngân hàng nhường biên theo định hướng' : ''}${this.sysNpl() > 0.03 ? ', phụ trội rủi ro nợ xấu' : ''}.`);

    for (const n of (this.wkShocks || [])) if (/USD|Trump|thuế|Thuế|rút|Iran|Trung Đông|FDI|vàng|Suy thoái|thương mại/i.test(n)) c4.push(`cú sốc: ${n}`); if (M.cpi > (b.gt12 ?? b.ibON) + 0.3) c4.push(`lãi tiền gửi 12 tháng ${f2(b.gt12 ?? b.ibON)} thấp hơn CPI ${pp(M.cpi, 1)}: lãi thực âm, dân chuyển sang USD và vàng (${fmt1(FXB.realK * (M.cpi - (b.gt12 ?? b.ibON)))} tỷ USD/tháng)`); if (this.shock('cap') > 0) c4.push(`vốn rút ${fmt1(this.shock('cap'))} tỷ USD/tháng vì bất ổn bên ngoài, bất chấp chênh lệch lãi suất${this.shock('fdiCut') > 0 ? `; FDI giải ngân giảm ${Math.round(Math.min(1, this.shock('fdiCut')) * 100)}%` : ''}`);
    if (fxWk < -1000) c4.push('NHNN bán USD kéo tỷ giá xuống'); else if (fxWk > 1000) c4.push('NHNN mua USD chặn VND lên giá');
    if ((this.worldCycle || 0) > 0.5) c4.push('thế giới thuận, vốn vào'); else if ((this.worldCycle || 0) < -0.5) c4.push('thế giới rủi ro, vốn rút');
    if (Math.abs(dFx) >= 0.1 || Math.abs(d('res')) >= 0.5) out.push(`Tỷ giá ${fmt0(a.usd)} → ${fmt0(b.usd)} (xu hướng ${pp(b.fx, 1)}/năm)${c4.length ? ' vì ' + c4.join('; ') : ''}${Math.abs(d('res')) >= 0.5 ? `; dự trữ ${fmt1(a.res)} → ${fmt1(b.res)} tỷ USD` : ''}.`);
    // 5. Chuỗi nhân quả phía trước (chỉ nhắc khi đổi chuỗi hoặc đầu tháng)
    const chain = []; const pushChain = t => chain.push(t);
    if (b.fx > 3 && diffR > 0.5) pushChain(`Tiếp theo: VND mất giá ${pp(b.fx, 1)} > 3% → NHNN ${b.bills > a.bills ? 'đã' : 'sẽ'} hút tiền qua tín phiếu → LNH lên → huy động tăng theo sau 1–2 tháng → lãi vay tăng khi tiền gửi cũ đáo hạn${b.res < 70 ? '; dự trữ dưới 70 tỷ USD → có thể tăng lãi điều hành' : ''}.`);
    else if (b.sua >= 0.3 && b.gdp < MAC.gGoal) pushChain(`Tiếp theo: GDP ${pp(b.gdp, 1)} dưới mục tiêu → NHNN giữ định hướng giảm lãi (bơm OMO, kêu gọi) → huy động hạ → chi phí vốn giảm dần → lãi vay giảm sau 3–6 tháng → tín dụng và GDP phản ứng sau 2–3 quý.`);
    else if (b.fundGap > 2) pushChain(`Tiếp theo: tín dụng nhanh hơn tiền gửi → LDR sát trần → ngân hàng đua huy động, phát hành GTCG → chi phí vốn tăng → lãi vay mới tăng.`);
    const key = chain[0] ? chain[0].slice(0, 40) : ''; if (chain[0] && (key !== this.lastChain || this.week === 0)) out.push(chain[0]); this.lastChain = key;

  else if (B.car() < S.carMin + 1) a.push(['warn', `CAR ${pp(B.car())} sát ngưỡng. Giải ngân sẽ bị chặn bởi CAR mục tiêu.`]);
  if (B.ldr() > B.ldrCap()) a.push(['bad', `LDR ${pp(B.ldr(), 1)} vượt trần ${B.ldrCap()}%. Tăng lãi suất huy động, phát hành giấy tờ có giá hoặc hãm tăng trưởng tín dụng.`]);

  if (B.liqReserve() < 10) a.push(['bad', `Dự trữ thanh khoản ${pp(B.liqReserve(), 1)} dưới 10%. Giữ thêm tiền mặt/TPCP.`]);
  { const L = B.lcr(); if (L.lcr < S.lcrMin) a.push(['bad', `LCR ${pp(L.lcr, 0)} dưới ngưỡng ${S.lcrMin}%: OMO và vay liên ngân hàng tính 100% dòng ra, TPCP đã cầm cố không còn là HQLA. Mua tín phiếu/TPCP bằng tiền thừa, thay OMO bằng tiền gửi 6–12 tháng và ≥12 tháng, phát hành GTCG.`]); else if (L.lcr < S.lcrMin + 20) a.push(['warn', `LCR ${pp(L.lcr, 0)} dưới mục tiêu nội bộ ${S.lcrMin + 20}%: tăng HQLA hoặc kéo dài kỳ hạn nguồn.`]); }
  if (B.nplGross() > 0.03) a.push(['warn', `Nợ xấu gộp ${pp(B.nplGross() * 100)} (nội bảng ${pp(B.nplRatio() * 100)}) trên 3%: bị hạn chế chia cổ tức và nới room. VAMC chỉ giấu tạm; xử lý thật bằng dự phòng, bán nợ chịu lỗ hoặc siết khẩu vị.`]);
  if (B.vamcFace > 0) a.push(['info', `Còn ${fmt0(B.vamcFace)} tỷ nợ đã bán VAMC phải thu hồi; trích 20%/năm, đáo hạn ${W.dateStr(B.vamcStart + 60)}.`]);

function roeBreakdown(B) { // phân rã ROE 12 tháng gần nhất (DuPont): ROE = ROA × đòn bẩy; so với 12 tháng trước đó
  const H = B.hist; if (H.length < 3) return null;
  const win = rows => { const n = rows.length; const s = k => rows.reduce((a, r) => a + (r[k] || 0), 0) * 12 / n; const avgTA = rows.reduce((a, r) => a + r.TA, 0) / n, avgEq = rows.reduce((a, r) => a + r.eq, 0) / n;
    return { n, avgTA, avgEq, lev: avgTA / avgEq, nii: s('nii') / avgTA * 100, fee: s('fee') / avgTA * 100, opex: -s('opex') / avgTA * 100, prov: -s('provExp') / avgTA * 100, other: s('other') / avgTA * 100, tax: -s('tax') / avgTA * 100, roa: s('net') / avgTA * 100, roe: s('net') / avgEq * 100, net: s('net'), taG: rows[n - 1].TA / rows[0].TA, eqG: rows[n - 1].eq / rows[0].eq }; };
  const cur = win(H.slice(-12)); const prev = H.length >= 18 ? win(H.slice(-24, -12)) : null; return { cur, prev };
}
function roePanel(B) {
  const d = roeBreakdown(B); if (!d) return '<p class="muted">Cần vài tháng dữ liệu.</p>'; const c = d.cur, p = d.prev; const f = v => (v >= 0 ? '+' : '') + v.toFixed(2).replace('.', ',');
  const rows = [['Thu nhập lãi thuần / tài sản', 'nii'], ['Thu phí / tài sản', 'fee'], ['Chi phí hoạt động / tài sản', 'opex'], ['Dự phòng / tài sản', 'prov'], ['Thu khác / tài sản', 'other'], ['Thuế / tài sản', 'tax']];
  let why = '';
  if (p) { const dRoe = c.roe - p.roe; const levEff = (c.lev - p.lev) * p.roa, roaEff = (c.roa - p.roa) * c.lev; const parts = rows.map(r => ({ n: r[0], d: (c[r[1]] - p[r[1]]) * c.lev })).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
    why = `<p class="small"><b>ROE ${dRoe >= 0 ? 'tăng' : 'giảm'} ${Math.abs(dRoe).toFixed(1).replace('.', ',')} điểm so với 12 tháng trước.</b> Đòn bẩy ${p.lev.toFixed(1).replace('.', ',')}× → ${c.lev.toFixed(1).replace('.', ',')}× đóng góp ${f(levEff)} điểm (vốn chủ tăng ${pp((c.eqG - 1) * 100, 0)} trong 12 tháng, tài sản tăng ${pp((c.taG - 1) * 100, 0)}); ROA ${p.roa.toFixed(2).replace('.', ',')} → ${c.roa.toFixed(2).replace('.', ',')} đóng góp ${f(roaEff)} điểm, trong đó ${parts.slice(0, 3).map(x => `${x.n.toLowerCase()} ${f(x.d)}`).join(', ')}.${levEff < -0.8 ? ' Vốn chủ tích lũy nhanh hơn tài sản: hoặc tăng trưởng tài sản nhanh hơn (room, nguồn vốn), hoặc chia cổ tức tiền mặt cao hơn, nếu không ROE sẽ trượt dần dù NIM không đổi.' : ''}${c.prov - p.prov < -0.3 ? ' Chi phí dự phòng tăng mạnh: nợ xấu hình thành nhiều hơn.' : ''}${c.nii - p.nii < -0.3 ? ' Biên lãi thu hẹp: chi phí vốn tăng (giấy tờ có giá, cạnh tranh huy động) nhanh hơn lãi cho vay.' : ''}</p>`; }
  return `<table>${rows.map(r => `<tr><td>${r[0]}</td><td class="r">${c[r[1]].toFixed(2).replace('.', ',')}${p ? ` <span class="muted">(${f(c[r[1]] - p[r[1]])})</span>` : ''}</td></tr>`).join('')}
    <tr class="tot"><td>ROA (lợi nhuận / tài sản bình quân)</td><td class="r">${c.roa.toFixed(2).replace('.', ',')}${p ? ` <span class="muted">(${f(c.roa - p.roa)})</span>` : ''}</td></tr>
    <tr><td>Đòn bẩy (tài sản / vốn chủ bình quân)</td><td class="r">${c.lev.toFixed(1).replace('.', ',')}×${p ? ` <span class="muted">(${f(c.lev - p.lev)})</span>` : ''}</td></tr>
    <tr class="tot"><td>ROE = ROA × đòn bẩy (12 tháng, vốn chủ bình quân)</td><td class="r">${c.roe.toFixed(1).replace('.', ',')}%${p ? ` <span class="muted">(${f(c.roe - p.roe)})</span>` : ''}</td></tr></table>${why}`;
}

  if (M.gdp < MAC.gGoal) a.push([M.gdp < 6 ? 'bad' : 'warn', `GDP ${pp(M.gdp, 1)} dưới mục tiêu ${pp(MAC.gGoal, 0)} của Chính phủ. Có thể hạ lãi suất, nới room, bơm OMO nếu lạm phát cho phép; Chính phủ đang ${W.fiscal.push >= 1 ? 'thúc giải ngân đầu tư công đạt 100% kế hoạch' : 'giải ngân ~85% kế hoạch'}.`]);

  if (weak.length) a.push(['warn', `Ngân hàng yếu: ${weak.map(b => b.name).join(', ')}. Theo dõi CAR, nợ xấu, thanh khoản.`]);
  if (!a.length) a.push(['good', 'Hệ thống ổn định. Duy trì chính sách và theo dõi tỷ giá.']);
  return a;
}

const ACT = {
  rate(B, k, d) { const p = B.pol; p[k] = +clamp(p[k] + d, 0, 30).toFixed(2); if (p.spread && k in p.spread) p.spread[k] = +(p.spread[k] + d).toFixed(2); B.addLog(W.month, `${RATE_NAMES[k]}: ${pp(p[k])} (${d > 0 ? '+' : ''}${d.toFixed(2).replace('.', ',')}).`, ''); },
  num(B, k, d, lo, hi, name, unit = '') { const p = B.pol; p[k] = +clamp(p[k] + d, lo, hi).toFixed(2); B.addLog(W.month, `${name}: ${String(p[k]).replace('.', ',')}${unit}.`, ''); },
  mix(B, id, d) { const p = B.pol; p.mix[id] = clamp(p.mix[id] + d, 0, 0.8); const s = sum(Object.values(p.mix)); for (const k in p.mix) p.mix[k] /= s; B.addLog(W.month, `Cơ cấu giải ngân: ${SECTORS.map(x => x.name.split(' ')[0] + ' ' + Math.round(p.mix[x.id] * 100) + '%').join(', ')}.`, ''); },
  preset(B, name) { const P = { corp: { corp: 0.6, re: 0.2, cons: 0.05, agri: 0.15 }, re: { corp: 0.3, re: 0.55, cons: 0.1, agri: 0.05 }, retail: { corp: 0.3, re: 0.35, cons: 0.3, agri: 0.05 }, agri: { corp: 0.3, re: 0.15, cons: 0.05, agri: 0.5 }, safe: { corp: 0.5, re: 0.15, cons: 0.05, agri: 0.3 } }[name]; B.pol.mix = { ...P }; B.addLog(W.month, `Đổi cơ cấu giải ngân sang mẫu "${PRESET_NAMES[name]}".`, ''); },
  issue(B, pct, sub) { const e = B.issueBonds(B.totalAssets() * pct / 100, sub, W); if (e) toast(e); },
  raise(B, pct) { const e = B.raiseCapital(B.equity.charter * pct / 100, W); if (e) toast(e); },
  vamc(B) { const e = B.sellToVamc(W); if (e) toast(e); },
  npmkt(B) { const e = B.sellNplMarket(W); if (e) toast(e); },
  anchor(B) { B.pol.anchor = !B.pol.anchor; if (B.pol.anchor) { const K = W.market; const ref = { rLt6: K.lt6, rM6_12: K.m6_12, rGt12: K.gt12, lendShort: K.lendShort ?? K.lend - 1.0, lendMLT: K.lendMLT ?? K.lend + 0.5 }; for (const k in ref) B.pol.spread[k] = B.pol[k] - ref[k]; } B.addLog(W.month, `Neo lãi suất theo thị trường: ${B.pol.anchor ? 'bật' : 'tắt'}.`, ''); },
};

function bindSbv(root) {
  const pane = root || $('#toolsBody');
  pane.querySelectorAll('[data-act]').forEach(btn => btn.onclick = () => {
    const a = btn.dataset.act, arg = JSON.parse(btn.dataset.arg || 'null'); if (a !== 'stop') W.act('Bạn', actLabel(btn) + (a === 'weak' ? ' (' + (W.banks[+$('#weakBank').value] || {}).code + ')' : ''), '', ctxWhy(null));
    if (a === 'rateDir') SBV.rateDir(arg); else if (a === 'set') SBV.set(...arg); else if (a === 'toggle') SBV.toggle(arg[0], arg[1]);
    else if (a === 'stance') SBV.stance(arg); else if (a === 'lendDir') { W.sbv.lendDir = arg; renderTools(); } else if (a === 'fxs') SBV.fxStance(arg); else if (a === 'stop') SBV.stopRoll(arg);
    else if (a === 'weak') SBV.weak(arg, +$('#weakBank').value);
    renderPane(); updateTop();
  });
}
function mergeBank(src, dst) {
  for (const s of SECTORS) { const a = dst.sectorTotal(s.id), b = src.sectorTotal(s.id); if (a + b > 0) dst.mltShare[s.id] = (a * dst.mltShare[s.id] + b * src.mltShare[s.id]) / (a + b); }
  for (const s of SECTORS) for (const k of ['perf', 'w', 'g3', 'g4', 'g5']) dst.book[s.id][k] += src.book[s.id][k];
  for (const k in dst.dep) dst.dep[k] += src.dep[k]; dst.rsTr = (dst.rsTr || []).concat(src.rsTr || []); src.rsTr = []; for (const k in (src.roll || {})) { const a = dst.roll[k], b = src.roll[k]; if (a.amt + b.amt > 0) a.prem = (a.amt * a.prem + b.amt * b.prem) / (a.amt + b.amt); a.amt += b.amt; a.cap += b.cap; b.amt = 0; }
  dst.cash += src.cash; dst.reserve += src.reserve; dst.ibLend += src.ibLend; dst.gbonds += src.gbonds; dst.fixed += src.fixed; dst.vamc += src.vamc; dst.vamcFace += src.vamcFace; dst.prov += src.prov;
  dst.treasury = (dst.treasury || 0) + (src.treasury || 0); src.treasury = 0;
  dst.bonds += src.bonds; dst.subBonds += src.subBonds; dst.ibBorrow += src.ibBorrow; dst.refi += src.refi; dst.concentrated += src.concentrated; dst.wholesale += src.wholesale; dst.other += src.other; dst.otherA += src.otherA;
  dst.usdA = (dst.usdA || 0) + (src.usdA || 0); dst.bills = (dst.bills || 0) + (src.bills || 0); dst.ibStruct = (dst.ibStruct || 0) + (src.ibStruct || 0); dst.ibStructL = (dst.ibStructL || 0) + (src.ibStructL || 0); dst.lolr = (dst.lolr || 0) + (src.lolr || 0); dst.sp0 = (dst.sp0 || 0) + (src.sp0 || 0); dst.sp0Got = (dst.sp0Got || 0) + (src.sp0Got || 0); // chuyển giao toàn bộ bảng cân đối: cả vị thế ngoại tệ, tín phiếu, liên NH cơ cấu và nợ NHNN (vay đặc biệt, cho vay 0%)
  dst.equity.retained += src.totalEquity(); dst.loansAtYearStart += src.loansAtYearStart;
  src.dead = true; src.deadReason = 'chuyển giao bắt buộc'; src.announced = true;
  for (const s of SECTORS) src.book[s.id] = { perf: 0, w: 0, g3: 0, g4: 0, g5: 0 };
  src.dep = { casa: 0, lt6: 0, m6_12: 0, gt12: 0 }; src.cash = 0; src.reserve = 0; src.ibLend = 0; src.gbonds = 0; src.fixed = 0; src.vamc = 0; src.vamcFace = 0; src.prov = 0; src.bonds = 0; src.subBonds = 0; src.ibBorrow = 0; src.refi = 0; src.equity = { charter: 0, retained: 0 }; src.concentrated = 0; src.wholesale = 0; src.other = 0; src.otherA = 0; src.usdA = 0; src.bills = 0; src.ibStruct = 0; src.ibStructL = 0; src.lolr = 0; src.sp0 = 0; src.sp0Got = 0;
}

function queueDecisions(evId) {
  W.decisions = W.decisions || []; W.cool = W.cool || {};
  const B = W.player;
  for (const d of DECISIONS) { if (d.mode !== W.mode) continue; if ((W.cool[d.id] || -99) > W.month) continue; try { if (d.cond(W, B)) { W.decisions.push({ d }); W.cool[d.id] = W.month + d.cool; } } catch (e) {} }
  if (evId) { const key = W.mode === 'sbv' && EVENT_DECISIONS[evId + '_sbv'] ? evId + '_sbv' : evId; const ed = EVENT_DECISIONS[key]; if (ed && ed.mode === W.mode) W.decisions.push({ d: ed, ev: true }); }
}
function showDecision() {
  const q = W.decisions; if (!q || !q.length) return false;
  const { d } = q[0]; const B = W.player; const text = typeof d.text === 'function' ? d.text(W, B) : d.text;
  Clock.playing = false; setPlayBtn();
  showModal((q[0].ev ? '' : 'Quyết định: ') + d.title, text, d.options.map(o => { const lbl = typeof o.label === 'function' ? o.label(W, B) : o.label; return { label: lbl, apply: () => { o.apply(W, B); W.act('Quyết định', `Quyết định "${d.title}": ${lbl}.`, 'info', 'Điều kiện: ' + String(text).replace(/<[^>]+>/g, '')); q.shift(); renderGame(); if (q.length) showDecision(); } }; }));
  return true;
}

function gauge(label, val, lim, isMax, maxScale, exp, unit = '%') {
  const ok = isMax ? val <= lim : val >= lim; const warn = isMax ? val <= lim * 1.05 : val >= lim * 0.95 && !ok;
  const cls = ok ? (isMax ? (val > lim - lim * 0.06 ? 'warn' : '') : (val < lim * 1.12 ? 'warn' : '')) : 'bad';
  const w = clamp(val / maxScale * 100, 0, 100), l = clamp(lim / maxScale * 100, 0, 100);
  return `<div class="gauge"><div class="lbl"><span>${label}</span><span class="num">${pp(val)} <span class="muted">(${isMax ? '≤' : '≥'} ${pp(lim, 1)})</span> <span class="pill ${ok ? 'good' : 'bad'}">${ok ? 'Đạt' : 'Vi phạm'}</span></span></div>
    <div class="bar"><div class="fill ${cls}" style="width:${w}%"></div><div class="lim" style="left:${l}%"></div></div><div class="exp">${exp}</div></div>`;
}

    g.strokeStyle = cssVar('--line'); g.beginPath(); g.moveTo(padL, y); g.lineTo(Wd - padR, y); g.stroke();
    const cnt = {}; acts.filter(a => a.who === l[0]).forEach(a => { const key = a.t ?? a.m * 4; cnt[key] = (cnt[key] || 0) + 1; });
    for (const m in cnt) { const k = cnt[m]; const px = xt(+m); const r = 4 + Math.min(4, k - 1); g.fillStyle = cssVar(l[1]); g.beginPath(); g.arc(px, y, r, 0, Math.PI * 2); g.fill(); if (k > 1) { g.fillStyle = '#fff'; g.font = 'bold 9px ' + cssVar('--mono'); g.textAlign = 'center'; g.fillText(k, px, y + 3); } pts.push({ x: px, y, m: +m, who: l[0] }); } });

function guidePane() {
  return `<div class="panel guide">
    <h2>Cách chơi</h2>
    <p>Đồng hồ chạy theo tuần (4 tuần một tháng): mỗi tuần kinh tế và bảng cân đối chảy 1/4 tháng (lãi, thu nợ, nợ xấu, huy động, giải ngân, tỷ giá, CPI); quyết định chính sách đặt ở tuần đầu tháng, khóa sổ và báo cáo ở tuần thứ tư. Chỉnh sửa giữa tháng có tác dụng ngay tuần sau. Mọi tham số chỉnh bằng nút bấm ở cột công cụ bên phải (luôn hiện để thao tác nhanh; nút <b>Tự động</b> ở thanh bên cho máy điều hành thay bạn); khi một chỉ số vượt ngưỡng hoặc có sự kiện lớn, game tự dừng và đưa ra các lựa chọn xử lý (bạn vẫn có thể chọn "theo dõi thêm"). Engine tính lãi, chuyển nhóm nợ, huy động, giải ngân, cân đối thanh khoản rồi kiểm tra tuân thủ. Mục tiêu: tối đa hóa ROE và điểm CEO trong khi giữ mọi tỷ lệ trong ngưỡng. NHNN không đưa ngân hàng nào vào kiểm soát đặc biệt: thiếu thanh khoản thì tái cấp vốn đặc biệt, thiếu vốn thì cho vay đặc biệt 0% (đổi bằng cung tiền và lạm phát); ROE kém 3 năm liền thì bạn bị thay Tổng giám đốc.</p>
    <h3>Các ràng buộc theo mô hình Việt Nam</h3>
    <ul>
      <li><b>CAR ≥ 8%</b> (Thông tư 41/2016, Basel II). Vốn tự có / tài sản có rủi ro. BĐS 120%, tiêu dùng 150%, sản xuất 100%, nông nghiệp 80%, TPCP 0%. Cách tăng: giữ lại lợi nhuận, tăng vốn điều lệ, trái phiếu thứ cấp, đổi cơ cấu sang tài sản rủi ro thấp.</li>
      <li><b>LDR ≤ 85%</b> (Thông tư 22/2019). Dư nợ / (tiền gửi + giấy tờ có giá). Muốn cho vay thêm phải huy động thêm.</li>
      <li><b>Vốn ngắn hạn cho vay trung dài hạn ≤ 30%</b> (từ 10/2023). Cho vay mua nhà, BĐS là trung dài hạn; tiền gửi dưới 12 tháng là ngắn hạn. Cần tiền gửi ≥12 tháng, GTCG dài hạn hoặc vốn tự có.</li>
      <li><b>Dự trữ bắt buộc</b>: 3% tiền gửi dưới 12 tháng, 1% từ 12 tháng. Tiền này nằm ở NHNN, gần như không sinh lãi.</li>
      <li><b>Dự trữ thanh khoản ≥ 10%</b> tổng nợ phải trả: tiền mặt, DTBB, TPCP, cho vay liên NH.</li>
      <li><b>Trần lãi suất huy động dưới 6 tháng</b> (hiện 4,75%). Vượt là bị phạt. Trần lãi cho vay ngắn hạn lĩnh vực ưu tiên 4%.</li>
      <li><b>Room tín dụng</b>: NHNN cấp hạn mức tăng trưởng mỗi năm theo xếp hạng (CAR cao, nợ xấu thấp được nhiều). Vượt room bị phạt và cắt room năm sau. Giữa năm có thể được nới.</li>
      <li><b>Phân loại nợ 5 nhóm và trích lập</b> (Thông tư 11/2021): nhóm 2: 5%, 3: 20%, 4: 50%, 5: 100% sau khấu trừ tài sản bảo đảm, cộng dự phòng chung 0,75%. Nợ xấu gộp (kể cả phần bán VAMC) trên 3%: không chia cổ tức, không nới room.</li>
      <li><b>Xử lý nợ xấu</b>: (1) dùng dự phòng xóa nợ nhóm 5, thu hồi tài sản bảo đảm dần; (2) bán cho VAMC: chỉ nợ có tài sản bảo đảm, tối đa 2% dư nợ mỗi đợt, 6 tháng một đợt, nhận trái phiếu đặc biệt lãi 0%, lỗ chiết khấu 5% ngay, trích 20% mệnh giá mỗi năm, vẫn tự thu hồi (nhanh hay chậm tùy thị trường BĐS), nợ xấu gộp vẫn bị NHNN tính khi cấp room và chặn cổ tức, sau 5 năm phải mua lại phần chưa xử lý; (3) bán nợ theo giá thị trường: thu 25–55% mệnh giá bằng tiền mặt ngay, phần chênh với dự phòng đã trích ghi lỗ ngay, sạch sổ thật; (4) ngừng tạo nợ xấu mới: siết khẩu vị, giảm tiêu dùng tín chấp và BĐS.</li>
      <li><b>Giới hạn cấp tín dụng một khách hàng</b> (Luật TCTD 2024): 14% vốn tự có, giảm dần về 10%. Xuất hiện trong sự kiện tập đoàn BĐS xin vay.</li>
    </ul>
    <h3>Cơ chế thanh khoản</h3>
    <p>Cuối tháng, tiền mặt thấp hơn đệm mục tiêu thì ngân hàng vay liên ngân hàng (tối đa ~20% tiền gửi, giảm khi yếu) với lãi O/N cộng phụ trội sức khỏe. Hết hạn mức thì vay OMO/tái cấp vốn NHNN bằng TPCP thế chấp (90% giá trị). Hết cả hai thì bán TPCP giá thấp, sau đó là mất thanh khoản: khách rút tiền, hai tháng liên tiếp là kiểm soát đặc biệt. Vì vậy TPCP vừa là đệm thanh khoản vừa là tài sản không tốn vốn.</p>
    <h3>Đánh đổi chính</h3>
    <ul>
      <li>Lãi suất huy động cao → tiền gửi tăng nhanh nhưng NIM giảm. CASA là nguồn rẻ nhất, tăng nhờ số hóa và mạng lưới, chậm.</li>
      <li>Lãi suất cho vay cao → biên cao nhưng cầu giảm và khách trả nợ kém hơn.</li>
      <li>Khẩu vị rủi ro cao → tăng trưởng và biên cao, nợ xấu hình thành nhanh gấp đôi khi vĩ mô xấu.</li>
      <li>BĐS và tiêu dùng cho lợi suất cao nhưng ăn CAR nhanh nhất và nhạy nhất với chu kỳ.</li>
      <li>Trả cổ tức tiền mặt làm vui cổ đông nhưng CAR mỏng đi; ngân hàng quốc doanh khó tăng vốn nên phải giữ lợi nhuận.</li>
    </ul>
    <h3>Khối vĩ mô có ràng buộc</h3>
    <p>Tăng trưởng, lạm phát, thất nghiệp và lãi suất gắn với nhau bằng bốn phương trình chuẩn (xem bảng "Ràng buộc vĩ mô" ở Tổng quan với số hiện tại): khoảng cách sản lượng tích lũy từ chênh lệch tăng trưởng so với tiềm năng 6,5%; đường IS kéo tăng trưởng về tiềm năng trừ tác động của lãi suất thực (lãi điều hành trừ kỳ vọng lạm phát) cộng xung lực tín dụng; đường Phillips đẩy lạm phát theo khoảng cách sản lượng, tiền tệ, tỷ giá và neo kỳ vọng 3,5%; định luật Okun kéo thất nghiệp về 2,3% trừ 0,35 lần chênh lệch tăng trưởng; quy tắc Taylor cho mức lãi suất điều hành gợi ý. Thất nghiệp và lãi suất thực cao làm nợ xấu hình thành nhanh hơn.</p>
    <h3>Chế độ Thống đốc NHNN</h3>
    <p>Bạn chỉ chọn hướng, còn lượng và bước do thị trường quyết. Thanh khoản: hút ròng hay bơm ròng, engine tự tính lượng tín phiếu (28 ngày) hoặc OMO (7 ngày) mỗi tháng để đưa lãi liên ngân hàng về mục tiêu (hút: max(OMO + 1, Fed + 0,5) để giữ chênh lệch lãi VND–USD dương; bơm: OMO − 0,4); về trung tính thì các đợt tất toán dần. Tỷ giá: bán USD giao ngay (tốn dự trữ ngay) hoặc bán kỳ hạn 3 tháng (hạ nhiệt kỳ vọng, dự trữ chỉ giảm khi đáo hạn, ngân hàng được hủy nếu VND ổn định), lượng tính theo mức VND mất giá vượt 2,5%/năm. Lãi suất điều hành: chỉ chọn tăng hay giảm, bước bằng nửa khoảng cách tới quy tắc Taylor (0,25–1,0 điểm), trần huy động đi theo. Lãi suất tái cấp vốn neo lãi suất thị trường; dự trữ bắt buộc hút hoặc bơm tiền cơ sở; room tín dụng và các trần LDR, vốn ngắn hạn cho vay TDH khống chế tốc độ và cấu trúc tăng trưởng. Tỷ giá phụ thuộc chênh lệch lãi suất VND–USD: lãi liên ngân hàng thấp hơn Fed nhiều thì VND mất giá, bạn phải bán dự trữ hoặc hút tiền. Tín dụng tăng nhanh đẩy GDP nhưng kéo CPI và BĐS lên với độ trễ.</p>
    <h3>Ghi chú</h3>
    <p>Đây là mô hình rút gọn để học và thử chính sách. Các hệ số co giãn, xác suất chuyển nhóm nợ và quy mô ngân hàng là giả định, không phải số liệu thật của bất kỳ ngân hàng nào. Có thể lưu ván chơi vào trình duyệt bằng nút Lưu.</p>
  </div>`;
}

function drawCurve(g, r, c) { // trục ngang là kỳ hạn, không phải thời gian

  g.textAlign = 'center'; c.tenors.forEach((t, i) => { g.fillStyle = '#8b949e'; g.fillText(t, x(i), r.y + r.h - 2); });

  if (ev.choice) showModal('Sự kiện: ' + ev.title, text, ev.choices.map(c => ({ label: c.label, apply: () => { c.apply(W); W.act('Sự kiện', `Sự kiện: ${ev.title} → ${c.label}`, 'warn', String(text).replace(/<[^>]+>/g, '')); W.pendingEvent = null; ev.animated = false; renderGame(); } })));
  else { showEventCard(ev.title, text + (ev.autoPicked ? ' · Tự động chọn: ' + ev.autoPicked : '')); delete ev.autoPicked; W.pendingEvent = null; ev.animated = false; renderGame(); }
}
let evCardTimer = null;
function showEventCard(title, text) {
  const el = $('#evcard'); if (!el) return; el.hidden = false; el.innerHTML = `<h4></h4><div class="txt"></div><button class="btn small">Đóng</button>`;
  el.querySelector('h4').textContent = 'Sự kiện: ' + title; el.querySelector('.txt').textContent = text;
  el.querySelector('button').onclick = () => { el.hidden = true; };
  clearTimeout(evCardTimer); evCardTimer = setTimeout(() => { el.hidden = true; }, 14000);
}
function toast(m) { const el = document.createElement('div'); el.className = 'pill info'; el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:8px 14px;font-size:13px;z-index:30;background:var(--panel);border:1px solid var(--line);color:var(--fg)'; el.textContent = m; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }
function saveGame() { try { const data = JSON.stringify(W, (k, v) => (k === 'pendingEvent' ? null : v)); localStorage.setItem('banksim-vn', data); return true; } catch (e) { return false; } }
function loadGame() {
  try {
    const raw = localStorage.getItem('banksim-vn'); if (!raw) return false;
    const d = JSON.parse(raw); const w = new World(d.mode, d.playerId, d.diffKey);
    Object.assign(w, d); w.banks = d.banks.map(bd => { const b = new Bank(BANKS.find(x => x.id === bd.id), bd.isPlayer); Object.assign(b, bd); if (!b.mltShare) b.initTenor(b.spec); if (b.pol.mltPref == null) b.pol.mltPref = 1; return b; });
    w.player = d.mode === 'bank' ? w.banks.find(b => b.isPlayer) : null; w.pendingEvent = null; w.sbv.ops = w.sbv.ops || []; w.sbv.bill = w.sbv.bill ?? w.sbv.omo - 0.5; w.sbv.band = w.sbv.band ?? 5; w.actions = w.actions || []; w.regApplied = w.regApplied || {}; KBNN_LDR = 0.5; for (const r of [...REG_CAL].sort((a, b) => a.y - b.y || a.mo - b.mo)) if ((r.y < w.year || (r.y === w.year && r.mo <= w.monthOfYear)) && /tt26|tt08|kbnn/.test(r.id)) { if (r.id === 'tt26_40') KBNN_LDR = 0.4; else if (r.id === 'tt02_off') KBNN_LDR = 0.2; else if (r.id === 'tt26_0') KBNN_LDR = 0; else if (r.id === 'tt08') KBNN_LDR = 0.2; else if (r.id === 'kbnn50') KBNN_LDR = 0.5; } w.termMonths = w.termMonths ?? 60; w.week = w.engineV === 2 ? (w.week || 0) : 0; w.engineV = 2; w.wk = w.wk || []; for (const b of w.banks) b.wk = b.wk || []; w.tick = w.tick || w.month * 4; w.lastEvTick = w.lastEvTick ?? -99; w.startY = w.startY ?? START.y; w.startMo = w.startMo ?? START.mo; w.L = w.L ?? HIST_N - 1; if (!w.fiscal) w.initFiscal(); for (const b of w.banks) b.treasury = b.treasury ?? 0; w.macro.usdY0 = w.macro.usdY0 ?? w.macro.usd; w.decisions = []; W = w; return true;
  } catch (e) { return false; }
}

renderStart();
window.addEventListener('resize', () => { if (W) drawCharts(W.mode === 'bank' ? W.player : W.banks[selectedBank]); });
</script>
