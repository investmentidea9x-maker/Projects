<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BankSim Việt Nam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky KPI strip on top, tab bar, one content column; data-dense dashboard feel of a treasury desk. */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --fg:#14201c; --muted:#5c6b64; --line:#d9ded9;
  --accent:#0f6b4f; --accent-soft:#dcefe6;
  --good:#1f7a3a; --warn:#b26a00; --bad:#b8322b; --info:#1f5fa8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#4a3aa7;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141917; --panel:#1d2422; --fg:#e8ece9; --muted:#9aa8a1; --line:#33403b;
  --accent:#4fbf95; --accent-soft:#1c3a30;
  --good:#5ccf7c; --warn:#f0b04a; --bad:#f07a72; --info:#6aa8f0;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1d2422; --fg:#e8ece9; --muted:#9aa8a1; --line:#33403b;
  --accent:#4fbf95; --accent-soft:#1c3a30;
  --good:#5ccf7c; --warn:#f0b04a; --bad:#f07a72; --info:#6aa8f0;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);padding-inline:16px;padding-block:0 24px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
button{font:inherit;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 6px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:18px;font-weight:700;color:var(--accent)}
.brand .sub{color:var(--muted);font-size:12px}
.date{font-family:var(--mono);font-size:15px;font-weight:500}
.ctrl{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:4px 8px;font-size:12px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px;margin-top:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-family:var(--mono);font-size:16px;font-weight:500;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;color:var(--muted);padding:8px 12px;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.pane{padding-block:14px}

/* panels */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.panel h2{margin-bottom:8px}
.panel p{margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:4px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;border-top:2px solid var(--line)}
tr.sub td{color:var(--muted);padding-left:16px}
.tw{overflow-x:auto}
.muted{color:var(--muted)}
.small{font-size:12px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;letter-spacing:.02em}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}

/* controls */
.field{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.field:last-child{border-bottom:0}
.field label{font-weight:500}
.field .hint{grid-column:1/-1;font-size:12px;color:var(--muted)}
.field input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.field input[type=number],.field select{width:110px;font:inherit;font-family:var(--mono);padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.field .val{font-family:var(--mono);min-width:64px;text-align:right}
.mixrow{display:grid;grid-template-columns:150px 1fr 56px;gap:8px;align-items:center;padding:3px 0}
.mixrow input{width:100%;accent-color:var(--accent)}
.mixrow .val{font-family:var(--mono);text-align:right}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions input[type=number]{width:120px;font-family:var(--mono);padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}

/* compliance */
.gauge{margin:8px 0}
.gauge .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.gauge .bar{position:relative;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--good)}
.gauge .fill.warn{background:var(--warn)} .gauge .fill.bad{background:var(--bad)}
.gauge .lim{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg)}
.gauge .exp{font-size:12px;color:var(--muted);margin-top:3px}

/* log */
.log{max-height:420px;overflow:auto;font-size:13px}
.log div{padding:4px 0;border-bottom:1px solid var(--line)}
.log .t{font-family:var(--mono);color:var(--muted);margin-right:8px}
.log .bad{color:var(--bad)} .log .good{color:var(--good)} .log .warn{color:var(--warn)}

/* charts */
canvas.chart{width:100%;height:220px;display:block;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* real-time shell */
.clock{display:flex;flex-direction:column;gap:4px;min-width:150px}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent)}
.scene-wrap{margin-inline:-16px;background:#0b1020;border-bottom:1px solid var(--line)}
canvas#scene{display:block;width:100%;max-width:960px;margin:0 auto;aspect-ratio:384/112;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.ticker-wrap{overflow:hidden;background:#0b1020;color:#ffd84a;font-family:var(--mono);font-size:12px;height:20px;line-height:20px;white-space:nowrap;position:relative}
.ticker{display:inline-block;white-space:nowrap;will-change:transform;padding-inline:8px}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:12px;align-items:start;margin-top:4px}
.split .left{min-width:0}
.term{background:#0d1117;color:#c9d1d9;font-family:var(--mono);font-size:12px;border:1px solid #30363d;border-radius:8px;padding:8px 10px;height:min(72vh,720px);min-height:260px;overflow:auto;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px)}
.term-head{color:#8b949e;text-transform:uppercase;letter-spacing:.06em;font-size:11px;border-bottom:1px solid #30363d;padding-bottom:4px;margin-bottom:4px}
.term .ln{white-space:pre-wrap;word-break:break-word;padding:1px 0;line-height:1.4}
.term .t{color:#8b949e;margin-right:6px}.term .src{color:#79c0ff;margin-right:2px}
.term .bad .msg{color:#ff7b72}.term .good .msg{color:#7ee787}.term .warn .msg{color:#e3b341}.term .info .msg{color:#79c0ff}.term .dim{color:#8b949e;border-top:1px dashed #30363d;margin-top:3px;padding-top:3px}
@media (max-width:900px){.split{grid-template-columns:1fr}.term{position:static;height:280px}}
/* start screen & modal */
.start{max-width:960px;margin:24px auto}
.start h1{font-size:30px;color:var(--accent);margin-bottom:4px}
.start .lead{max-width:65ch;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;text-align:left;color:var(--fg)}
.card:hover{border-color:var(--accent)}
.card h3{font-size:16px;margin-bottom:6px}
.card .meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:560px;width:100%;padding:18px;max-height:90vh;overflow:auto}
.modal h3{font-size:18px;margin-bottom:8px}
.modal .choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.modal .choices .btn{text-align:left}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{border-left:3px solid var(--warn);padding:6px 10px;background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:0 6px 6px 0;font-size:13px}
.alert.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.alert.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.guide{max-width:72ch}
.guide h3{font-size:15px;margin:14px 0 4px}
.guide ul{padding-left:18px;margin:4px 0}
.guide li{margin:3px 0}
.guide code{font-family:var(--mono);font-size:12px;background:var(--bg);padding:1px 4px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){ .mixrow{grid-template-columns:110px 1fr 50px} .field input[type=number]{width:90px} }
</style>
</head>
<body>

<div id="app"></div>

<script>
'use strict';
/* =====================================================================
   BankSim Việt Nam – engine
   Đơn vị tiền: tỷ VND. Bước mô phỏng: 1 tháng. Lãi suất: %/năm.
   ===================================================================== */

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sum = arr => arr.reduce((a, b) => a + b, 0);
const rnd = (a, b) => a + Math.random() * (b - a);
const fmt0 = n => Math.round(n).toLocaleString('vi-VN');
const fmt1 = n => n.toLocaleString('vi-VN', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const pct = (x, d = 2) => (x * 100).toFixed(d).replace('.', ',') + '%';
const pp = (x, d = 2) => x.toFixed(d).replace('.', ',') + '%';
const MONTHS = ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'];

/* ---------- Khung pháp lý mặc định (theo mô hình Việt Nam) ---------- */
const REG = {
  carMin: 8.0,          // Thông tư 41/2016: CAR ≥ 8% (Basel II)
  ldrMax: 85,           // Thông tư 22/2019: dư nợ/tiền gửi ≤ 85%
  mltMax: 30,           // TT08/2020 sửa TT22: vốn ngắn hạn cho vay trung dài hạn ≤ 30% (từ 10/2023)
  liqReserveMin: 10,    // TT22: tỷ lệ dự trữ thanh khoản ≥ 10%
  rrrShort: 3.0,        // Dự trữ bắt buộc VND: không kỳ hạn & <12 tháng 3%
  rrrLong: 1.0,         // ≥12 tháng 1%
  depCap6m: 4.75,       // Trần lãi suất huy động VND < 6 tháng
  priorityCap: 4.0,     // Trần lãi suất cho vay ngắn hạn 5 lĩnh vực ưu tiên
  nplTarget: 3.0,       // Ngưỡng nợ xấu NHNN theo dõi
  genProv: 0.75,        // Dự phòng chung 0,75% dư nợ nhóm 1–4 (TT11/2021)
  provRates: { w: 0.05, g3: 0.20, g4: 0.50, g5: 1.00 }, // dự phòng cụ thể nhóm 2–5
  bigCustomerCap: 14,   // Luật TCTD 2024: giới hạn cấp tín dụng 1 khách hàng (% vốn tự có), giảm dần về 10%
};

/* ---------- Phân khúc cho vay (4 nhóm, giữ đơn giản) ----------
   spread: phụ trội lãi suất so với lãi cơ sở; rw: hệ số rủi ro (TT41);
   pd: xác suất nhóm 1 → nhóm 2 mỗi tháng; mlt: tỷ trọng trung dài hạn; coll: tỷ lệ khấu trừ tài sản bảo đảm */
const SECTORS = [
  { id: 'corp', name: 'Sản xuất – kinh doanh', spread: 1.5, rw: 1.00, pd: 0.0028, mlt: 0.35, coll: 0.35, reSens: 0.0, fxSens: 0.8 },
  { id: 're',   name: 'BĐS & vay mua nhà',     spread: 2.5, rw: 1.20, pd: 0.0025, mlt: 0.85, coll: 0.50, reSens: 0.8, fxSens: 0.0 },
  { id: 'cons', name: 'Tiêu dùng',             spread: 5.0, rw: 1.50, pd: 0.0100, mlt: 0.40, coll: 0.05, reSens: 0.1, fxSens: 0.2 },
  { id: 'agri', name: 'Nông nghiệp – ưu tiên', spread: 0.5, rw: 0.80, pd: 0.0033, mlt: 0.30, coll: 0.25, reSens: 0.0, fxSens: 0.3, capped: true },
];
const APPETITE = [ // khẩu vị rủi ro 1..5
  { pd: 0.70, dem: 0.70, spread: 0.0, name: 'Rất thận trọng' },
  { pd: 0.85, dem: 0.85, spread: 0.2, name: 'Thận trọng' },
  { pd: 1.00, dem: 1.00, spread: 0.5, name: 'Cân bằng' },
  { pd: 1.35, dem: 1.20, spread: 1.0, name: 'Tích cực' },
  { pd: 1.80, dem: 1.45, spread: 1.6, name: 'Mạo hiểm' },
];

/* ---------- Hai loại hình ngân hàng ---------- */
const TYPES = {
  sob: { name: 'NHTM Nhà nước (SOB)', short: 'SOB', brand: 2, opex: 1.35, appetite: 2, digital: 1, divRate: 30, carTarget: 9.5, lendAdj: -0.6, depAdj: -0.3,
         desc: 'Nhà nước nắm chi phối. CASA ổn định, chi phí vốn thấp, nhiều dư nợ ưu tiên bị trần lãi suất. CAR mỏng vì tăng vốn phải xin Chính phủ.' },
  jsb: { name: 'NHTM cổ phần (JSB)',  short: 'JSB', brand: 1, opex: 1.60, appetite: 3, digital: 2, divRate: 10, carTarget: 10.5, lendAdj: 0.4, depAdj: 0.3,
         desc: 'Vốn dày hơn, biên lãi cao hơn, thiên về BĐS và tiêu dùng. Nhạy với chu kỳ BĐS và tỷ lệ vốn ngắn hạn cho vay trung dài hạn.' },
};
/* ---------- 9 chủ thể: 4 SOB + 5 JSB (số liệu mô phỏng, tỷ VND) ---------- */
const BANKS = [
  { id: 'sob1', type: 'sob', name: 'NH Ngoại Thương',         assets: 1900000, eqRatio: 0.095, casa: 0.34, loanRatio: 0.72, gbond: 0.09, npl: 0.010, mix: { corp: 0.55, re: 0.20, cons: 0.05, agri: 0.20 } },
  { id: 'sob2', type: 'sob', name: 'NH Đầu Tư Phát Triển',    assets: 2600000, eqRatio: 0.068, casa: 0.19, loanRatio: 0.78, gbond: 0.07, npl: 0.015, mix: { corp: 0.50, re: 0.22, cons: 0.06, agri: 0.22 } },
  { id: 'sob3', type: 'sob', name: 'NH Công Thương',          assets: 2200000, eqRatio: 0.070, casa: 0.22, loanRatio: 0.77, gbond: 0.07, npl: 0.014, mix: { corp: 0.52, re: 0.20, cons: 0.06, agri: 0.22 } },
  { id: 'sob4', type: 'sob', name: 'NH Nông Nghiệp',          assets: 2100000, eqRatio: 0.066, casa: 0.14, loanRatio: 0.76, gbond: 0.08, npl: 0.018, mix: { corp: 0.30, re: 0.12, cons: 0.08, agri: 0.50 } },
  { id: 'jsb1', type: 'jsb', name: 'NH Kỹ Thương',            assets: 980000,  eqRatio: 0.150, casa: 0.38, loanRatio: 0.66, gbond: 0.06, npl: 0.013, mix: { corp: 0.30, re: 0.55, cons: 0.10, agri: 0.05 } },
  { id: 'jsb2', type: 'jsb', name: 'NH Quân Đội',             assets: 1100000, eqRatio: 0.105, casa: 0.36, loanRatio: 0.70, gbond: 0.08, npl: 0.016, mix: { corp: 0.45, re: 0.30, cons: 0.15, agri: 0.10 } },
  { id: 'jsb3', type: 'jsb', name: 'NH Thịnh Vượng',          assets: 920000,  eqRatio: 0.150, casa: 0.16, loanRatio: 0.72, gbond: 0.05, npl: 0.045, mix: { corp: 0.30, re: 0.35, cons: 0.30, agri: 0.05 } },
  { id: 'jsb4', type: 'jsb', name: 'NH Á Châu',               assets: 860000,  eqRatio: 0.090, casa: 0.22, loanRatio: 0.70, gbond: 0.08, npl: 0.012, mix: { corp: 0.45, re: 0.35, cons: 0.12, agri: 0.08 } },
  { id: 'jsb5', type: 'jsb', name: 'NH Sài Gòn Thương Tín',   assets: 750000,  eqRatio: 0.078, casa: 0.18, loanRatio: 0.70, gbond: 0.06, npl: 0.024, mix: { corp: 0.40, re: 0.30, cons: 0.18, agri: 0.12 } },
];

/* =====================================================================
   Lớp Bank
   ===================================================================== */
class Bank {
  constructor(spec, isPlayer) {
    const T = TYPES[spec.type];
    this.id = spec.id; this.type = spec.type; this.name = spec.name; this.isPlayer = isPlayer;
    this.brand = T.brand; this.opexRate = T.opex;
    this.concentrated = 0; // dư nợ tập trung vào 1 khách hàng BĐS (sự kiện)
    this.vamc = 0;         // trái phiếu đặc biệt VAMC
    const TA = spec.assets;
    const loans = TA * spec.loanRatio;
    // Sổ cho vay: mỗi phân khúc có 5 nhóm nợ (nhóm 1 = perf, nhóm 2 = w, nhóm 3–5)
    this.book = {};
    for (const s of SECTORS) {
      const tot = loans * spec.mix[s.id];
      const bad = tot * spec.npl * (s.id === 're' || s.id === 'cons' ? 1.4 : 0.8);
      this.book[s.id] = { perf: tot - bad - tot * 0.012, w: tot * 0.012, g3: bad * 0.4, g4: bad * 0.3, g5: bad * 0.3 };
    }
    this.gbonds = TA * spec.gbond;
    this.fixed = TA * 0.015;
    this.ibLend = TA * 0.04;
    this.equity = { charter: TA * spec.eqRatio * 0.75, retained: TA * spec.eqRatio * 0.25 };
    const dep = TA * (1 - spec.eqRatio) * (spec.type === 'jsb' ? 0.83 : 0.87);
    this.dep = { casa: dep * spec.casa, lt6: dep * (1 - spec.casa) * 0.45, m6_12: dep * (1 - spec.casa) * 0.30, gt12: dep * (1 - spec.casa) * 0.25 };
    this.bonds = TA * (spec.type === 'jsb' ? 0.08 : 0.03);   // giấy tờ có giá ≥12 tháng
    this.subBonds = TA * (spec.type === 'jsb' ? 0.02 : 0.01); // trái phiếu thứ cấp (vốn cấp 2)
    this.ibBorrow = TA * 0.02;
    this.refi = 0;
    this.prov = this.requiredProvision();
    this.reserve = this.requiredReserve(REG.rrrShort, REG.rrrLong);
    // Tiền mặt là số dư cân đối
    this.cash = 0;
    this.cash = this.totalLiab() + this.totalEquity() - this.totalAssets();
    if (this.cash < TA * 0.01) { // đảm bảo có tiền mặt tối thiểu bằng cách giảm cho vay liên ngân hàng
      const need = TA * 0.02 - this.cash; this.ibLend -= need; this.cash += need;
    }
    // Chính sách điều hành
    this.pol = {
      rCasa: 0.3, rLt6: 4.5 + T.depAdj * 0.5, rM6_12: 5.2 + T.depAdj, rGt12: 5.8 + T.depAdj,
      lendShort: 9.0 + T.lendAdj, lendMLT: 10.5 + T.lendAdj,
      growthTarget: 14, mix: { ...spec.mix }, appetite: T.appetite,
      digital: T.digital, network: 1, gbondTarget: spec.gbond * 100, cashBuffer: 3.0,
      carTarget: T.carTarget, divRate: T.divRate,
      anchor: true, spread: { rLt6: 0, rM6_12: 0, rGt12: 0, lendShort: 0, lendMLT: 0 }, // neo theo thị trường, giữ chênh lệch
    };
    this.mech = null; // bản ghi cơ chế cho vay & dự trữ của tháng gần nhất
    // trạng thái
    this.loansAtYearStart = this.grossLoans();
    this.room = 14; this.roomBreachMonths = 0;
    this.carBreach = 0; this.liqFail = 0; this.dead = false; this.deadReason = '';
    this.capitalRaisedThisYear = false;
    this.reputation = 0; // <0 = bị nghi ngờ (rút tiền)
    this.hist = []; this.log = [];
    this.pnlYTD = this.emptyPnl(); this.lastPnl = this.emptyPnl();
    this.fine = 0; this.score = 0;
  }
  applyAnchor(mkt, sbv) { // lãi suất = thị trường + chênh lệch người chơi đặt
    const p = this.pol, sp = p.spread;
    p.rLt6 = Math.min(sbv.depCap6m, Math.max(0.5, mkt.lt6 + sp.rLt6)); p.rM6_12 = Math.max(0.5, mkt.m6_12 + sp.rM6_12); p.rGt12 = Math.max(0.5, mkt.gt12 + sp.rGt12);
    p.lendShort = Math.max(1, mkt.lend - 1.0 + sp.lendShort); p.lendMLT = Math.max(1, mkt.lend + 0.5 + sp.lendMLT);
  }
  emptyPnl() { return { ii: 0, ie: 0, fee: 0, opex: 0, prov: 0, tax: 0, net: 0, other: 0 }; }
  /* --- tổng hợp --- */
  sectorTotal(id) { const b = this.book[id]; return b.perf + b.w + b.g3 + b.g4 + b.g5; }
  grossLoans() { return SECTORS.reduce((a, s) => a + this.sectorTotal(s.id), 0) + this.concentrated; }
  perfLoans() { return SECTORS.reduce((a, s) => a + this.book[s.id].perf + this.book[s.id].w, 0) + this.concentrated; }
  nplAmount() { return SECTORS.reduce((a, s) => a + this.book[s.id].g3 + this.book[s.id].g4 + this.book[s.id].g5, 0); }
  nplRatio() { const g = this.grossLoans(); return g > 0 ? this.nplAmount() / g : 0; }
  mltLoans() { return SECTORS.reduce((a, s) => a + this.sectorTotal(s.id) * s.mlt, 0) + this.concentrated * 0.7; }
  deposits() { return this.dep.casa + this.dep.lt6 + this.dep.m6_12 + this.dep.gt12; }
  totalAssets() { return this.cash + this.reserve + this.ibLend + this.gbonds + this.grossLoans() - this.prov + this.fixed + this.vamc; }
  totalLiab() { return this.deposits() + this.bonds + this.subBonds + this.ibBorrow + this.refi; }
  totalEquity() { return this.equity.charter + this.equity.retained; }
  requiredReserve(rS, rL) { return (this.dep.casa + this.dep.lt6 + this.dep.m6_12) * rS / 100 + this.dep.gt12 * rL / 100; }
  requiredProvision() {
    let spec = 0, gen = 0;
    for (const s of SECTORS) {
      const b = this.book[s.id]; const c = 1 - s.coll; // phần không được khấu trừ tài sản bảo đảm
      spec += (b.w * REG.provRates.w + b.g3 * REG.provRates.g3 + b.g4 * REG.provRates.g4 + b.g5 * REG.provRates.g5) * c;
      gen += (b.perf + b.w + b.g3 + b.g4) * REG.genProv / 100;
    }
    gen += this.concentrated * REG.genProv / 100;
    return spec + gen;
  }
  genProvision() { return (this.perfLoans() + SECTORS.reduce((a, s) => a + this.book[s.id].g3 + this.book[s.id].g4, 0)) * REG.genProv / 100; }
  rwa() {
    let credit = 0;
    for (const s of SECTORS) credit += this.sectorTotal(s.id) * s.rw;
    credit += this.concentrated * 2.0 + this.ibLend * 0.2 + this.fixed * 1.0 + this.vamc * 0.2;
    return credit * 1.10; // + rủi ro hoạt động & thị trường (xấp xỉ 10%)
  }
  tier1() { return this.equity.charter + this.equity.retained; }
  tier2() { return Math.min(this.subBonds, this.tier1() * 0.5) + Math.min(this.genProvision(), this.rwa() * 0.0125); }
  car() { const r = this.rwa(); return r > 0 ? (this.tier1() + this.tier2()) / r * 100 : 0; }
  ldr() { const d = this.deposits() + this.bonds; return d > 0 ? this.grossLoans() / d * 100 : 0; }
  mltRatio() {
    const mltSrc = this.dep.gt12 + this.bonds + this.subBonds + this.totalEquity() - this.fixed;
    const stSrc = this.dep.casa + this.dep.lt6 + this.dep.m6_12 + this.ibBorrow + this.refi;
    return stSrc > 0 ? Math.max(0, this.mltLoans() - mltSrc) / stSrc * 100 : 0;
  }
  liqReserve() { const L = this.totalLiab(); return L > 0 ? (this.cash + this.reserve + this.gbonds + this.ibLend) / L * 100 : 0; }
  creditGrowthYTD() { return this.loansAtYearStart > 0 ? (this.grossLoans() / this.loansAtYearStart - 1) * 100 : 0; }
  costOfFunds() {
    const p = this.pol; const d = this.dep;
    const tot = this.deposits() + this.bonds + this.subBonds + this.ibBorrow + this.refi;
    return tot > 0 ? (d.casa * p.rCasa + d.lt6 * p.rLt6 + d.m6_12 * p.rM6_12 + d.gt12 * p.rGt12 + this.bonds * this.bondRate + this.subBonds * (this.bondRate + 1.5) + this.ibBorrow * this.ibRate + this.refi * this.refiRate) / tot : 0;
  }
  sectorRate(s, mkt) {
    const p = this.pol; const ap = APPETITE[p.appetite - 1];
    let r = (p.lendShort * (1 - s.mlt) + p.lendMLT * s.mlt) + s.spread + ap.spread;
    if (s.capped) r = Math.min(p.lendShort, mkt.priorityCap) * (1 - s.mlt) + (p.lendMLT + s.spread) * s.mlt; // trần LS ưu tiên cho phần ngắn hạn
    return r;
  }
  healthSpread() { // phụ trội lãi suất liên ngân hàng khi ngân hàng yếu
    let sp = 0; const car = this.car(), npl = this.nplRatio() * 100;
    if (car < 9) sp += 1.0; if (car < 8) sp += 1.5;
    if (npl > 3) sp += 0.5; if (npl > 5) sp += 1.5;
    if (this.reputation < 0) sp += -this.reputation;
    return sp;
  }
  addLog(m, msg, cls) { this.log.unshift({ m, msg, cls }); if (this.log.length > 400) this.log.pop(); }

  /* ---------------- bước 1 tháng ---------------- */
  step(W) {
    if (this.dead) return;
    const M = W.macro, mkt = W.market, sbv = W.sbv, p = this.pol, ap = APPETITE[p.appetite - 1];
    const pnl = this.emptyPnl();
    const binds = [];
    this.bondRate = this.bondRate ?? (mkt.gt12 + 1.0);
    this.ibRate = mkt.ibON + this.healthSpread();
    this.refiRate = sbv.refi;
    const monthIdx = W.month;
    if (this.isPlayer && p.anchor) this.applyAnchor(mkt, sbv);

    /* 1. Thu nhập lãi & chi phí lãi */
    let ii = 0;
    for (const s of SECTORS) {
      const b = this.book[s.id]; const r = this.sectorRate(s, mkt) / 1200;
      ii += (b.perf + b.w) * r; // nhóm 3–5 không dự thu lãi
    }
    ii += this.concentrated * 12 / 1200;
    ii += this.gbonds * mkt.gbondYield / 1200 + this.ibLend * mkt.ibON / 1200 + this.reserve * 0.5 / 1200;
    const ie = (this.dep.casa * p.rCasa + this.dep.lt6 * p.rLt6 + this.dep.m6_12 * p.rM6_12 + this.dep.gt12 * p.rGt12) / 1200
      + this.bonds * this.bondRate / 1200 + this.subBonds * (this.bondRate + 1.5) / 1200 + this.ibBorrow * this.ibRate / 1200 + this.refi * this.refiRate / 1200
      + this.vamc * 0; // trái phiếu VAMC lãi 0
    const TA = this.totalAssets();
    const fee = TA * (0.45 + 0.18 * p.digital + 0.05 * this.brand) / 1200;
    const opex = TA * (this.opexRate + 0.12 * p.digital + 0.10 * p.network) / 1200 + this.fixed * 0.02 / 12;
    pnl.ii = ii; pnl.ie = ie; pnl.fee = fee; pnl.opex = opex;
    this.cash += ii - ie + fee - opex;

    /* 2. Sổ cho vay: thu nợ, chuyển nhóm, xử lý nợ xấu */
    let runoffTotal = 0;
    const stress = W.stressFor(this); // hệ số vĩ mô (BĐS, tỷ giá, lãi suất)
    let writeoff = 0, recovery = 0;
    for (const s of SECTORS) {
      const b = this.book[s.id];
      const runoff = b.perf * ((1 - s.mlt) / 9 + s.mlt / 60);
      b.perf -= runoff; runoffTotal += runoff;
      // chuyển nhóm
      let pdm = s.pd * ap.pd * stress.pd * (1 + s.reSens * stress.re + s.fxSens * stress.fx);
      pdm *= 1 + 0.06 * Math.max(0, this.sectorRate(s, mkt) - 9); // lãi cao → khách trả kém
      if (s.id === 'agri') pdm *= 1 + stress.agri; if (s.id === 'corp') pdm *= 1 + stress.sme * 0.5;
      if (sbv.forbearance) pdm *= 0.55; // Thông tư 02: cơ cấu nợ, giữ nguyên nhóm nợ
      const toW = b.perf * pdm;
      const wToG3 = b.w * 0.25 * (sbv.forbearance ? 0.5 : 1), wCure = b.w * 0.20;
      const g3To4 = b.g3 * 0.30, g3Cure = b.g3 * 0.10;
      const g4To5 = b.g4 * 0.30, g4Rec = b.g4 * 0.05;
      const g5Wo = b.g5 * 0.15;
      b.perf += -toW + wCure + g3Cure; b.w += toW - wToG3 - wCure;
      b.g3 += wToG3 - g3To4 - g3Cure; b.g4 += g3To4 - g4To5 - g4Rec; b.g5 += g4To5 - g5Wo;
      const rec = g5Wo * s.coll * 0.8; // thu hồi từ tài sản bảo đảm sau khi xóa nợ (thu nhập khác)
      recovery += rec; writeoff += g5Wo;
      this.cash += rec + g4Rec; // g4Rec là khách trả nợ gốc, không phải thu nhập
    }
    this.cash += runoffTotal;
    // VAMC: thu hồi dần 5%/tháng, trích lập 20%/năm theo quy định
    if (this.vamc > 0) { const rec = this.vamc * 0.05; this.vamc -= rec; this.cash += rec; const vprov = this.vamc * 0.20 / 12; pnl.prov += vprov; this.vamc -= vprov; } // trích lập VAMC: vào chi phí dự phòng, trừ vốn ở bước 9
    // dự phòng: xóa nợ dùng dự phòng, rồi trích thêm cho đủ
    this.prov -= writeoff; // xóa nợ nhóm 5 (phần thu hồi đã ghi nhận vào tiền)
    // phần thu hồi vượt dự phòng đã dùng ghi nhận vào thu nhập khác
    pnl.other = recovery;
    const reqProv = this.requiredProvision();
    const provExp = Math.max(reqProv - this.prov, -this.prov * 0.1); // hoàn nhập tối đa 10%/tháng
    this.prov += provExp; pnl.prov += provExp;

    /* 3. Huy động */
    const depStress = Math.max(0, this.nplRatio() * 100 - 4) * 1.5 + (this.car() < 8 ? 6 : 0) + Math.max(0, -this.reputation) * 6 + stress.dep;
    const baseG = mkt.depGrowth + 1.5 * p.network + 1.5 * this.brand;
    const gCasa = (5 + 5 * p.digital + 2 * this.brand - 1.5 * (mkt.m6_12 - 5.0) + 0.3 * mkt.depGrowth - depStress * 1.5) / 1200;
    const gLt6 = (baseG + 5 * (Math.min(p.rLt6, sbv.depCap6m) - mkt.lt6) - depStress) / 1200;
    const gM = (baseG + 5 * (p.rM6_12 - mkt.m6_12) - depStress) / 1200;
    const gG = (baseG + 5 * (p.rGt12 - mkt.gt12) - depStress) / 1200;
    const d0 = this.deposits();
    this.dep.casa *= 1 + clamp(gCasa, -0.25, 0.04);
    this.dep.lt6 *= 1 + clamp(gLt6, -0.25, 0.025);
    this.dep.m6_12 *= 1 + clamp(gM, -0.25, 0.025);
    this.dep.gt12 *= 1 + clamp(gG, -0.25, 0.025);
    this.cash += this.deposits() - d0;
    if (p.rLt6 > sbv.depCap6m + 1e-9) { const f = TA * 0.0002; this.cash -= f; this.equity.retained -= f; pnl.other -= f; this.addLog(monthIdx, `Vượt trần lãi suất huy động <6 tháng (${pp(sbv.depCap6m)}): NHNN xử phạt ${fmt0(f)} tỷ.`, 'bad'); }

    /* 4. Giấy tờ có giá đáo hạn */
    const bMat = this.bonds / 36; this.bonds -= bMat; this.cash -= bMat;
    const sMat = this.subBonds / 60; this.subBonds -= sMat; this.cash -= sMat;
    // cập nhật lãi suất phát hành (trung bình dần về thị trường)
    this.bondRate = this.bondRate * 0.97 + (mkt.gt12 + 1.0 + this.healthSpread() * 0.5) * 0.03;

    /* 5. Giải ngân mới */
    const perfTot = this.perfLoans();
    const demand = {}; let demTot = 0;
    for (const s of SECTORS) {
      const b = this.book[s.id];
      const rate = this.sectorRate(s, mkt); const mktRate = mkt.lend + s.spread + APPETITE[2].spread; // tham chiếu = thị trường + khẩu vị cân bằng
      const runoff = (b.perf) * ((1 - s.mlt) / 9 + s.mlt / 60);
      // Cầu vay = thay thế nợ đến hạn + nhu cầu tăng thêm; lãi cao hơn thị trường 1 điểm % → cầu giảm ~17%
      const E = Math.exp(-0.18 * (rate - mktRate)) * stress.demand;
      let d = runoff * E + this.sectorTotal(s.id) * mkt.creditDemand * (14 + (s.id === 're' ? 6 * stress.reHeat : 0)) / 1200 * E * ap.dem;
      demand[s.id] = Math.max(0, d); demTot += demand[s.id];
    }
    const mixSum = sum(Object.values(p.mix)) || 1;
    const target = perfTot * Math.max(0, p.growthTarget) / 1200 + runoffTotal;
    // Phân bổ 2 vòng: vòng 1 theo tỷ trọng mục tiêu, vòng 2 dồn phần chưa dùng sang ngành còn cầu
    let disb = {}; let disbTot = 0; let unused = 0;
    for (const s of SECTORS) { const slot = target * (p.mix[s.id] / mixSum); disb[s.id] = Math.min(demand[s.id], slot); unused += slot - disb[s.id]; disbTot += disb[s.id]; }
    if (unused > 0) { let rem = SECTORS.reduce((a, s) => a + Math.max(0, demand[s.id] - disb[s.id]), 0); if (rem > 0) { const f0 = Math.min(1, unused / rem); for (const s of SECTORS) { const add = Math.max(0, demand[s.id] - disb[s.id]) * f0; disb[s.id] += add; disbTot += add; } } }
    if (disbTot < target * 0.98) binds.push('cầu tín dụng');
    // Ràng buộc
    const gross = this.grossLoans();
    const caps = [];
    if (sbv.roomOn) { const roomLeft = this.loansAtYearStart * (1 + this.room / 100) - gross; caps.push({ n: 'room tín dụng', v: Math.max(0, roomLeft) + 0 }); }
    const rwaHead = (this.tier1() + this.tier2()) / (Math.max(p.carTarget, sbv.carMin) / 100) - this.rwa();
    const avgRw = SECTORS.reduce((a, s) => a + s.rw * (p.mix[s.id] / mixSum), 0) * 1.10;
    caps.push({ n: 'CAR mục tiêu', v: Math.max(0, rwaHead / avgRw) });
    caps.push({ n: 'LDR ' + sbv.ldrMax + '%', v: Math.max(0, sbv.ldrMax / 100 * (this.deposits() + this.bonds) - gross) });
    const reqRes = this.requiredReserve(sbv.rrrShort, sbv.rrrLong);
    const ibLimit = this.deposits() * (0.20 - Math.min(0.15, this.healthSpread() * 0.03));
    const liquidityAvail = this.cash + this.ibLend + Math.max(0, ibLimit - this.ibBorrow) + Math.max(0, this.gbonds * 0.9 - this.refi) - (reqRes - this.reserve) - this.deposits() * p.cashBuffer / 100;
    caps.push({ n: 'thanh khoản', v: Math.max(0, liquidityAvail) });
    let cap = Infinity, capName = '';
    for (const c of caps) if (c.v < cap) { cap = c.v; capName = c.n; }
    let f = 1;
    if (disbTot > cap) { f = cap / disbTot; binds.push(capName); }
    // trần vốn ngắn hạn cho vay TDH
    const mltSrc = this.dep.gt12 + this.bonds + this.subBonds + this.totalEquity() - this.fixed;
    const stSrc = this.dep.casa + this.dep.lt6 + this.dep.m6_12 + this.ibBorrow + this.refi;
    const mltNewCap = Math.max(0, mltSrc + stSrc * sbv.mltMax / 100 - this.mltLoans());
    let mltNew = SECTORS.reduce((a, s) => a + disb[s.id] * f * s.mlt, 0);
    let fm = 1; if (mltNew > mltNewCap) { fm = mltNewCap / mltNew; binds.push('vốn NH cho vay TDH ' + sbv.mltMax + '%'); }
    let newLoans = 0;
    for (const s of SECTORS) { const x = disb[s.id] * f * (s.mlt > 0.5 ? fm : 1); this.book[s.id].perf += x; newLoans += x; }
    this.cash -= newLoans;
    this.lastDisb = newLoans; this.lastDemand = demTot; this.lastTarget = target; this.binds = binds;
    // Bản ghi cơ chế cho vay & dự trữ (hiển thị ở tab Tổng quan)
    this.mech = { depStart: d0, depEnd: this.deposits(), reqRes, resHeld: this.reserve, cashBefore: this.cash + newLoans, buffer: this.deposits() * p.cashBuffer / 100,
      runoff: runoffTotal, demand: demTot, target, caps: caps.map(c => ({ n: c.n, v: c.v })), cap, capName, disb: newLoans, mltCap: mltNewCap, mltNew, writeoff, recovery, provExp, ibLimit };

    /* 6. Trái phiếu Chính phủ theo tỷ trọng mục tiêu */
    const gbTarget = this.totalAssets() * p.gbondTarget / 100;
    let dG = clamp(gbTarget - this.gbonds, -this.gbonds * 0.2, this.cash * 0.5);
    if (dG > 0 && this.cash - dG < reqRes - this.reserve + this.deposits() * p.cashBuffer / 100) dG = 0;
    this.gbonds += dG; this.cash -= dG;

    /* 7. Dự trữ bắt buộc */
    const dR = reqRes - this.reserve; this.reserve = reqRes; this.cash -= dR;

    /* 8. Liên ngân hàng & tái cấp vốn: đóng vị thế cũ, mở vị thế mới */
    this.cash += this.ibLend - this.ibBorrow - this.refi; this.ibLend = 0; this.ibBorrow = 0; this.refi = 0;
    const buffer = this.deposits() * p.cashBuffer / 100;
    if (this.cash < buffer) {
      let need = buffer - this.cash;
      const ib = Math.min(need, Math.max(0, ibLimit) * (W.ibFrozen ? 0.3 : 1)); this.ibBorrow = ib; this.cash += ib; need -= ib;
      if (need > 0) { const rf = Math.min(need, this.gbonds * 0.9); this.refi = rf; this.cash += rf; need -= rf; }
      if (need > 0 && this.cash < 0) { // bán TPCP lỗ, sau đó là mất thanh khoản
        const sell = Math.min(this.gbonds - this.refi / 0.9, -this.cash * 1.03);
        if (sell > 0) { this.gbonds -= sell; this.cash += sell * 0.97; const loss = sell * 0.03; this.equity.retained -= loss; pnl.other -= loss; this.addLog(monthIdx, `Bán ${fmt0(sell)} tỷ TPCP với giá thấp để bù thanh khoản (lỗ ${fmt0(loss)} tỷ).`, 'warn'); }
      }
      if (this.cash < 0) { this.liqFail++; this.reputation -= 1; this.addLog(monthIdx, `MẤT THANH KHOẢN: thiếu ${fmt0(-this.cash)} tỷ, không vay được liên ngân hàng. Khách hàng bắt đầu rút tiền.`, 'bad'); this.ibBorrow += -this.cash; this.cash = 0; }
      else this.liqFail = 0;
    } else { this.ibLend = this.cash - buffer; this.cash = buffer; this.liqFail = 0; }
    if (this.mech) Object.assign(this.mech, { ibBorrow: this.ibBorrow, refi: this.refi, ibLend: this.ibLend, cashEnd: this.cash, ibRate: this.ibRate });

    /* 9. Thuế, lợi nhuận */
    const pbt = pnl.ii - pnl.ie + pnl.fee - pnl.opex - pnl.prov + pnl.other;
    pnl.tax = Math.max(0, pbt * 0.20); pnl.net = pbt - pnl.tax;
    this.cash -= pnl.tax; this.equity.retained += pnl.ii - pnl.ie + pnl.fee - pnl.opex - pnl.prov + recovery - pnl.tax;
    // pnl.other đã gồm phạt/lỗ đã trừ trực tiếp vào retained ở trên → tránh trừ 2 lần
    this.lastPnl = pnl;
    for (const k in pnl) this.pnlYTD[k] += pnl[k];

    /* 10. Uy tín hồi phục dần */
    this.reputation = Math.min(0, this.reputation + 0.25);
    if (this.nplRatio() < 0.03 && this.car() > 9) this.reputation = Math.min(0, this.reputation + 0.25);

    /* 11. Kiểm tra tuân thủ */
    const car = this.car();
    if (car < sbv.carMin) { this.carBreach++; if (this.carBreach === 1) this.addLog(monthIdx, `CAR ${pp(car)} thấp hơn mức tối thiểu ${pp(sbv.carMin)}. NHNN yêu cầu phương án tăng vốn.`, 'bad'); }
    else this.carBreach = 0;
    if (this.ldr() > sbv.ldrMax + 0.01) this.addLog(monthIdx, `LDR ${pp(this.ldr())} vượt trần ${sbv.ldrMax}%: phải huy động thêm hoặc hãm cho vay.`, 'warn');
    if (this.mltRatio() > sbv.mltMax + 0.01) this.addLog(monthIdx, `Vốn ngắn hạn cho vay trung dài hạn ${pp(this.mltRatio())} vượt ${sbv.mltMax}%.`, 'warn');
    if (sbv.roomOn && this.creditGrowthYTD() > this.room + 0.05) { this.roomBreachMonths++; if (this.roomBreachMonths === 1) this.addLog(monthIdx, `Tăng trưởng tín dụng ${pp(this.creditGrowthYTD())} vượt room ${this.room}%.`, 'bad'); }
    if (this.liqFail >= 2 || car < 4 || this.carBreach >= 12) {
      this.dead = true; this.deadReason = this.liqFail >= 2 ? 'mất khả năng thanh toán kéo dài' : car < 4 ? 'âm vốn (CAR < 4%)' : 'CAR dưới mức tối thiểu 12 tháng liên tục';
      this.addLog(monthIdx, `NHNN đặt ngân hàng vào diện KIỂM SOÁT ĐẶC BIỆT do ${this.deadReason}.`, 'bad');
    }
    /* 12. lịch sử */
    this.hist.push({ m: monthIdx, TA: this.totalAssets(), car, ldr: this.ldr(), mlt: this.mltRatio(), npl: this.nplRatio() * 100, liq: this.liqReserve(),
      nim: (pnl.ii - pnl.ie) * 12 / Math.max(1, this.totalAssets()) * 100, roe: pnl.net * 12 / Math.max(1, this.totalEquity()) * 100,
      dep: { ...this.dep }, bonds: this.bonds + this.subBonds, ib: this.ibBorrow + this.refi, eq: this.totalEquity(), loans: this.grossLoans(), net: pnl.net, cof: this.costOfFunds(), growth: this.creditGrowthYTD() });
    if (this.hist.length > 240) this.hist.shift();
  }

  yearEnd(W) {
    const yearNet = this.pnlYTD.net;
    if (yearNet > 0 && this.pol.divRate > 0) {
      if (this.car() < 9 || this.nplRatio() > 0.03) this.addLog(W.month, 'NHNN không chấp thuận chia cổ tức tiền mặt (CAR < 9% hoặc nợ xấu > 3%).', 'warn');
      else { const d = yearNet * this.pol.divRate / 100; this.cash -= d; this.equity.retained -= d; this.addLog(W.month, `Chia cổ tức tiền mặt ${fmt0(d)} tỷ (${this.pol.divRate}% lợi nhuận).`, 'good'); }
    }
    this.score += Math.round(yearNet / Math.max(1, this.totalEquity()) * 100);
    this.pnlYTD = this.emptyPnl();
    this.loansAtYearStart = this.grossLoans();
    this.capitalRaisedThisYear = false;
    if (this.roomBreachMonths > 0) { this.addLog(W.month, `Bị NHNN cắt room năm sau vì vượt room tín dụng.`, 'bad'); this.roomPenalty = true; }
    this.roomBreachMonths = 0;
  }

  /* ---- hành động chủ động ---- */
  issueBonds(amount, sub, W) {
    if (amount <= 0) return 'Số tiền không hợp lệ.';
    if (this.car() < 8 && !sub) return 'Nhà đầu tư từ chối mua vì CAR dưới 8%.';
    const max = this.totalAssets() * 0.05;
    if (amount > max) return `Thị trường chỉ hấp thụ tối đa ${fmt0(max)} tỷ/tháng (5% tổng tài sản).`;
    if (sub) { if (this.subBonds + amount > this.tier1() * 0.5) return 'Vốn cấp 2 chỉ được tính tối đa 50% vốn cấp 1.'; this.subBonds += amount; }
    else this.bonds += amount;
    const fee = amount * 0.005; this.cash += amount - fee; this.equity.retained -= fee; this.pnlYTD.other -= fee;
    this.bondRate = (this.bondRate ?? (W.market.gt12 + 1)) * 0.8 + (W.market.gt12 + (sub ? 2.0 : 1.0) + this.healthSpread() * 0.5) * 0.2;
    this.addLog(W.month, `Phát hành ${fmt0(amount)} tỷ ${sub ? 'trái phiếu thứ cấp (vốn cấp 2)' : 'giấy tờ có giá kỳ hạn 3 năm'}, lãi ~${pp(this.bondRate + (sub ? 1.5 : 0))}.`, 'good');
    return null;
  }
  raiseCapital(amount, W) {
    if (amount <= 0) return 'Số tiền không hợp lệ.';
    if (this.capitalRaisedThisYear) return 'Mỗi năm chỉ được tăng vốn một lần (cần ĐHĐCĐ và NHNN chấp thuận).';
    if (amount > this.equity.charter * 0.4) return 'Cổ đông chỉ chấp thuận tối đa 40% vốn điều lệ hiện tại.';
    const ok = Math.random() < (this.type === 'sob' ? 0.55 : 0.85) - (this.nplRatio() > 0.04 ? 0.25 : 0);
    this.capitalRaisedThisYear = true;
    if (!ok) { this.addLog(W.month, `Phương án tăng vốn ${fmt0(amount)} tỷ không được chấp thuận năm nay.`, 'bad'); return 'Không được chấp thuận. Thử lại năm sau.'; }
    const fee = amount * 0.02; this.equity.charter += amount; this.cash += amount - fee; this.equity.retained -= fee; this.pnlYTD.other -= fee;
    this.addLog(W.month, `Tăng vốn điều lệ thêm ${fmt0(amount)} tỷ (phí phát hành ${fmt0(fee)} tỷ).`, 'good');
    return null;
  }
  sellToVamc(W) {
    const npl = this.nplAmount(); if (npl < 1) return 'Không có nợ xấu để bán.';
    // Bán nợ nhóm 5 và 4 cho VAMC lấy trái phiếu đặc biệt, giá = dư nợ − dự phòng cụ thể đã trích
    let sold = 0, provUsed = 0;
    for (const s of SECTORS) { const b = this.book[s.id]; const c = 1 - s.coll; sold += b.g4 + b.g5; provUsed += (b.g4 * 0.5 + b.g5 * 1.0) * c; b.g4 = 0; b.g5 = 0; }
    this.prov -= provUsed; this.vamc += sold - provUsed;
    this.addLog(W.month, `Bán ${fmt0(sold)} tỷ nợ nhóm 4–5 cho VAMC, nhận trái phiếu đặc biệt ${fmt0(sold - provUsed)} tỷ (phải trích lập 20%/năm).`, 'warn');
    return null;
  }
}

  { id: 'casa', w: 1.5, cond: W => W.mode === 'bank' && W.player.pol.digital >= 2, title: 'Ứng dụng ngân hàng số được ưa chuộng', text: 'Chiến dịch chuyển đổi số hiệu quả, lượng khách mở tài khoản tăng mạnh. CASA tăng đột biến trong 6 tháng.',
    apply: W => { W.player.dep.casa *= 1.06; W.player.cash += W.player.dep.casa * 0.06 / 1.06; W.addShock({ name: 'CASA tăng', left: 6 }); } },
  { id: 'cyber', w: 1, cond: W => W.mode === 'bank', title: 'Sự cố an ninh mạng', text: 'Hệ thống ngân hàng bị gián đoạn 2 ngày, nhiều khách hàng bị lừa đảo. Uy tín giảm, phải chi phí khắc phục.',
    apply: W => { const f = W.player.totalAssets() * 0.0003; W.player.cash -= f; W.player.equity.retained -= f; W.player.pnlYTD.other -= f; W.player.reputation -= 0.5; } },
];

/* =====================================================================
   Thế giới: vĩ mô, NHNN, thị trường, các ngân hàng
   ===================================================================== */
class World {
  constructor(mode, playerId) {
    this.mode = mode; // 'bank' | 'sbv'
    this.month = 0; this.year = 2026; this.monthOfYear = 1;
    this.macro = { gdp: 6.8, cpi: 3.6, fedRate: 4.0, fx: 1.5, re: 0.9, reserves: 95, m2: 11 };
    this.sbv = { refi: 4.5, disc: 3.0, omo: 4.0, depCap6m: 4.75, rrrShort: 3.0, rrrLong: 1.0, ldrMax: 85, mltMax: 30, carMin: 8, roomOn: true, sysRoom: 15, forbearance: false, omoNet: 0, fxSell: 0 };
    this.market = {};
    this.shocks = []; this.log = []; this.eventQueue = [];
    this.forbearanceLeft = 0; this.lastPolicyMove = -12;
    // Hệ thống cố định: 4 SOB + 5 JSB. Ở chế độ ngân hàng, người chơi điều hành một trong 9.
    this.banks = BANKS.map(spec => new Bank(spec, mode === 'bank' && spec.id === playerId));
    this.player = mode === 'bank' ? this.banks.find(b => b.isPlayer) : null;
    this.playerId = playerId;
    this.assignRoom();
    this.updateMarket();
    for (const b of this.banks) { b.bondRate = this.market.gt12 + 1; this.initPolicy(b); }
    this.sysLoansYearStart = this.sysLoans();
    this.hist = [];
    this.ibFrozen = false;
    this.pendingEvent = null;
  }
  sysLoans() { return sum(this.banks.filter(b => !b.dead).map(b => b.grossLoans())); }
  sysDeposits() { return sum(this.banks.filter(b => !b.dead).map(b => b.deposits())); }
  sysNpl() { const g = this.sysLoans(); return g ? sum(this.banks.filter(b => !b.dead).map(b => b.nplAmount())) / g : 0; }
  sysCreditGrowth() { return (this.sysLoans() / this.sysLoansYearStart - 1) * 100; }
  shock(k) { return this.shocks.reduce((a, s) => a + (s[k] || 0), 0); }
  shockMul(k) { return this.shocks.reduce((a, s) => a * (s[k] ?? 1), 1); }
  addShock(s) { this.shocks.push(s); }
  addLog(msg, cls) { this.log.unshift({ m: this.month, msg, cls }); if (this.log.length > 300) this.log.pop(); }
  dateStr(m = this.month) { const y = 2026 + Math.floor(m / 12); return `${MONTHS[m % 12]}/${y}`; }

  assignRoom() {
    for (const b of this.banks) {
      let r = this.sbv.sysRoom;
      if (b.car() > 11) r += 1.5; if (b.car() < 9) r -= 2;
      if (b.nplRatio() > 0.03) r -= 2; if (b.nplRatio() < 0.015) r += 1;
      if (b.roomPenalty) { r -= 4; b.roomPenalty = false; }
      b.room = Math.max(0, Math.round(r * 2) / 2);
    }
  }
  updateMarket() {
    const M = this.macro, S = this.sbv;
    // độ căng thanh khoản hệ thống: LDR hệ thống, hút/bơm của NHNN, cú sốc
    const alive = this.banks.filter(b => !b.dead);
    const sysDep = this.sysDeposits(), sysLoan = this.sysLoans();
    const ldrSys = sysDep > 0 ? sysLoan / (sysDep + sum(alive.map(b => b.bonds))) : 0.8;
    const netBorrow = sum(alive.map(b => b.ibBorrow + b.refi - b.ibLend));
    let tight = (ldrSys - 0.82) * 15 + netBorrow / Math.max(1, sysDep) * 20 + this.shock('ib') - S.omoNet / Math.max(1, sysDep) * 100 + S.fxSell / Math.max(1, sysDep) * 60;
    tight = clamp(tight, -1.5, 4);
    this.tightness = tight;
    const ibON = Math.max(0.3, S.omo + 0.4 * tight + rnd(-0.2, 0.2));
    this.ibFrozen = tight > 3;
    const lt6 = Math.min(S.depCap6m, S.refi - 0.3 + 0.3 * tight);
    const m6_12 = S.refi + 0.6 + 0.35 * tight;
    const gt12 = S.refi + 1.2 + 0.3 * tight;
    const lend = m6_12 + 3.2 + 0.2 * tight + Math.max(0, (this.sysNpl() * 100 - 2)) * 0.2;
    this.market = { ibON, lt6, m6_12, gt12, lend, gbondYield: S.refi - 1.2 + 0.2 * tight, depGrowth: M.m2 * 0.9,
      creditDemand: clamp(1 + 0.08 * (M.gdp - 6.5) - 0.12 * (lend - 9.5), 0.5, 1.6) * this.shockMul('demand'), priorityCap: REG.priorityCap };
  }
  stressFor(b) {
    const M = this.macro;
    const reCycle = M.re < 0.7 ? (0.7 - M.re) * 3 : 0; // BĐS đóng băng → nợ xấu BĐS
    return {
      pd: 1 + 0.1 * Math.max(0, this.sbv.refi - 4.5) + 0.08 * Math.max(0, 6.5 - M.gdp) + (b.type === 'jsb' ? 0.05 : 0) + this.shock('pdAll'),
      re: reCycle + this.shock('re'), reHeat: this.shock('reHeat') + (M.re > 1.2 ? 1 : 0),
      fx: Math.max(0, M.fx - 3) * 0.2 + this.shock('fx'), demand: 1,
      dep: this.shock('dep') * (b.type === 'jsb' ? 1.2 : -0.5) + (b.type === 'sob' ? this.shock('depBig') : 0),
      agri: this.shock('agri'), sme: this.shock('sme'),
    };
  }
  initPolicy(b) { // neo lãi suất khởi đầu theo thị trường, kể cả cho người chơi
    const mkt = this.market, S = this.sbv, p = b.pol, T = TYPES[b.type];
    p.rLt6 = Math.min(S.depCap6m, mkt.lt6 + T.depAdj * 0.5); p.rM6_12 = mkt.m6_12 + T.depAdj; p.rGt12 = mkt.gt12 + T.depAdj + 0.2;
    p.lendShort = mkt.lend - 1.0 + T.lendAdj; p.lendMLT = mkt.lend + 0.5 + T.lendAdj;
    p.spread = { rLt6: T.depAdj * 0.5, rM6_12: T.depAdj, rGt12: T.depAdj + 0.2, lendShort: T.lendAdj, lendMLT: T.lendAdj };
    p.growthTarget = b.room;
  }
  aiPolicy(b) {
    const mkt = this.market, S = this.sbv, p = b.pol;
    const need = (b.ldr() > 80 ? 0.4 : 0) + (b.liqReserve() < 12 ? 0.4 : 0) + TYPES[b.type].depAdj;
    p.rLt6 = Math.min(S.depCap6m, mkt.lt6 + need); p.rM6_12 = mkt.m6_12 + need; p.rGt12 = mkt.gt12 + need + 0.2;
    p.rCasa = 0.3;
    const lsp = TYPES[b.type].lendAdj;
    p.lendShort = mkt.lend - 1.0 + lsp; p.lendMLT = mkt.lend + 0.5 + lsp;
    p.growthTarget = S.roomOn ? Math.max(0, Math.min(b.room, 18) - Math.max(0, b.creditGrowthYTD()) * 0) : 16;
    if (b.car() < S.carMin + 0.7) p.growthTarget = Math.min(p.growthTarget, 4);
    if (b.ldr() > S.ldrMax - 1) p.growthTarget = Math.min(p.growthTarget, 5);
    p.carTarget = S.carMin + (b.type === 'sob' ? 0.8 : 1.5);
    if (b.car() < S.carMin + 0.5 && Math.random() < 0.3 && !b.capitalRaisedThisYear) b.raiseCapital(b.equity.charter * 0.15, this);
    if (b.mltRatio() > S.mltMax - 3 && Math.random() < 0.5) b.issueBonds(b.totalAssets() * 0.02, false, this);
    if (b.nplRatio() > 0.045 && Math.random() < 0.3) b.sellToVamc(this);
  }
  /* --- NHNN tự động (ở chế độ chơi ngân hàng) --- */
  sbvAuto() {
    const M = this.macro, S = this.sbv;
    if (this.month - this.lastPolicyMove >= 3) {
      if (M.cpi > 4.8 || M.fx > 4.5) { S.refi += 0.5; S.omo += 0.5; S.disc += 0.5; S.depCap6m = Math.min(6.5, S.depCap6m + 0.5); this.lastPolicyMove = this.month; this.addLog(`NHNN tăng lãi suất điều hành 0,5 điểm % (CPI ${pp(M.cpi, 1)}, tỷ giá +${pp(M.fx, 1)}).`, 'warn'); }
      else if (M.cpi < 3.2 && M.gdp < 6.3 && M.fx < 2.5 && S.refi > 3) { S.refi -= 0.5; S.omo -= 0.5; S.disc -= 0.5; S.depCap6m = Math.max(3.5, S.depCap6m - 0.5); this.lastPolicyMove = this.month; this.addLog(`NHNN giảm lãi suất điều hành 0,5 điểm % để hỗ trợ tăng trưởng.`, 'good'); }
    }
    // Bơm/hút OMO theo độ căng thanh khoản
    S.omoNet = this.tightness > 1.5 ? this.sysDeposits() * 0.01 : this.tightness < -0.8 ? -this.sysDeposits() * 0.005 : 0;
    if (M.fx > 4) { S.fxSell = this.sysDeposits() * 0.004; M.reserves -= 2; M.fx -= 0.6; } else S.fxSell = 0;
  }
  macroStep() {
    const M = this.macro, S = this.sbv;
    const cg = this.sysCreditGrowthAnn ?? 14;
    const noise = () => rnd(-0.08, 0.08);
    M.cpi += 0.05 * (3.5 - M.cpi) + 0.012 * (cg - 12) - 0.03 * (S.refi - 4.5) + 0.02 * Math.max(0, M.fx - 2) + this.shock('cpi') / 12 + noise();
    M.gdp += 0.12 * (6.5 + 0.06 * (cg - 12) - 0.15 * (S.refi - 4.5) - M.gdp) + this.shock('gdp') / 12 + noise();
    // tỷ giá: chênh lệch lãi suất USD–VND tạo áp lực; can thiệp làm giảm
    const pressure = 0.35 * (M.fedRate - this.market.ibON) + 0.6;
    M.fx = clamp(M.fx + 0.08 * (pressure - M.fx) + noise() * 2, -2, 12);
    M.reserves += 0.4 - (M.fx > 3 ? 0.8 : 0) - S.fxSell / Math.max(1, this.sysDeposits()) * 500;
    M.re += 0.04 * (1 - M.re) - 0.015 * (S.refi - 4.5) + 0.004 * (cg - 12) + this.shock('reDrift') + noise() * 0.5;
    M.re = clamp(M.re, 0.2, 2);
    M.m2 = clamp(M.m2 + 0.1 * (cg * 0.85 - M.m2) - 0.02 * this.tightness, 4, 20);
    M.cpi = clamp(M.cpi, 0.5, 15); M.gdp = clamp(M.gdp, -2, 10);
  }
  pickEvent() {
    if (Math.random() > 0.30) return null;
    const cands = EVENTS.filter(e => { try { return (!e.mode || e.mode === this.mode) && e.cond(this) && !(this.lastEvents || []).includes(e.id); } catch (err) { return false; } });
    if (!cands.length) return null;
    const totW = sum(cands.map(e => e.w)); let r = Math.random() * totW;
    for (const e of cands) { r -= e.w; if (r <= 0) return e; }
    return cands[cands.length - 1];
  }
  step() {
    this.month++; this.monthOfYear = (this.month % 12) + 1; this.year = 2026 + Math.floor(this.month / 12);
    // tín dụng tăng trưởng năm (annualized) để đưa vào vĩ mô
    const prev = this.hist.length >= 12 ? this.hist[this.hist.length - 12].loans : this.sysLoansYearStart;
    this.sysCreditGrowthAnn = prev > 0 ? (this.sysLoans() / prev - 1) * 100 : 14;
    if (this.mode === 'bank') this.sbvAuto();
    this.macroStep();
    this.updateMarket();
    for (const b of this.banks) if (!b.isPlayer) this.aiPolicy(b);
    for (const b of this.banks) b.step(this);
    // cú sốc giảm dần
    this.shocks = this.shocks.filter(s => --s.left > 0);
    if (this.sbv.forbearance && this.forbearanceLeft > 0 && --this.forbearanceLeft === 0 && this.mode === 'bank') { this.sbv.forbearance = false; this.addLog('Thông tư 02 hết hiệu lực: nợ cơ cấu phải phân loại lại.', 'warn'); }
    // sự kiện
    const ev = this.pickEvent();
    if (ev) { this.lastEvents = [...(this.lastEvents || []).slice(-3), ev.id]; this.pendingEvent = ev; if (!ev.choice) { ev.apply(this); this.addLog(`Sự kiện: ${ev.title}`, 'warn'); } }
    // kiểm soát đặc biệt các ngân hàng chết (AI)
    for (const b of this.banks) if (b.dead && !b.announced) { b.announced = true; this.addLog(`${b.name} bị đưa vào diện kiểm soát đặc biệt (${b.deadReason}).`, 'bad'); this.addShock({ name: 'Bất ổn hệ thống', left: 3, dep: 1.5, ib: 1 }); }
    // cuối năm
    if (this.month % 12 === 0) {
      for (const b of this.banks) if (!b.dead) b.yearEnd(this);
      this.sysLoansYearStart = this.sysLoans();
      if (this.mode === 'bank') { this.sbv.sysRoom = clamp(15 + (this.macro.cpi < 4 ? 1 : -2) + (this.macro.gdp < 6 ? 1 : 0), 8, 20); }
      this.assignRoom();
      this.addLog(`Năm ${this.year - 1} kết thúc. Room tín dụng năm ${this.year}: hệ thống ${this.sbv.sysRoom}%.`, 'good');
    }
    this.hist.push({ m: this.month, cpi: this.macro.cpi, gdp: this.macro.gdp, fx: this.macro.fx, re: this.macro.re, ibON: this.market.ibON, refi: this.sbv.refi, loans: this.sysLoans(), npl: this.sysNpl() * 100, cg: this.sysCreditGrowthAnn, reserves: this.macro.reserves, m2: this.macro.m2 });
    if (this.hist.length > 240) this.hist.shift();
  }
  sbvScore() {
    const M = this.macro; let s = 0;
    s += M.cpi >= 2.5 && M.cpi <= 4.5 ? 3 : M.cpi < 6 ? 1 : -3;
    s += M.gdp >= 6.5 ? 3 : M.gdp >= 5.5 ? 1 : -2;
    s += Math.abs(M.fx) < 3 ? 2 : M.fx < 5 ? 0 : -3;
    s += this.sysNpl() < 0.03 ? 2 : this.sysNpl() < 0.05 ? 0 : -3;
    s -= this.banks.filter(b => b.dead).length * 5;
    s += M.reserves > 80 ? 1 : M.reserves > 50 ? 0 : -3;
    return s;
  }
}

/* =====================================================================
   Giao diện: đồng hồ thời gian thực, cảnh pixel, terminal, bảng điều hành
   ===================================================================== */
let W = null, tab = 'overview', selectedBank = 0;
const $ = s => document.querySelector(s);
const app = $('#app');
const Clock = { playing: false, speed: 4000, acc: 0, last: 0, raf: false };
const Term = { lines: [], body: null };
function statusOf(ok, warn) { return ok ? 'good' : warn ? 'warn' : 'bad'; }

/* ---- terminal ---- */
function termPush(m, msg, cls, src) {
  const ln = { m, msg, cls: cls || '', src: src || '' };
  Term.lines.push(ln); if (Term.lines.length > 600) Term.lines.shift();
  if (Term.body) { Term.body.appendChild(termLine(ln)); while (Term.body.childElementCount > 600) Term.body.firstChild.remove(); Term.body.parentElement.scrollTop = Term.body.parentElement.scrollHeight; }
}
function termLine(l) {
  const d = document.createElement('div'); d.className = 'ln ' + l.cls;
  d.innerHTML = `<span class="t">${W ? W.dateStr(l.m) : ''}</span>${l.src ? `<span class="src">[${l.src}]</span>` : ''}<span class="msg"></span>`;
  d.querySelector('.msg').textContent = ' ' + l.msg; return d;
}
const _bankAddLog = Bank.prototype.addLog;
Bank.prototype.addLog = function (m, msg, cls) { _bankAddLog.call(this, m, msg, cls); if (W && (this.isPlayer || W.mode === 'sbv')) termPush(m, msg, cls, this.isPlayer ? 'NH' : this.name.replace('NH ', '')); };
const _worldAddLog = World.prototype.addLog;
World.prototype.addLog = function (msg, cls) { _worldAddLog.call(this, msg, cls); termPush(this.month, msg, cls, 'HỆ THỐNG'); };

/* ---- cảnh pixel ---- */
const Scene = {
  c: null, g: null, W: 384, H: 112, people: [], t: 0, rates: { dep: 0.5, wd: 0.2, loan: 0.3 }, run: false,
  tickerEl: null, tickerX: 0, tickerText: '',
  init(canvas) { this.c = canvas; this.g = canvas.getContext('2d'); this.g.imageSmoothingEnabled = false; this.people = []; this.t = 0; this.tickerEl = $('#ticker'); this.setTicker('BankSim Việt Nam · bấm ▶ Chạy để bắt đầu thời gian thực · mỗi tháng là một ngày trên màn hình'); },
  setTicker(txt) { this.tickerText = txt; if (this.tickerEl) { this.tickerEl.textContent = txt; this.tickerX = this.tickerEl.parentElement.clientWidth; } },
  buildings() {
    const list = [];
    if (!W) return list;
    if (W.mode === 'bank') {
      const B = W.player; const h = 34 + 30 * Math.sqrt(B.totalAssets() / 2.6e6);
      list.push({ b: B, x: 150, w: 84, h: Math.min(78, h), main: true });
      const others = W.banks.filter(b => !b.isPlayer);
      list.push({ b: others[0], x: 92, w: 40, h: 40, bg: true }); list.push({ b: others[4], x: 250, w: 40, h: 46, bg: true }); list.push({ b: others[6], x: 300, w: 34, h: 32, bg: true });
    } else {
      W.banks.forEach((b, i) => list.push({ b, x: 70 + i * 34, w: 26, h: Math.min(76, 18 + 52 * Math.sqrt(b.totalAssets() / 2.6e6)) }));
    }
    return list;
  },
  onMonth() { // cập nhật tốc độ khách theo kết quả tháng
    const B = W.mode === 'bank' ? W.player : null;
    if (B && B.mech) {
      const dg = (B.mech.depEnd / Math.max(1, B.mech.depStart) - 1) * 100; // % tháng
      this.rates.dep = clamp(0.35 + Math.max(0, dg) * 0.5, 0.2, 3);
      this.rates.wd = clamp(0.15 + Math.max(0, -dg) * 0.8 + Math.max(0, -B.reputation) * 0.8, 0.1, 4);
      this.rates.loan = clamp(0.15 + B.mech.disb / Math.max(1, B.grossLoans()) * 12, 0.1, 2.5);
      this.run = B.reputation < -1 || B.liqFail > 0;
    } else {
      const alive = W.banks.filter(b => !b.dead);
      this.rates.dep = 1.2; this.rates.wd = 0.4 + W.shock('dep') * 0.3; this.rates.loan = 0.8; this.run = W.banks.some(b => b.reputation < -1);
    }
    const ev = W.log.length ? W.log[0].msg : ''; const own = B && B.log.length ? B.log[0].msg : '';
    this.setTicker(`${W.dateStr()} · CPI ${pp(W.macro.cpi, 1)} · GDP ${pp(W.macro.gdp, 1)} · LS liên NH ${pp(W.market.ibON)} · ${W.shocks.map(s => s.name).join(', ') || 'không có cú sốc'} · ${ev} ${own ? ' · ' + own : ''}`);
  },
  spawn(kind) {
    const bl = this.buildings(); if (!bl.length) return;
    let tgt = bl.find(b => b.main) || bl[Math.floor(Math.random() * bl.length)];
    if (W.mode === 'sbv') { const alive = bl.filter(x => !x.b.dead); if (!alive.length) return; const tot = sum(alive.map(x => x.b.totalAssets())); let r = Math.random() * tot; tgt = alive[alive.length - 1]; for (const x of alive) { r -= x.b.totalAssets(); if (r <= 0) { tgt = x; break; } } }
    const door = tgt.x + tgt.w / 2; const y = this.H - 12;
    const colors = { dep: '#3ddc84', wd: '#ff5d5d', loan: '#5aa9ff' };
    const p = { kind, color: colors[kind], y, door, speed: 18 + Math.random() * 14, bag: kind === 'wd', timer: 0, dir: 1 };
    if (kind === 'wd') { p.x = door; p.phase = 'leave'; p.dir = Math.random() < 0.5 ? -1 : 1; p.timer = 0.4 + Math.random() * 1.2; }
    else { const fromLeft = Math.random() < 0.5; p.x = fromLeft ? -4 : this.W + 4; p.dir = fromLeft ? 1 : -1; p.phase = 'walk'; }
    this.people.push(p); if (this.people.length > 90) this.people.shift();
  },
  update(dt) {
    if (!W) return; this.t += dt;
    const mult = Clock.playing ? 1 : 0.25;
    if (Math.random() < this.rates.dep * dt * mult) this.spawn('dep');
    if (Math.random() < this.rates.loan * dt * mult) this.spawn('loan');
    if (Math.random() < (this.run ? 4 : this.rates.wd) * dt * mult) this.spawn('wd');
    for (const p of this.people) {
      if (p.phase === 'walk') { p.x += p.dir * p.speed * dt; if ((p.dir === 1 && p.x >= p.door) || (p.dir === -1 && p.x <= p.door)) { p.phase = 'in'; p.timer = 0.8 + Math.random() * 1.5; } }
      else if (p.phase === 'in') { p.timer -= dt; if (p.timer <= 0) { p.phase = 'leave'; p.dir = Math.random() < 0.5 ? -1 : 1; p.bag = p.kind === 'loan'; if (p.kind === 'loan') p.color = '#f2c14e'; } }
      else if (p.phase === 'leave') { if (p.timer > 0) { p.timer -= dt; continue; } p.x += p.dir * p.speed * dt; if (p.x < -6 || p.x > this.W + 6) p.phase = 'gone'; }
    }
    this.people = this.people.filter(p => p.phase !== 'gone');
    if (this.tickerEl) { const w = this.tickerEl.parentElement.clientWidth; this.tickerX -= dt * 45; if (this.tickerX < -this.tickerEl.scrollWidth) this.tickerX = w; this.tickerEl.style.transform = `translateX(${this.tickerX}px)`; }
  },
  draw() {
    const g = this.g; if (!g || !W) return; const Wd = this.W, H = this.H;
    const phase = Clock.acc / Clock.speed; // 0..1 = một ngày (một tháng)
    const night = clamp((Math.cos((phase - 0.72) * Math.PI * 2) + 0.35) * 1.4, 0, 1); // 1 = đêm
    const shocks = W.shocks.map(s => s.name).join(' ');
    const war = /Trung Đông|chiến/i.test(shocks), rain = /Bão/.test(shocks), crisis = this.run || /Khủng hoảng|Rút tiền|Bất ổn|USD/.test(shocks);
    const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
    let sky = mix([118, 182, 230], [10, 18, 42], night); if (war) sky = mix(sky, [160, 60, 40], 0.3); if (rain) sky = mix(sky, [70, 80, 95], 0.5);
    g.fillStyle = `rgb(${sky.join(',')})`; g.fillRect(0, 0, Wd, H);
    if (night > 0.5) { g.fillStyle = '#e8ecf5'; for (let i = 0; i < 24; i++) g.fillRect((i * 53 + 7) % Wd, (i * 29) % 50, 1, 1); }
    // mặt trời / trăng
    const sx = phase * (Wd + 20) - 10, sy = 60 - Math.sin(phase * Math.PI) * 50;
    g.fillStyle = night > 0.5 ? '#f3f1d8' : (war ? '#ff9a4a' : '#ffd84a'); g.fillRect(sx - 3, sy - 3, 6, 6); g.fillRect(sx - 4, sy - 2, 8, 4); g.fillRect(sx - 2, sy - 4, 4, 8);
    // núi nền
    g.fillStyle = `rgb(${mix([84, 130, 120], [16, 26, 46], night).join(',')})`; for (let x = 0; x < Wd; x += 3) g.fillRect(x, 58 - Math.round(12 * Math.abs(Math.sin(x / 40)) + 6 * Math.abs(Math.sin(x / 13))), 3, 40);
    // mặt đất & vỉa hè
    g.fillStyle = `rgb(${mix([70, 70, 74], [30, 30, 36], night).join(',')})`; g.fillRect(0, H - 10, Wd, 10);
    g.fillStyle = `rgb(${mix([170, 168, 160], [70, 70, 76], night).join(',')})`; g.fillRect(0, H - 13, Wd, 3);
    g.fillStyle = '#c9b458'; for (let x = 4; x < Wd; x += 16) g.fillRect(x, H - 5, 8, 1);
    // NHNN
    this.drawSbv(g, 8, night);
    // các tòa nhà
    for (const b of this.buildings()) this.drawBank(g, b, night);
    // khách hàng
    for (const p of this.people) this.drawPerson(g, p);
    if (rain) { g.fillStyle = 'rgba(190,210,255,0.5)'; for (let i = 0; i < 60; i++) { const x = (i * 37 + this.t * 90) % Wd, y = (i * 53 + this.t * 160) % H; g.fillRect(x, y, 1, 3); } }
    if (crisis) { g.fillStyle = `rgba(255,40,40,${0.12 + 0.1 * Math.sin(this.t * 6)})`; g.fillRect(0, 0, Wd, H); }
    if (W.player && W.player.dead) { g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(0, 0, Wd, H); g.fillStyle = '#ff5d5d'; g.font = 'bold 12px monospace'; g.textAlign = 'center'; g.fillText('KIỂM SOÁT ĐẶC BIỆT', Wd / 2, H / 2); }
  },
  drawSbv(g, x, night) {
    const y0 = this.H - 13; const w = 48, h = 36;
    g.fillStyle = night > 0.5 ? '#6b5f4a' : '#c8b88f'; g.fillRect(x, y0 - h, w, h);
    g.fillStyle = night > 0.5 ? '#4a4032' : '#9a8a63'; g.fillRect(x + 4, y0 - h - 6, w - 8, 6); g.fillRect(x + 16, y0 - h - 14, w - 32, 8); // mái vòm
    g.fillStyle = '#d33'; g.fillRect(x + w / 2 - 1, y0 - h - 24, 1, 10); g.fillRect(x + w / 2, y0 - h - 24, 7, 4); g.fillStyle = '#ffd84a'; g.fillRect(x + w / 2 + 3, y0 - h - 23, 1, 2);
    g.fillStyle = night > 0.5 ? '#ffe9a0' : '#3b3a52'; for (let i = 0; i < 4; i++) g.fillRect(x + 6 + i * 11, y0 - h + 8, 4, 10);
    g.fillStyle = '#3b3a52'; g.fillRect(x + w / 2 - 3, y0 - 10, 6, 10);
    g.fillStyle = '#fff'; g.font = '6px monospace'; g.textAlign = 'center'; g.fillText('NHNN', x + w / 2, y0 - h + 6);
  },
  drawBank(g, bb, night) {
    const b = bb.b; const y0 = this.H - 13; const h = bb.h; const dead = b.dead;
    const sob = b.type === 'sob';
    const body = dead ? '#3a3a3a' : bb.bg ? (night > 0.5 ? '#3a4a5a' : '#8aa0b4') : sob ? (night > 0.5 ? '#2f4a66' : '#4f7fae') : (night > 0.5 ? '#4a3a66' : '#8262b3');
    g.fillStyle = body; g.fillRect(bb.x, y0 - h, bb.w, h);
    g.fillStyle = dead ? '#222' : (night > 0.5 ? '#1c2a3a' : '#dfe8f0'); g.fillRect(bb.x, y0 - h - 3, bb.w, 3);
    // cửa sổ
    const lit = night > 0.5 && !dead; const cols = Math.floor((bb.w - 6) / 7), rows = Math.floor((h - 14) / 8);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const on = lit && ((r * 7 + c * 3 + b.id.length) % 5 !== 0); g.fillStyle = dead ? '#2a2a2a' : on ? '#ffe9a0' : (night > 0.5 ? '#24324a' : '#e9f2fa'); g.fillRect(bb.x + 4 + c * 7, y0 - h + 6 + r * 8, 4, 5); }
    // cửa & biển
    g.fillStyle = '#2a2436'; g.fillRect(bb.x + bb.w / 2 - 4, y0 - 11, 8, 11); g.fillStyle = '#ffd84a'; g.fillRect(bb.x + bb.w / 2 - 6, y0 - 13, 12, 2);
    if (!bb.bg) { g.fillStyle = '#fff'; g.font = (bb.main ? '7px' : '5px') + ' monospace'; g.textAlign = 'center'; g.fillText(bb.main ? b.name.replace('NH ', '') : b.name.replace('NH ', '').split(' ')[0], bb.x + bb.w / 2, y0 - h - 6); }
    // đèn cảnh báo
    const weak = !dead && (b.car() < W.sbv.carMin + 0.5 || b.liqReserve() < 10 || b.reputation < -0.5);
    if (weak && Math.sin(this.t * 8) > 0) { g.fillStyle = '#ff3b3b'; g.fillRect(bb.x + bb.w - 4, y0 - h - 6, 2, 3); }
    if (dead) { g.fillStyle = '#ff5d5d'; g.fillRect(bb.x + 2, y0 - h / 2, bb.w - 4, 1); g.fillRect(bb.x + bb.w / 2, y0 - h + 2, 1, h - 4); }
  },
  drawPerson(g, p) {
    if (p.phase === 'in') return; const x = Math.round(p.x), y = Math.round(p.y);
    const step = Math.floor(this.t * 8 + x) % 2;
    g.fillStyle = '#f1c9a5'; g.fillRect(x, y - 7, 2, 2);
    g.fillStyle = p.color; g.fillRect(x - 1, y - 5, 4, 4);
    g.fillStyle = '#2b2b2b'; g.fillRect(x + (step ? 0 : 1), y - 1, 1, 2); g.fillRect(x + (step ? 2 : 1), y - 1, 1, 2);
    if (p.bag) { g.fillStyle = p.kind === 'wd' ? '#ffd84a' : '#f2c14e'; g.fillRect(x + (p.dir > 0 ? 3 : -3), y - 3, 2, 3); }
  }
};

function kpiCell(label, value, cls) { return `<div class="kpi"><div class="l">${label}</div><div class="v">${cls ? `<span class="dot ${cls}"></span>` : ''}${value}</div></div>`; }

/* ---- khung màn hình chơi ---- */
function renderShell() {
  const isBank = W.mode === 'bank'; const B = isBank ? W.player : null;
  Clock.playing = false; Clock.acc = 0;
  app.innerHTML = `
  <div class="top">
    <div class="top-row">
      <div class="brand"><h1>BankSim Việt Nam</h1><span class="sub">${isBank ? B.name + ' · ' + TYPES[B.type].name : 'Ngân hàng Nhà nước · điều tiết hệ thống'}</span></div>
      <div class="clock"><span class="date" id="dateLbl"></span><div class="progress"><i id="prog"></i></div></div>
      <div class="ctrl">
        <button class="btn primary" id="playBtn">▶ Chạy</button>
        <select id="speedSel" class="btn" aria-label="Tốc độ"><option value="8000">8 s/tháng</option><option value="4000" selected>4 s/tháng</option><option value="1500">1,5 s/tháng</option><option value="400">0,4 s/tháng</option></select>
        <button class="btn" id="nextBtn">+1 tháng</button>
        <button class="btn" id="saveBtn">Lưu</button>

      </div>
    </div>

  </div>
  <div class="scene-wrap"><canvas id="scene" width="384" height="112" aria-label="Cảnh trụ sở ngân hàng"></canvas><div class="ticker-wrap"><div class="ticker" id="ticker"></div></div></div>
  <div class="split">
    <div class="left"><div class="tabs" id="tabs"></div><div class="pane" id="pane"></div></div>
    <div class="term" id="term"><div class="term-head">terminal · nhật ký điều hành</div><div id="termBody"></div></div>
  </div>
  <div id="modal"></div>`;
  Term.body = $('#termBody'); for (const l of Term.lines) Term.body.appendChild(termLine(l));
  if (!Term.lines.length) termPush(W.month, isBank ? `Bạn tiếp quản ${B.name}. Tổng tài sản ${fmt0(B.totalAssets())} tỷ, CAR ${pp(B.car(), 1)}, nợ xấu ${pp(B.nplRatio() * 100, 1)}, room ${B.room}%.` : `Bạn là Thống đốc. Hệ thống 9 ngân hàng, tổng dư nợ ${fmt0(W.sysLoans())} tỷ.`, 'info', 'HỆ THỐNG');
  Scene.init($('#scene')); Scene.onMonth();
  $('#playBtn').onclick = togglePlay;
  $('#speedSel').onchange = e => { Clock.speed = +e.target.value; Clock.acc = Math.min(Clock.acc, Clock.speed); };
  $('#speedSel').value = String(Clock.speed);
  $('#nextBtn').onclick = () => { if (W.pendingEvent) { showEvent(); return; } stepMonth(); };
  $('#saveBtn').onclick = () => { saveGame() ? toast('Đã lưu vào trình duyệt.') : toast('Không lưu được (bộ nhớ trình duyệt bị chặn).'); };
  $('#restartBtn').onclick = () => { Clock.playing = false; setPlayBtn(); showModal('Bắt đầu ván mới?', 'Tiến trình hiện tại sẽ mất nếu chưa lưu.', [{ label: 'Ván mới', apply: () => { W = null; renderStart(); } }, { label: 'Ở lại', apply: () => {} }]); };
  renderGame();
  if (!Clock.raf) { Clock.raf = true; Clock.last = 0; requestAnimationFrame(loop); }
}
function setPlayBtn() { const b = $('#playBtn'); if (b) { b.textContent = Clock.playing ? '⏸ Tạm dừng' : '▶ Chạy'; b.classList.toggle('primary', !Clock.playing); } }
function togglePlay() { if (W.pendingEvent) { showEvent(); return; } if (W.player && W.player.dead) return; Clock.playing = !Clock.playing; setPlayBtn(); }
function loop(ts) {
  if (!W) { Clock.raf = false; return; }
  const dt = Math.min(0.1, (ts - (Clock.last || ts)) / 1000); Clock.last = ts;
  if (Clock.playing && !W.pendingEvent && !(W.player && W.player.dead)) {
    Clock.acc += dt * 1000;
    if (Clock.acc >= Clock.speed) { Clock.acc -= Clock.speed; stepMonth(); }
  }
  Scene.update(dt); Scene.draw();
  const pr = $('#prog'); if (pr) pr.style.width = (Clock.acc / Clock.speed * 100) + '%';
  requestAnimationFrame(loop);
}
function stepMonth() {
  W.step();
  const B = W.player;
  if (B) termPush(W.month, `── ${W.dateStr()} · LN ${fmt0(B.lastPnl.net)} tỷ · CAR ${pp(B.car(), 1)} · LDR ${pp(B.ldr(), 0)} · NPL ${pp(B.nplRatio() * 100, 1)} · giải ngân ${fmt0(B.lastDisb || 0)}${B.binds && B.binds.length ? ' (chặn bởi ' + B.binds.join(', ') + ')' : ''}`, 'dim', '');
  else termPush(W.month, `── ${W.dateStr()} · CPI ${pp(W.macro.cpi, 1)} · GDP ${pp(W.macro.gdp, 1)} · tín dụng ${pp(W.sysCreditGrowthAnn, 1)} · NPL ${pp(W.sysNpl() * 100, 1)} · LNH ${pp(W.market.ibON)}`, 'dim', '');
  Scene.onMonth();
  updateTop();
  if (tab === 'manage') syncManage(); else renderPane();
  if (W.pendingEvent) { Clock.playing = false; setPlayBtn(); showEvent(); }
  else if (B && B.dead && !B.shownDead) { Clock.playing = false; setPlayBtn(); B.shownDead = true; showModal('Kiểm soát đặc biệt', `${B.name} bị NHNN đưa vào diện kiểm soát đặc biệt do ${B.deadReason}. Ván chơi kết thúc với ${B.score} điểm sau ${W.month} tháng. Bạn vẫn có thể xem lại số liệu.`, [{ label: 'Xem lại', apply: () => {} }, { label: 'Ván mới', apply: () => { W = null; renderStart(); } }]); }
}
function updateTop() {
  const isBank = W.mode === 'bank'; const B = isBank ? W.player : W.banks[selectedBank]; const S = W.sbv, M = W.macro;
  let kpis = '';
  if (isBank) {
    kpis = kpiCell('Tổng tài sản', fmt0(B.totalAssets()) + ' tỷ')
      + kpiCell('CAR', pp(B.car()), statusOf(B.car() >= S.carMin + 1, B.car() >= S.carMin))
      + kpiCell('LDR', pp(B.ldr(), 1), statusOf(B.ldr() <= S.ldrMax - 3, B.ldr() <= S.ldrMax))
      + kpiCell('Vốn NH → TDH', pp(B.mltRatio(), 1), statusOf(B.mltRatio() <= S.mltMax - 4, B.mltRatio() <= S.mltMax))
      + kpiCell('Nợ xấu', pp(B.nplRatio() * 100), statusOf(B.nplRatio() < 0.02, B.nplRatio() < 0.03))
      + kpiCell('Dự trữ thanh khoản', pp(B.liqReserve(), 1), statusOf(B.liqReserve() >= 13, B.liqReserve() >= 10))
      + kpiCell('Tín dụng YTD / room', `${pp(B.creditGrowthYTD(), 1)} / ${B.room}%`, statusOf(B.creditGrowthYTD() <= B.room - 1, B.creditGrowthYTD() <= B.room))
      + kpiCell('LN tháng', fmt0(B.lastPnl.net) + ' tỷ', statusOf(B.lastPnl.net > 0, B.lastPnl.net > -B.totalEquity() * 0.005))
      + kpiCell('ROE (năm hóa)', pp(B.hist.length ? B.hist[B.hist.length - 1].roe : 0, 1))
      + kpiCell('Điểm CEO', String(B.score));
  } else {
    kpis = kpiCell('CPI', pp(M.cpi, 1), statusOf(M.cpi <= 4.5 && M.cpi >= 2, M.cpi < 6))
      + kpiCell('GDP', pp(M.gdp, 1), statusOf(M.gdp >= 6.5, M.gdp >= 5.5))
      + kpiCell('Tỷ giá (mất giá/năm)', pp(M.fx, 1), statusOf(Math.abs(M.fx) < 3, M.fx < 5))
      + kpiCell('Dự trữ ngoại hối', fmt1(M.reserves) + ' tỷ USD', statusOf(M.reserves > 80, M.reserves > 50))
      + kpiCell('Tín dụng (YoY)', pp(W.sysCreditGrowthAnn ?? 14, 1), statusOf((W.sysCreditGrowthAnn ?? 14) <= 16 && (W.sysCreditGrowthAnn ?? 14) >= 10, true))
      + kpiCell('Nợ xấu hệ thống', pp(W.sysNpl() * 100), statusOf(W.sysNpl() < 0.03, W.sysNpl() < 0.05))
      + kpiCell('LS liên NH O/N', pp(W.market.ibON), statusOf(W.tightness < 1, W.tightness < 2.5))
      + kpiCell('NH bị KSĐB', String(W.banks.filter(b => b.dead).length), statusOf(!W.banks.some(b => b.dead), true))
      + kpiCell('Điểm Thống đốc', String(W.sbvScore()));
  }
  $('#kpis').innerHTML = kpis;
  $('#dateLbl').textContent = `${W.dateStr()} · tháng ${W.month}`;
}
function renderTabs() {
  const isBank = W.mode === 'bank';
  const tabs = isBank
    ? [['overview', 'Tổng quan'], ['balance', 'Bảng cân đối & P&L'], ['manage', 'Điều hành'], ['comply', 'Tuân thủ'], ['system', 'Hệ thống & vĩ mô'], ['log', 'Nhật ký'], ['guide', 'Hướng dẫn']]
    : [['overview', 'Tổng quan vĩ mô'], ['manage', 'Công cụ NHNN'], ['system', 'Các ngân hàng'], ['balance', 'Chi tiết ngân hàng'], ['comply', 'Tuân thủ NH'], ['log', 'Nhật ký'], ['guide', 'Hướng dẫn']];
  $('#tabs').innerHTML = tabs.map(t => `<button class="tab ${tab === t[0] ? 'active' : ''}" data-tab="${t[0]}">${t[1]}</button>`).join('');

}
function renderGame() {
  updateTop(); renderTabs(); renderPane();
  if (W.pendingEvent) showEvent();
}
/* đồng bộ thanh trượt lãi suất khi đang neo theo thị trường (không vẽ lại cả bảng) */
function syncManage() {
  if (W.mode !== 'bank') return; const p = W.player.pol; if (!p.anchor) return;
  for (const k of ['rLt6', 'rM6_12', 'rGt12', 'lendShort', 'lendMLT']) { const el = document.getElementById(k); if (el && document.activeElement !== el) { el.value = p[k]; const v = document.getElementById(k + '_v'); if (v) v.textContent = p[k].toFixed(2).replace('.', ',') + '%'; } }
}

function renderPane() {
  const pane = $('#pane');
  const isBank = W.mode === 'bank';
  const B = isBank ? W.player : W.banks[selectedBank];
  switch (tab) {
    case 'overview': pane.innerHTML = isBank ? overviewBank(B) : overviewSbv(); break;
    case 'balance': pane.innerHTML = balancePane(B); break;
    case 'manage': pane.innerHTML = isBank ? managePane(B) : sbvPane(); bindManage(B); break;
    case 'comply': pane.innerHTML = complyPane(B); break;
    case 'system': pane.innerHTML = systemPane(); break;
    case 'log': pane.innerHTML = logPane(B); break;
    case 'guide': pane.innerHTML = guidePane(); break;
  }
  pane.querySelectorAll('[data-pick]').forEach(el => el.onclick = () => { selectedBank = +el.dataset.pick; tab = 'balance'; renderGame(); });
  drawCharts(B);
}

/* ---------- Tổng quan ngân hàng ---------- */
function alertsFor(B) {
  const S = W.sbv, a = [];
  if (B.dead) a.push(['bad', `Ngân hàng đang bị kiểm soát đặc biệt (${B.deadReason}).`]);
  if (B.car() < S.carMin) a.push(['bad', `CAR ${pp(B.car())} dưới mức tối thiểu ${pp(S.carMin)}. Tăng vốn, phát hành trái phiếu thứ cấp, giảm tài sản rủi ro cao (BĐS, tiêu dùng) hoặc mua thêm TPCP (hệ số rủi ro 0%).`]);
  else if (B.car() < S.carMin + 1) a.push(['warn', `CAR ${pp(B.car())} sát ngưỡng. Giải ngân sẽ bị chặn bởi CAR mục tiêu.`]);
  if (B.ldr() > S.ldrMax) a.push(['bad', `LDR ${pp(B.ldr(), 1)} vượt trần ${S.ldrMax}%. Tăng lãi suất huy động, phát hành giấy tờ có giá hoặc hãm tăng trưởng tín dụng.`]);
  if (B.mltRatio() > S.mltMax) a.push(['bad', `Vốn ngắn hạn cho vay trung dài hạn ${pp(B.mltRatio(), 1)} vượt ${S.mltMax}%. Cần thêm tiền gửi ≥12 tháng, trái phiếu dài hạn hoặc giảm cho vay mua nhà/BĐS.`]);
  if (B.liqReserve() < 10) a.push(['bad', `Dự trữ thanh khoản ${pp(B.liqReserve(), 1)} dưới 10%. Giữ thêm tiền mặt/TPCP.`]);
  if (B.nplRatio() > 0.03) a.push(['warn', `Nợ xấu ${pp(B.nplRatio() * 100)} trên 3%: bị hạn chế chia cổ tức và nới room. Cân nhắc bán nợ cho VAMC hoặc giảm khẩu vị rủi ro.`]);
  if (S.roomOn && B.creditGrowthYTD() > B.room - 1) a.push(['warn', `Đã dùng gần hết room tín dụng ${B.room}% (${pp(B.creditGrowthYTD(), 1)}). Giải ngân mới bị chặn.`]);
  if (B.ibBorrow + B.refi > B.deposits() * 0.1) a.push(['warn', `Phụ thuộc liên ngân hàng/tái cấp vốn: ${fmt0(B.ibBorrow + B.refi)} tỷ (${pp((B.ibBorrow + B.refi) / B.deposits() * 100, 1)} tiền gửi). Rủi ro khi thị trường 2 đóng băng.`]);
  if (B.binds && B.binds.length) a.push(['info', `Tháng qua giải ngân ${fmt0(B.lastDisb || 0)} tỷ, bị giới hạn bởi: ${B.binds.join(', ')}.`]);
  if (B.lastPnl.net < 0) a.push(['bad', `Lỗ ${fmt0(-B.lastPnl.net)} tỷ trong tháng, chủ yếu do trích lập dự phòng ${fmt0(B.lastPnl.prov)} tỷ.`]);
  if (!a.length) a.push(['good', 'Các tỷ lệ an toàn đều trong ngưỡng. Xem xét tăng trưởng nếu còn room.']);
  return `<div class="alerts">${a.map(x => `<div class="alert ${x[0]}">${x[1]}</div>`).join('')}</div>`;
}

}

function overviewSbv() {
  const alive = W.banks.filter(b => !b.dead);
  const weak = alive.filter(b => b.car() < W.sbv.carMin + 0.5 || b.nplRatio() > 0.04 || b.liqReserve() < 11);
  const a = [];
  const M = W.macro;
  if (M.cpi > 4.5) a.push(['bad', `CPI ${pp(M.cpi, 1)} vượt mục tiêu 4,5%. Cân nhắc tăng lãi suất điều hành, hút tiền qua tín phiếu, hạ room tín dụng.`]);
  if (M.cpi < 2) a.push(['warn', `CPI ${pp(M.cpi, 1)} quá thấp, kinh tế có dấu hiệu yếu.`]);
  if (M.gdp < 6) a.push(['warn', `GDP ${pp(M.gdp, 1)} dưới 6%. Có thể hạ lãi suất, nới room, bơm OMO nếu lạm phát cho phép.`]);
  if (M.fx > 3) a.push(['bad', `VND mất giá ${pp(M.fx, 1)}/năm. Bán USD từ dự trữ (tốn dự trữ) hoặc nâng lãi suất VND để thu hẹp chênh lệch với USD (${pp(M.fedRate)}).`]);
  if (M.reserves < 60) a.push(['bad', `Dự trữ ngoại hối chỉ còn ${fmt1(M.reserves)} tỷ USD (dưới 3 tháng nhập khẩu).`]);
  if (W.tightness > 2) a.push(['bad', `Thanh khoản hệ thống rất căng (LS liên NH ${pp(W.market.ibON)}). Bơm OMO hoặc hạ dự trữ bắt buộc.`]);
  if (weak.length) a.push(['warn', `Ngân hàng yếu: ${weak.map(b => b.name).join(', ')}. Theo dõi CAR, nợ xấu, thanh khoản.`]);
  if (!a.length) a.push(['good', 'Hệ thống ổn định. Duy trì chính sách và theo dõi tỷ giá.']);
  return `<div class="grid g2">
    <div class="panel"><h2>Cảnh báo</h2><div class="alerts">${a.map(x => `<div class="alert ${x[0]}">${x[1]}</div>`).join('')}</div></div>

    <div class="panel"><h2>Lạm phát, tăng trưởng, tỷ giá</h2><canvas class="chart" id="c1"></canvas><div class="legend"><span><i style="background:var(--s1)"></i>CPI %</span><span><i style="background:var(--s2)"></i>GDP %</span><span><i style="background:var(--s3)"></i>Mất giá VND %</span><span><i style="background:var(--s4)"></i>LS tái cấp vốn %</span></div></div>
    <div class="panel"><h2>Tín dụng & nợ xấu hệ thống</h2><canvas class="chart" id="c2"></canvas><div class="legend"><span><i style="background:var(--s1)"></i>Tín dụng YoY %</span><span><i style="background:var(--s2)"></i>Nợ xấu %</span><span><i style="background:var(--s3)"></i>LS liên NH O/N %</span></div></div>
    <div class="panel"><h2>Tổng dư nợ hệ thống (nghìn tỷ)</h2><canvas class="chart" id="c3"></canvas></div>
  </div>`;
}
