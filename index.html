      ${arow('Lãi CASA', pp(p.rCasa), [{ lbl: '−0,1', act: 'rate', arg: ['rCasa', -0.1] }, { lbl: '+0,1', act: 'rate', arg: ['rCasa', 0.1] }], 'Thị trường ~0,3%')}
      ${rate('rLt6', `Thị trường ${pp(K.lt6)} · trần ${pp(S.depCap6m)}` + (p.rLt6 > S.depCap6m + 1e-9 ? ' · <b class="badtxt">vượt trần</b>' : ''))}
      ${rate('rM6_12', `Thị trường ${pp(K.m6_12)} · đối thủ top 3 ${pp(W.compRates(B).rM6_12)}`)}
      ${rate('rGt12', `Thị trường ${pp(K.gt12)} · nguồn trung dài hạn`)}
    </div>
    <div class="panel"><h2>Cho vay & khẩu vị rủi ro</h2>
      ${rate('lendShort', `Thị trường ${pp(K.lend)} · rẻ nhất ${pp(W.compRates(B).lendShort)} · ưu tiên trần ${pp(REG.priorityCap)}`)}
      ${rate('lendMLT', 'Áp cho phần trung dài hạn + phụ trội ngành')}
      ${num('appetite', 'Khẩu vị rủi ro', 1, 1, 5, '', APPETITE[p.appetite - 1].name + ' · nợ xấu ×' + APPETITE[p.appetite - 1].pd)}
      ${num('growthTarget', 'Mục tiêu tăng trưởng tín dụng', 2, 0, 40, '%/năm', `Room ${B.room}% · đã dùng ${pp(B.creditGrowthYTD(), 1)}`)}
      ${num('carTarget', 'CAR mục tiêu nội bộ', 0.5, S.carMin, 20, '%', `Hiện ${pp(B.car(), 1)} · tối thiểu ${pp(S.carMin, 1)}`)}
    </div>
    <div class="panel"><h2>Cơ cấu giải ngân mới</h2>
      <div class="abtns wrap">${Object.entries(PRESET_NAMES).map(([k, n]) => `<button class="btn small" data-act="preset" data-arg='"${k}"'>${n}</button>`).join('')}</div>
      ${mixRows}
    </div>
    <div class="panel"><h2>Thanh khoản, đầu tư, chi phí</h2>
      ${num('gbondTarget', 'TPCP (% tổng tài sản)', 1, 0, 30, '%', `Lợi suất ${pp(K.gbondYield)} · RR 0% · thế chấp OMO`)}
      ${num('cashBuffer', 'Đệm tiền mặt (% tiền gửi)', 0.5, 0.5, 10, '%', 'Thiếu → vay liên NH; thừa → cho vay liên NH')}
      ${num('digital', 'Đầu tư ngân hàng số', 1, 0, 3, '', '+CASA, +phí, +chi phí')}
      ${num('network', 'Mở rộng mạng lưới', 1, 0, 3, '', '+huy động, +chi phí')}
      ${num('divRate', 'Cổ tức tiền mặt (% LN năm)', 10, 0, 80, '%', B.type === 'sob' ? 'SOB: tối thiểu 30% theo yêu cầu Bộ Tài chính' : 'Chặn nếu CAR < 9% hoặc NPL > 3%')}
    </div>
    <div class="panel"><h2>Nguồn vốn dài hạn & vốn tự có</h2>
      ${arow('Giấy tờ có giá 3 năm', `lãi ~${pp(K.gt12 + 1 + B.healthSpread() * 0.5)}`, [1, 2, 5].map(x => ({ lbl: x + '% TS', act: 'issue', arg: [x, false] })), 'Tính vào nguồn TDH và mẫu số LDR')}
      ${arow('Trái phiếu cấp 2', `còn ${fmt0(Math.max(0, B.tier1() * 0.5 - B.subBonds))} tỷ dư địa`, [0.5, 1, 2].map(x => ({ lbl: x + '% TS', act: 'issue', arg: [x, true] })), 'Tăng vốn cấp 2, lãi cao hơn 1,5 điểm')}
      ${arow('Tăng vốn điều lệ', B.capitalRaisedThisYear ? 'đã dùng lượt năm nay' : 'một lần/năm', [10, 20, 40].map(x => ({ lbl: x + '% VĐL', act: 'raise', arg: x, disabled: B.capitalRaisedThisYear })), `Phí 2% · ${B.type === 'sob' ? 'cần Nhà nước duyệt (55%)' : 'cổ đông duyệt (85%)'}`)}
      ${arow('Bán nợ nhóm 4–5 cho VAMC', `${fmt0(sum(SECTORS.map(s => B.book[s.id].g4 + B.book[s.id].g5)))} tỷ`, [{ lbl: 'Bán', act: 'vamc' }], 'Nợ xấu giảm ngay, trích 20%/năm')}
    </div>
  </div>`;
}
function bindManage(B) {
  if (W.mode === 'sbv') { bindSbv(); return; }
  $('#pane').querySelectorAll('[data-act]').forEach(btn => btn.onclick = () => {
    const a = btn.dataset.act, arg = JSON.parse(btn.dataset.arg || 'null');
    if (a === 'rate') ACT.rate(B, arg[0], arg[1]); else if (a === 'num') ACT.num(B, ...arg); else if (a === 'mix') ACT.mix(B, arg[0], arg[1]); else if (a === 'preset') ACT.preset(B, arg);
    else if (a === 'issue') ACT.issue(B, arg[0], arg[1]); else if (a === 'raise') ACT.raise(B, arg); else if (a === 'vamc') ACT.vamc(B); else if (a === 'anchor') ACT.anchor(B);
    renderPane(); updateTop();
  });
}

/* ---------- Công cụ NHNN: chính sách bằng nút, nghiệp vụ OMO có kỳ hạn & đảo hạn, can thiệp tỷ giá ---------- */
const sbvUI = { tenor: 7, roll: 1, amt: 50000, usd: 2, fwdM: 3, fwdRoll: 0 };
const SBV = {
  rate(d) { const S = W.sbv; S.refi = +clamp(S.refi + d, 1, 12).toFixed(2); S.omo = +clamp(S.omo + d, 0.5, 11).toFixed(2); S.disc = +clamp(S.disc + d, 0.5, 10).toFixed(2); S.bill = +clamp(S.bill + d, 0.1, 15).toFixed(2); W.addLog(`NHNN ${d > 0 ? 'tăng' : 'giảm'} lãi suất điều hành ${Math.abs(d).toFixed(2).replace('.', ',')} điểm: tái cấp vốn ${pp(S.refi)}, OMO ${pp(S.omo)}.`, d > 0 ? 'warn' : 'good'); },
  set(k, d, lo, hi, name) { const S = W.sbv; S[k] = +clamp(S[k] + d, lo, hi).toFixed(2); W.addLog(`${name}: ${String(S[k]).replace('.', ',')}.`, ''); },
  toggle(k, name) { const S = W.sbv; S[k] = !S[k]; if (k === 'forbearance') W.forbearanceLeft = 0; W.addLog(`${name}: ${S[k] ? 'áp dụng' : 'bỏ'}.`, 'warn'); },
  omo(kind, amt, tenor, roll, rate) { const S = W.sbv; if (rate == null) rate = kind === 'inject' ? S.omo : S.bill; rate = +clamp(rate, 0.1, 15).toFixed(2); if (kind === 'inject') S.omo = rate; else S.bill = rate;
    S.ops.push({ id: Date.now() + Math.random(), kind, amt, tenor, roll, rate, left: tenor, start: W.month }); W.addLog(`${kind === 'inject' ? 'OMO bơm (mua kỳ hạn TPCP)' : 'Phát hành tín phiếu hút'} ${fmt0(amt)} tỷ, kỳ hạn ${tenor} ngày, lãi suất ${pp(rate)}, đảo hạn ${Math.round(roll * 100)}%.`, kind === 'inject' ? 'good' : 'warn'); W.recomputeOmo(); },
  askOmo(kind, amt, tenor, roll) { // mỗi đợt phát hành hỏi lãi suất
    const S = W.sbv; const base = kind === 'inject' ? S.omo : S.bill; const name = kind === 'inject' ? 'OMO bơm' : 'tín phiếu';
    const mk = d => ({ label: d === 0 ? `Giữ ${pp(base)}` : `${d > 0 ? 'Tăng lên' : 'Giảm xuống'} ${pp(base + d)} (${d > 0 ? '+' : ''}${d.toFixed(2).replace('.', ',')})`, apply: () => { SBV.omo(kind, amt, tenor, roll, base + d); renderPane(); updateTop(); } });
    showModal(`Đợt ${name} ${fmt0(amt)} tỷ, ${tenor} ngày, đảo hạn ${Math.round(roll * 100)}%`, `Lãi suất đợt này? ${kind === 'inject' ? 'Lãi bơm cao thì ngân hàng chỉ vay khi thật thiếu, thấp thì thị trường hạ nhiệt nhanh nhưng dễ dư tiền.' : 'Lãi tín phiếu cao hút mạnh, đẩy lãi liên ngân hàng lên (bảo vệ tỷ giá) nhưng tốn chi phí và siết tín dụng.'} Liên ngân hàng hiện ${pp(W.market.ibON)}, tái cấp vốn ${pp(S.refi)}.`, [mk(0), mk(0.25), mk(0.5), mk(-0.25), mk(-0.5)]);
  },
  spot(usd) { const S = W.sbv, M = W.macro; if (M.reserves < usd) { toast('Dự trữ không đủ.'); return; } M.reserves -= usd; M.fx -= usd * 0.3; S.fxSpot = (S.fxSpot || 0) + usd * 25000; W.addLog(`Bán giao ngay ${usd} tỷ USD can thiệp: dự trữ còn ${fmt1(M.reserves)} tỷ USD, hút ${fmt0(usd * 25000)} tỷ VND.`, 'warn'); },
  fwd(usd, months, roll, prem = 0.5) { const S = W.sbv, M = W.macro; S.ops.push({ id: Date.now() + Math.random(), kind: 'fwd', amt: usd, tenor: months, left: months, roll, prem, start: W.month }); M.fx -= usd * (0.16 - prem * 0.08); W.addLog(`Bán kỳ hạn ${usd} tỷ USD, ${months} tháng, tỷ giá kỳ hạn cao hơn giao ngay ${prem.toFixed(1).replace('.', ',')}%${roll ? ', tự gia hạn' : ''}: hạ nhiệt kỳ vọng ngay, dự trữ chỉ giảm khi đáo hạn (ngân hàng được hủy nếu VND đã ổn định).`, 'warn'); },
  askFwd(usd, months, roll) {
    const mk = prem => ({ label: prem === 0 ? 'Bằng giá giao ngay (hạ nhiệt mạnh, dễ bị hủy)' : `Cao hơn giao ngay ${prem.toFixed(1).replace('.', ',')}%${prem >= 1 ? ' (ít hấp dẫn, giữ dự trữ)' : ''}`, apply: () => { SBV.fwd(usd, months, roll, prem); renderPane(); updateTop(); } });
    showModal(`Bán kỳ hạn ${usd} tỷ USD, ${months} tháng`, `Đặt tỷ giá kỳ hạn so với giao ngay. Điểm kỳ hạn thấp thì ngân hàng mua nhiều, tỷ giá hạ nhanh nhưng đến hạn dễ hủy nếu VND ổn định (không mất dự trữ). VND đang mất giá ${pp(W.macro.fx, 1)}/năm.`, [mk(0.5), mk(0), mk(1.0), mk(1.5)]);
  },
  stopRoll(id) { const op = W.sbv.ops.find(o => o.id === id); if (op) { op.roll = 0; W.addLog('Dừng đảo hạn một nghiệp vụ; sẽ tất toán khi đáo hạn.', ''); } },

function bindSbv() {
  const pane = $('#pane');
  pane.querySelectorAll('[data-ui]').forEach(b => b.onclick = () => { sbvUI[b.dataset.ui] = +b.dataset.val; renderPane(); });
  pane.querySelectorAll('[data-act]').forEach(btn => btn.onclick = () => {
    const a = btn.dataset.act, arg = JSON.parse(btn.dataset.arg || 'null'); const u = sbvUI;
    if (a === 'rate') SBV.rate(arg); else if (a === 'set') SBV.set(...arg); else if (a === 'toggle') SBV.toggle(arg[0], arg[1]);
    else if (a === 'omo') { SBV.askOmo(arg, u.amt, u.tenor, u.roll); return; } else if (a === 'spot') SBV.spot(u.usd); else if (a === 'fwd') { SBV.askFwd(u.usd, u.fwdM, u.fwdRoll); return; } else if (a === 'stop') SBV.stopRoll(arg);
    else if (a === 'weak') SBV.weak(arg, +$('#weakBank').value);
    renderPane(); updateTop();
  });
}
function mergeBank(src, dst) {
  for (const s of SECTORS) for (const k of ['perf', 'w', 'g3', 'g4', 'g5']) dst.book[s.id][k] += src.book[s.id][k];
  for (const k in dst.dep) dst.dep[k] += src.dep[k];
  dst.cash += src.cash; dst.reserve += src.reserve; dst.ibLend += src.ibLend; dst.gbonds += src.gbonds; dst.fixed += src.fixed; dst.vamc += src.vamc; dst.prov += src.prov;
  dst.bonds += src.bonds; dst.subBonds += src.subBonds; dst.ibBorrow += src.ibBorrow; dst.refi += src.refi; dst.concentrated += src.concentrated; dst.wholesale += src.wholesale; dst.other += src.other; dst.otherA += src.otherA;
  dst.equity.retained += src.totalEquity(); dst.loansAtYearStart += src.loansAtYearStart;
  src.dead = true; src.deadReason = 'chuyển giao bắt buộc'; src.announced = true;
  for (const s of SECTORS) src.book[s.id] = { perf: 0, w: 0, g3: 0, g4: 0, g5: 0 };
  src.dep = { casa: 0, lt6: 0, m6_12: 0, gt12: 0 }; src.cash = 0; src.reserve = 0; src.ibLend = 0; src.gbonds = 0; src.fixed = 0; src.vamc = 0; src.prov = 0; src.bonds = 0; src.subBonds = 0; src.ibBorrow = 0; src.refi = 0; src.equity = { charter: 0, retained: 0 }; src.concentrated = 0; src.wholesale = 0; src.other = 0; src.otherA = 0;
}

function queueDecisions(evId) {
  W.decisions = W.decisions || []; W.cool = W.cool || {};
  const B = W.player;
  for (const d of DECISIONS) { if (d.mode !== W.mode) continue; if ((W.cool[d.id] || -99) > W.month) continue; try { if (d.cond(W, B)) { W.decisions.push({ d }); W.cool[d.id] = W.month + d.cool; } } catch (e) {} }
  if (evId) { const key = W.mode === 'sbv' && EVENT_DECISIONS[evId + '_sbv'] ? evId + '_sbv' : evId; const ed = EVENT_DECISIONS[key]; if (ed && ed.mode === W.mode) W.decisions.push({ d: ed, ev: true }); }
}
function showDecision() {
  const q = W.decisions; if (!q || !q.length) return false;
  const { d } = q[0]; const B = W.player; const text = typeof d.text === 'function' ? d.text(W, B) : d.text;
  Clock.playing = false; setPlayBtn();
  showModal((q[0].ev ? '' : 'Quyết định: ') + d.title, text, d.options.map(o => ({ label: o.label, apply: () => { o.apply(W, B); W.addLog(`Quyết định "${d.title}": ${o.label}.`, 'info'); q.shift(); renderGame(); if (q.length) showDecision(); } })));
  return true;
}

function gauge(label, val, lim, isMax, maxScale, exp, unit = '%') {
  const ok = isMax ? val <= lim : val >= lim; const warn = isMax ? val <= lim * 1.05 : val >= lim * 0.95 && !ok;
  const cls = ok ? (isMax ? (val > lim - lim * 0.06 ? 'warn' : '') : (val < lim * 1.12 ? 'warn' : '')) : 'bad';
  const w = clamp(val / maxScale * 100, 0, 100), l = clamp(lim / maxScale * 100, 0, 100);
  return `<div class="gauge"><div class="lbl"><span>${label}</span><span class="num">${pp(val)} <span class="muted">(${isMax ? '≤' : '≥'} ${pp(lim, 1)})</span> <span class="pill ${ok ? 'good' : 'bad'}">${ok ? 'Đạt' : 'Vi phạm'}</span></span></div>
    <div class="bar"><div class="fill ${cls}" style="width:${w}%"></div><div class="lim" style="left:${l}%"></div></div><div class="exp">${exp}</div></div>`;
}

function postMortem(B) {
  const h = B.hist; const pick = k => h.length > k ? h[h.length - 1 - k] : null; const cols = [12, 6, 3, 1, 0].map(k => ({ k, x: pick(k) })).filter(c => c.x);
  const row = (name, f, fmt) => `<tr><td>${name}</td>${cols.map(c => `<td class="r">${fmt(f(c.x))}</td>`).join('')}</tr>`;
  const table = `<div class="tw"><table><tr><th>Chỉ tiêu</th>${cols.map(c => `<th class="r">${c.k === 0 ? 'Tháng cuối' : c.k + ' tháng trước'}</th>`).join('')}</tr>
    ${row('CAR', x => x.car, v => pp(v, 1))}${row('Nợ xấu', x => x.npl, v => pp(v, 1))}${row('Dự trữ thanh khoản', x => x.liq, v => pp(v, 1))}${row('Vay liên NH + NHNN (tỷ)', x => x.ib, v => fmt0(v))}${row('LDR', x => x.ldr, v => pp(v, 0))}${row('LN tháng (tỷ)', x => x.net, v => fmt0(v))}${row('Tiền gửi (tỷ)', x => x.dep.casa + x.dep.lt6 + x.dep.m6_12 + x.dep.gt12, v => fmt0(v))}</table></div>`;
  const warns = B.log.filter(l => l.m >= W.month - 15 && (l.cls === 'bad' || l.cls === 'warn')).slice(0, 14).reverse().map(l => `<li><span class="muted">${W.dateStr(l.m)}</span> ${l.msg}</li>`).join('');
  const sys = W.log.filter(l => l.m >= W.month - 15 && /^Sự kiện|kiểm soát|tăng lãi suất|đóng băng/.test(l.msg)).slice(0, 8).reverse().map(l => `<li><span class="muted">${W.dateStr(l.m)}</span> ${l.msg}</li>`).join('');
  const why = B.deadReason.includes('thanh toán') ? 'Hai tháng liên tiếp tiền mặt âm: không đủ dự trữ bắt buộc và đệm, hạn mức vay liên ngân hàng (giảm theo sức khỏe: CAR thấp, nợ xấu cao, thanh khoản mỏng, uy tín giảm) và TPCP thế chấp vay NHNN đều đã cạn.'
    : B.deadReason.includes('âm vốn') ? 'Lỗ tích lũy (dự phòng nợ xấu, chi phí, phạt) ăn hết vốn: CAR rơi dưới 4%.'
    : B.deadReason.includes('12 tháng') ? 'CAR dưới mức tối thiểu 12 tháng liên tục mà không tăng vốn, không phát hành trái phiếu cấp 2, không giảm tài sản rủi ro.'
    : 'Ba năm ROE thấp hơn kỳ vọng của cổ đông hoặc Nhà nước quá 5 điểm.';
  return `<p><b>Cơ chế:</b> ${why}</p>${table}<p><b>Cảnh báo của ngân hàng 15 tháng trước:</b></p><ul class="replist">${warns || '<li>Không có cảnh báo nào được ghi.</li>'}</ul><p><b>Bối cảnh hệ thống:</b></p><ul class="replist">${sys || '<li>Không có.</li>'}</ul>`;
}

function fallbackCopy(txt) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Đã sao chép.'); } catch (e) { toast('Không sao chép được, hãy bôi đen văn bản trong Nhật ký.'); } ta.remove(); }

function guidePane() {
  return `<div class="panel guide">
    <h2>Cách chơi</h2>
    <p>Mỗi lượt là một tháng, chạy thời gian thực. Mọi tham số chỉnh bằng nút bấm ở tab <b>Điều hành</b>; khi một chỉ số vượt ngưỡng hoặc có sự kiện lớn, game tự dừng và đưa ra các lựa chọn xử lý (bạn vẫn có thể chọn "theo dõi thêm"). Engine tính lãi, chuyển nhóm nợ, huy động, giải ngân, cân đối thanh khoản rồi kiểm tra tuân thủ. Mục tiêu: tối đa hóa ROE và điểm CEO trong khi giữ mọi tỷ lệ trong ngưỡng. Vi phạm kéo dài dẫn tới kiểm soát đặc biệt.</p>
    <h3>Các ràng buộc theo mô hình Việt Nam</h3>
    <ul>
      <li><b>CAR ≥ 8%</b> (Thông tư 41/2016, Basel II). Vốn tự có / tài sản có rủi ro. BĐS 120%, tiêu dùng 150%, sản xuất 100%, nông nghiệp 80%, TPCP 0%. Cách tăng: giữ lại lợi nhuận, tăng vốn điều lệ, trái phiếu thứ cấp, đổi cơ cấu sang tài sản rủi ro thấp.</li>
      <li><b>LDR ≤ 85%</b> (Thông tư 22/2019). Dư nợ / (tiền gửi + giấy tờ có giá). Muốn cho vay thêm phải huy động thêm.</li>
      <li><b>Vốn ngắn hạn cho vay trung dài hạn ≤ 30%</b> (từ 10/2023). Cho vay mua nhà, BĐS là trung dài hạn; tiền gửi dưới 12 tháng là ngắn hạn. Cần tiền gửi ≥12 tháng, GTCG dài hạn hoặc vốn tự có.</li>
      <li><b>Dự trữ bắt buộc</b>: 3% tiền gửi dưới 12 tháng, 1% từ 12 tháng. Tiền này nằm ở NHNN, gần như không sinh lãi.</li>
      <li><b>Dự trữ thanh khoản ≥ 10%</b> tổng nợ phải trả: tiền mặt, DTBB, TPCP, cho vay liên NH.</li>
      <li><b>Trần lãi suất huy động dưới 6 tháng</b> (hiện 4,75%). Vượt là bị phạt. Trần lãi cho vay ngắn hạn lĩnh vực ưu tiên 4%.</li>
      <li><b>Room tín dụng</b>: NHNN cấp hạn mức tăng trưởng mỗi năm theo xếp hạng (CAR cao, nợ xấu thấp được nhiều). Vượt room bị phạt và cắt room năm sau. Giữa năm có thể được nới.</li>
      <li><b>Phân loại nợ 5 nhóm và trích lập</b> (Thông tư 11/2021): nhóm 2: 5%, 3: 20%, 4: 50%, 5: 100% sau khấu trừ tài sản bảo đảm, cộng dự phòng chung 0,75%. Nợ xấu trên 3%: không chia cổ tức, không nới room.</li>
      <li><b>Giới hạn cấp tín dụng một khách hàng</b> (Luật TCTD 2024): 14% vốn tự có, giảm dần về 10%. Xuất hiện trong sự kiện tập đoàn BĐS xin vay.</li>
    </ul>
    <h3>Cơ chế thanh khoản</h3>
    <p>Cuối tháng, tiền mặt thấp hơn đệm mục tiêu thì ngân hàng vay liên ngân hàng (tối đa ~20% tiền gửi, giảm khi yếu) với lãi O/N cộng phụ trội sức khỏe. Hết hạn mức thì vay OMO/tái cấp vốn NHNN bằng TPCP thế chấp (90% giá trị). Hết cả hai thì bán TPCP giá thấp, sau đó là mất thanh khoản: khách rút tiền, hai tháng liên tiếp là kiểm soát đặc biệt. Vì vậy TPCP vừa là đệm thanh khoản vừa là tài sản không tốn vốn.</p>
    <h3>Đánh đổi chính</h3>
    <ul>
      <li>Lãi suất huy động cao → tiền gửi tăng nhanh nhưng NIM giảm. CASA là nguồn rẻ nhất, tăng nhờ số hóa và mạng lưới, chậm.</li>
      <li>Lãi suất cho vay cao → biên cao nhưng cầu giảm và khách trả nợ kém hơn.</li>
      <li>Khẩu vị rủi ro cao → tăng trưởng và biên cao, nợ xấu hình thành nhanh gấp đôi khi vĩ mô xấu.</li>
      <li>BĐS và tiêu dùng cho lợi suất cao nhưng ăn CAR nhanh nhất và nhạy nhất với chu kỳ.</li>
      <li>Trả cổ tức tiền mặt làm vui cổ đông nhưng CAR mỏng đi; ngân hàng quốc doanh khó tăng vốn nên phải giữ lợi nhuận.</li>
    </ul>
    <h3>Khối vĩ mô có ràng buộc</h3>
    <p>Tăng trưởng, lạm phát, thất nghiệp và lãi suất gắn với nhau bằng bốn phương trình chuẩn (xem bảng "Ràng buộc vĩ mô" ở Tổng quan với số hiện tại): khoảng cách sản lượng tích lũy từ chênh lệch tăng trưởng so với tiềm năng 6,5%; đường IS kéo tăng trưởng về tiềm năng trừ tác động của lãi suất thực (lãi điều hành trừ kỳ vọng lạm phát) cộng xung lực tín dụng; đường Phillips đẩy lạm phát theo khoảng cách sản lượng, tiền tệ, tỷ giá và neo kỳ vọng 3,5%; định luật Okun kéo thất nghiệp về 2,3% trừ 0,35 lần chênh lệch tăng trưởng; quy tắc Taylor cho mức lãi suất điều hành gợi ý. Thất nghiệp và lãi suất thực cao làm nợ xấu hình thành nhanh hơn.</p>
    <h3>Chế độ Thống đốc NHNN</h3>
    <p>Bạn điều hành cả hệ thống bằng các nghiệp vụ thật: OMO bơm (mua kỳ hạn TPCP) hoặc hút (tín phiếu) với kỳ hạn 7/14/28/91 ngày và tỷ lệ đảo hạn khi đến hạn; bán USD giao ngay (tốn dự trữ ngay) hoặc bán kỳ hạn 3–6 tháng (hạ nhiệt kỳ vọng, dự trữ chỉ giảm khi đáo hạn, ngân hàng được hủy nếu VND ổn định). Lãi suất tái cấp vốn neo lãi suất thị trường; dự trữ bắt buộc hút hoặc bơm tiền cơ sở; room tín dụng và các trần LDR, vốn ngắn hạn cho vay TDH khống chế tốc độ và cấu trúc tăng trưởng. Tỷ giá phụ thuộc chênh lệch lãi suất VND–USD: lãi liên ngân hàng thấp hơn Fed nhiều thì VND mất giá, bạn phải bán dự trữ hoặc hút tiền. Tín dụng tăng nhanh đẩy GDP nhưng kéo CPI và BĐS lên với độ trễ.</p>
    <h3>Ghi chú</h3>
    <p>Đây là mô hình rút gọn để học và thử chính sách. Các hệ số co giãn, xác suất chuyển nhóm nợ và quy mô ngân hàng là giả định, không phải số liệu thật của bất kỳ ngân hàng nào. Có thể lưu ván chơi vào trình duyệt bằng nút Lưu.</p>
  </div>`;
}

function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function buildReport() {
  const B = W.player; const m = W.month;
  const evs = W.log.filter(l => l.m === m && /^Sự kiện/.test(l.msg)).map(l => l.msg.replace(/^Sự kiện: /, ''));
  if (B) {
    const h = B.hist, cur = h[h.length - 1], prev = h.length > 1 ? h[h.length - 2] : null; const mech = B.mech || {}; const p = B.lastPnl;
    const dep = cur.dep.casa + cur.dep.lt6 + cur.dep.m6_12 + cur.dep.gt12; const depP = prev ? prev.dep.casa + prev.dep.lt6 + prev.dep.m6_12 + prev.dep.gt12 : dep;
    const d = (a, b) => a - b; const sgn = v => (v >= 0 ? '+' : '−') + fmt0(Math.abs(v));
    const lines = [];
    lines.push(`Huy động ${fmt0(dep)} tỷ (${sgn(d(dep, depP))}, ${pp((dep / Math.max(1, depP) - 1) * 100, 1)}); CASA ${pp(cur.dep.casa / Math.max(1, dep) * 100, 0)}. Dư nợ ${fmt0(cur.loans)} tỷ (${sgn(d(cur.loans, prev ? prev.loans : cur.loans))}); giải ngân ${fmt0(mech.disb || 0)} / cầu ${fmt0(mech.demand || 0)}${B.binds && B.binds.length ? ', bị chặn bởi ' + B.binds.join(', ') : ''}.`);
    lines.push(`Chu kỳ ${W.cyclePhase().name.toLowerCase()}: lãi huy động hệ thống ${pp(cur.depSys ?? 0)}, cho vay hệ thống ${pp(cur.lendSys ?? 0)}, USD/VND ${fmt0(cur.usd ?? 0)}.`);
    lines.push(`Thu nhập lãi thuần ${fmt0(p.ii - p.ie)} tỷ, NIM ${pp(cur.nim)}, chi phí vốn ${pp(cur.cof)}. Dự phòng ${fmt0(p.prov)}, chi phí ${fmt0(p.opex)}. Lợi nhuận sau thuế ${fmt0(p.net)} tỷ, ROE ${pp(cur.roe, 1)}${prev ? ` (tháng trước ${fmt0(prev.net)})` : ''}.`);
    lines.push(`Nợ xấu ${pp(cur.npl)}${prev ? ` (${(cur.npl - prev.npl >= 0 ? '+' : '') + (cur.npl - prev.npl).toFixed(2).replace('.', ',')} điểm)` : ''}, xóa nợ ${fmt0(mech.writeoff || 0)}. CAR ${pp(cur.car)}${prev ? ` (${(cur.car - prev.car >= 0 ? '+' : '') + (cur.car - prev.car).toFixed(2).replace('.', ',')})` : ''}, LDR ${pp(cur.ldr, 1)}, vốn NH→TDH ${pp(cur.mlt, 1)}, dự trữ thanh khoản ${pp(cur.liq, 1)}. Vay liên NH/NHNN ${fmt0(cur.ib)} tỷ.`);
    const warns = [];
    if (cur.car < W.sbv.carMin) warns.push('CAR dưới tối thiểu'); if (cur.ldr > W.sbv.ldrMax) warns.push('LDR vượt trần'); if (cur.mlt > W.sbv.mltMax) warns.push('vốn NH→TDH vượt trần'); if (cur.npl > 3) warns.push('nợ xấu > 3%'); if (cur.liq < 10) warns.push('thanh khoản < 10%'); if (W.sbv.roomOn && cur.growth > B.room) warns.push('vượt room');
    if (warns.length) lines.push('Vi phạm: ' + warns.join('; ') + '.');
    if (evs.length) lines.push('Sự kiện: ' + evs.join('; ') + '.');
    let adv = '';
    const bd = B.binds || [];
    if (bd.includes('CAR mục tiêu')) adv = 'Vốn đang là nút thắt: giữ lại lợi nhuận, phát hành trái phiếu thứ cấp hoặc tăng vốn; giảm tỷ trọng BĐS, tiêu dùng.';
    else if (bd.some(x => x.startsWith('LDR'))) adv = 'Thiếu nguồn: nâng lãi huy động 6–12 tháng hoặc phát hành GTCG trước khi cho vay thêm.';
    else if (bd.includes('room tín dụng')) adv = 'Hết room: chuyển sang tối ưu biên (CASA, phí), chờ NHNN nới room.';
    else if (bd.includes('thanh khoản')) adv = 'Thanh khoản mỏng: tăng đệm tiền mặt, giữ thêm TPCP, giảm phụ thuộc liên ngân hàng.';

function drawCharts(B) {
  if (tab === 'dash') { drawDash(B); return; }
  if (tab !== 'overview') return;
  if (W.mode === 'bank') {
    const h = B.hist.slice(-36); if (!h.length) return; const m0 = h[0].m;
    lineChart('c1', [{ color: '--s1', data: h.map(x => x.car) }, { color: '--s2', data: h.map(x => x.npl) }, { color: '--s3', data: h.map(x => x.mlt) }, { color: '--s4', data: h.map(x => x.ldr / 10) }], { m0, lines: [W.sbv.carMin] });
    lineChart('c2', [{ color: '--s1', data: h.map(x => x.roe) }, { color: '--s2', data: h.map(x => x.nim) }, { color: '--s3', data: h.map(x => x.cof) }], { m0 });
    stackChart('c3', [{ color: '--s1', data: h.map(x => x.dep.casa) }, { color: '--s2', data: h.map(x => x.dep.lt6 + x.dep.m6_12) }, { color: '--s3', data: h.map(x => x.dep.gt12) }, { color: '--s4', data: h.map(x => x.bonds) }, { color: '--s5', data: h.map(x => x.ib) }, { color: '--s6', data: h.map(x => x.eq) }], m0);
  } else {
    const h = W.hist.slice(-36); if (!h.length) return; const m0 = h[0].m;
    lineChart('c1', [{ color: '--s1', data: h.map(x => x.cpi) }, { color: '--s2', data: h.map(x => x.gdp) }, { color: '--s3', data: h.map(x => x.fx) }, { color: '--s4', data: h.map(x => x.refi) }], { m0 });
    lineChart('c2', [{ color: '--s1', data: h.map(x => x.cg) }, { color: '--s2', data: h.map(x => x.npl) }, { color: '--s3', data: h.map(x => x.ibON) }], { m0, lines: [3] });
    stackChart('c3', [{ color: '--s1', data: h.map(x => x.loans / 1000) }], m0);
  }
}

/* ---------- Modal, sự kiện, lưu ---------- */
function showModal(title, text, choices) {
  Clock.playing = false; setPlayBtn();
  $('#modal').innerHTML = `<div class="overlay"><div class="modal"><h3>${title}</h3><p>${text}</p><div class="choices">${choices.map((c, i) => `<button class="btn ${i === 0 ? 'primary' : ''}" data-i="${i}">${c.label}</button>`).join('')}</div></div></div>`;
  $('#modal').querySelectorAll('button').forEach(b => b.onclick = () => { $('#modal').innerHTML = ''; choices[+b.dataset.i].apply(); });
}
function showEvent() {
  const ev = W.pendingEvent; if (!ev) return;
  const text = typeof ev.text === 'function' ? ev.text(W) : ev.text;
  if (!ev.animated) { ev.animated = true; Scene.playEvent(ev); }
  if (ev.choice) showModal('Sự kiện: ' + ev.title, text, ev.choices.map(c => ({ label: c.label, apply: () => { c.apply(W); W.addLog(`Sự kiện: ${ev.title} → ${c.label}`, 'warn'); W.pendingEvent = null; ev.animated = false; renderGame(); } })));
  else { showEventCard(ev.title, text); W.pendingEvent = null; ev.animated = false; renderGame(); }
}
let evCardTimer = null;
function showEventCard(title, text) {
  const el = $('#evcard'); if (!el) return; el.hidden = false; el.innerHTML = `<h4></h4><div class="txt"></div><button class="btn small">Đóng</button>`;
  el.querySelector('h4').textContent = 'Sự kiện: ' + title; el.querySelector('.txt').textContent = text;
  el.querySelector('button').onclick = () => { el.hidden = true; };
  clearTimeout(evCardTimer); evCardTimer = setTimeout(() => { el.hidden = true; }, 14000);
}
function toast(m) { const el = document.createElement('div'); el.className = 'pill info'; el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:8px 14px;font-size:13px;z-index:30;background:var(--panel);border:1px solid var(--line);color:var(--fg)'; el.textContent = m; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }
function saveGame() { try { const data = JSON.stringify(W, (k, v) => (k === 'pendingEvent' ? null : v)); localStorage.setItem('banksim-vn', data); return true; } catch (e) { return false; } }
function loadGame() {
  try {
    const raw = localStorage.getItem('banksim-vn'); if (!raw) return false;
    const d = JSON.parse(raw); const w = new World(d.mode, d.playerId, d.diffKey);
    Object.assign(w, d); w.banks = d.banks.map(bd => { const b = new Bank(BANKS.find(x => x.id === bd.id), bd.isPlayer); Object.assign(b, bd); return b; });
    w.player = d.mode === 'bank' ? w.banks.find(b => b.isPlayer) : null; w.pendingEvent = null; w.sbv.ops = w.sbv.ops || []; w.sbv.bill = w.sbv.bill ?? w.sbv.omo - 0.5; w.decisions = []; W = w; return true;
  } catch (e) { return false; }
}

renderStart();
window.addEventListener('resize', () => { if (W) drawCharts(W.mode === 'bank' ? W.player : W.banks[selectedBank]); });
</script>
